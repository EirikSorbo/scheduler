    <title>Schedule</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --primær: #3b82f6;
            --primær-lys: #eff6ff;
            --primær-mørk: #1e3a5f;
            --primær-mid: #bfdbfe;
            --tekst: #1e3a5f;
            --tekst-sek: #4b7ab0;
            --kant: #bfdbfe;
            --bg: #f0f7ff;
            --hvit: #ffffff;
            --r: 12px;
            --rs: 8px;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--bg);
            color: var(--tekst);
            min-height: 100vh;
            font-size: 15px;
            line-height: 1.5;
        }

        /* ── Login Overlay ── */
        #loginOverlay {
            display: flex;
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }

        #loginOverlay button {
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 13px 28px;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
        }

        #loginOverlay button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59,130,246,0.3);
        }

        /* ── Header ── */
        header {
            background: var(--hvit);
            border-bottom: 1px solid var(--kant);
            padding: 0 20px;
            display: none;
            align-items: center;
            justify-content: space-between;
            height: 64px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 17px;
            color: var(--primær);
            letter-spacing: -0.3px;
        }

        .header-handlinger { display: flex; gap: 12px; align-items: center; }

        .bruker-navn { font-weight: 600; color: var(--tekst); font-size: 0.9em; }
        .bruker-rolle { font-size: 0.8em; color: var(--tekst-sek); text-align: right; }

        .header-knapp {
            width: 36px; height: 36px;
            border-radius: 50%;
            border: 1px solid var(--kant);
            background: var(--hvit);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            color: var(--tekst-sek);
            font-size: 16px;
            transition: all 0.15s;
        }
        .header-knapp:hover { background: var(--primær-lys); color: var(--primær); border-color: var(--primær-mid); }

        /* ── Paneler ── */
        .panel { display: none; }
        .panel.aktiv { display: block; }

        main { max-width: 1000px; margin: 0 auto; padding: 20px 12px 64px; }

        /* ── Admin Grid ── */
        .admin-grid { display: flex; flex-direction: column; gap: 20px; }

        .admin-toprad {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .admin-toprad .legg-til-knapp {
            margin: 0;
            width: auto;
            padding: 8px 16px;
        }

        .kort { background: var(--hvit); border-radius: var(--r); border: 1px solid var(--kant); overflow: hidden; }

        .kort-header { padding: 16px 20px; border-bottom: 1px solid var(--kant); background: var(--primær-lys); }

        .kort-tittel {
            font-family: 'Syne', sans-serif;
            font-weight: 700; font-size: 14px;
            color: var(--primær-mørk);
            text-transform: uppercase; letter-spacing: 0.3px;
        }

        .møte-liste {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 12px 16px;
        }

        .møte-item {
            padding: 8px 16px;
            border-radius: 20px;
            border: 2px solid var(--kant);
            background: var(--hvit);
            cursor: pointer;
            transition: all 0.15s;
            border-left: 2px solid var(--kant);
        }
        .møte-item:hover { background: var(--primær-lys); border-color: var(--primær-mid); }
        .møte-item.aktiv { background: var(--primær-lys); border-color: var(--primær); }

        .møte-tittel { font-weight: 700; font-size: 13px; color: var(--tekst); }
        .møte-meta { font-size: 11px; color: var(--tekst-sek); margin-top: 2px; }

        .legg-til-knapp {
            background: var(--primær); color: white; border: none;
            border-radius: var(--rs);
            padding: 9px 16px;
            font-family: 'Syne', sans-serif; font-weight: 700; font-size: 12px;
            text-transform: uppercase; letter-spacing: 0.4px;
            cursor: pointer; transition: background 0.15s;
        }
        .legg-til-knapp:hover { background: var(--primær-mørk); }

        .tom-melding { padding: 32px 20px; text-align: center; color: var(--tekst-sek); font-size: 14px; }

        #detaljSection { display: none; }
        #detaljSection.vis { display: block; }

        .kort-innhold { padding: 20px; }

        .form-gruppe { margin-bottom: 20px; }

        label {
            display: block; font-weight: 700; margin-bottom: 8px;
            color: var(--tekst); font-size: 0.95em; font-family: 'Syne', sans-serif;
        }

        input[type="text"], input[type="datetime-local"], textarea {
            width: 100%; padding: 10px 12px;
            border: 2px solid var(--kant); border-radius: var(--rs);
            font-size: 0.95em; font-family: 'Nunito', sans-serif;
            transition: border-color 0.2s;
        }
        input:focus, textarea:focus {
            outline: none; border-color: var(--primær);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
        }
        textarea { resize: vertical; min-height: 80px; }

        .tider-container { background: var(--primær-lys); padding: 16px; border-radius: var(--rs); margin: 12px 0; }
        .tid-slot { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
        .tid-slot:last-child { margin-bottom: 0; }
        .tid-slot input { flex: 1; }

        /* ── Hendelsestype-toggle ── */
        .type-toggle {
            display: flex; gap: 0;
            border: 2px solid var(--kant);
            border-radius: var(--rs);
            overflow: hidden;
            margin-bottom: 20px;
        }
        .type-toggle button {
            flex: 1; padding: 9px 16px;
            border: none; border-radius: 0;
            background: var(--hvit); color: var(--tekst-sek);
            font-family: 'Syne', sans-serif; font-weight: 700;
            font-size: 12px; text-transform: uppercase;
            letter-spacing: 0.4px; cursor: pointer;
            transition: all 0.15s;
        }
        .type-toggle button:first-child { border-right: 2px solid var(--kant); }
        .type-toggle button.aktiv { background: var(--primær); color: white; }
        .type-toggle button:hover:not(.aktiv) { background: var(--primær-lys); }

        /* ── Månedskalender ── */
        .maaned-nav {
            display: flex; align-items: center;
            justify-content: space-between; margin-bottom: 12px;
        }
        .maaned-label {
            font-family: 'Syne', sans-serif; font-weight: 700;
            font-size: 14px; color: var(--tekst);
            text-transform: capitalize;
        }
        .maaned-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }
        .maaned-dag-header {
            text-align: center;
            font-family: 'Syne', sans-serif;
            font-size: 11px; font-weight: 700;
            color: var(--tekst-sek);
            text-transform: uppercase;
            padding: 4px 0;
        }
        .maaned-dag {
            aspect-ratio: 1;
            display: flex; align-items: center; justify-content: center;
            border-radius: 8px;
            font-size: 13px; font-weight: 600;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.15s;
            color: var(--tekst);
            background: var(--hvit);
        }
        .maaned-dag:hover:not(.tom):not(.fortid) { background: var(--primær-lys); border-color: var(--primær-mid); }
        .maaned-dag.tom { visibility: hidden; cursor: default; }
        .maaned-dag.fortid { color: var(--kant); cursor: default; }
        .maaned-dag.valgt { background: #1d4ed8; color: white; border-color: #1d4ed8; }
        .maaned-dag.i-dag:not(.valgt) { border-color: var(--primær-mid); }
        .maaned-dag:hover:not(.tom):not(.fortid):not(.valgt) { background: var(--primær-lys); border-color: var(--primær-mid); }
        .maaned-dag.valgt:hover { background: #1e40af; border-color: #1e40af; }

        /* Participant-kalender */
        .deltaker-dag {
            aspect-ratio: 1;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            border-radius: 8px;
            font-size: 12px; font-weight: 600;
            cursor: pointer;
            border: 2px solid var(--kant);
            transition: all 0.15s;
            color: var(--tekst);
            background: var(--hvit);
            gap: 2px;
        }
        .deltaker-dag.tom { visibility: hidden; cursor: default; }
        .deltaker-dag .dag-nr { font-size: 13px; font-weight: 700; }
        .deltaker-dag .dag-svar { font-size: 9px; font-weight: 700; font-family: 'Syne', sans-serif; }
        .deltaker-dag.kan { background: #d1fae5; color: #065f46; border-color: #6ee7b7; }
        .timeplan-nav {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 12px;
        }
        .timeplan-dato {
            font-family: 'Syne', sans-serif; font-weight: 700;
            font-size: 14px; color: var(--tekst);
            text-transform: capitalize;
        }
        .timeplan-nav-knapp {
            background: var(--hvit); border: 1px solid var(--kant);
            border-radius: var(--rs); width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--tekst-sek); font-size: 16px;
            transition: all 0.15s;
        }
        .timeplan-nav-knapp:hover { background: var(--primær-lys); color: var(--primær); border-color: var(--primær-mid); }

        .timeplan-grid {
            position: relative;
            overflow: hidden;
            background: var(--hvit);
        }
        .timeplan-slot {
            display: flex; align-items: flex-start;
            height: 18px;
            border-bottom: 1px solid var(--kant);
            cursor: pointer;
            transition: background 0.1s;
            position: relative;
        }
        .timeplan-slot:last-child { border-bottom: none; }
        .timeplan-slot:hover { background: var(--primær-lys); }
        .timeplan-slot.hel-time { border-bottom: 2px solid var(--primær-mid); }
        .timeplan-slot.halvtime { border-bottom: 1px solid var(--kant); }
        .timeplan-slot.stiplet { border-bottom: 1px dashed rgba(59,130,246,0.2); }
        .timeplan-tid {
            width: 48px; min-width: 48px;
            font-size: 11px; color: var(--tekst-sek);
            padding: 3px 6px; font-weight: 600;
            font-family: 'Syne', sans-serif;
            border-right: 1px solid var(--kant);
            background: var(--primær-lys);
        }
        .timeplan-slot.hel-time .timeplan-tid { color: var(--primær); }
        .timeplan-innhold { flex: 1; position: relative; }

        .timeplan-blokk {
            position: absolute;
            left: 4px; right: 4px;
            background: var(--primær);
            border-radius: 4px;
            z-index: 2;
            cursor: pointer;
            display: flex; align-items: center;
            padding: 0 8px;
            font-size: 11px; font-weight: 700;
            color: white; font-family: 'Syne', sans-serif;
            transition: opacity 0.15s;
            overflow: hidden;
        }
        .timeplan-blokk:hover { opacity: 0.85; }

        .dato-varighet-rad {
            display: flex; gap: 12px; margin-bottom: 20px;
        }
        .dato-varighet-rad .form-gruppe {
            flex: 1; margin-bottom: 0;
        }
        /* Date-input samme stil som resten */
        input[type="date"] {
            width: 100%; padding: 10px 12px;
            border: 2px solid var(--kant); border-radius: var(--rs);
            font-size: 0.95em; font-family: 'Nunito', sans-serif;
            transition: border-color 0.2s; background: var(--hvit);
        }
        input[type="date"]:focus {
            outline: none; border-color: var(--primær);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
        }
        /* Timeplan med scrollbar */
        .timeplan-wrapper {
            height: 280px;
            overflow-y: auto;
            border: 1px solid var(--kant);
            border-radius: var(--rs);
            scroll-behavior: smooth;
        }
        .timeplan-wrapper::-webkit-scrollbar { width: 6px; }
        .timeplan-wrapper::-webkit-scrollbar-track { background: var(--primær-lys); }
        .timeplan-wrapper::-webkit-scrollbar-thumb { background: var(--primær-mid); border-radius: 3px; }

        button {
            padding: 10px 16px; border: none; border-radius: var(--rs);
            font-size: 0.95em; font-weight: 600; cursor: pointer;
            transition: all 0.2s; font-family: 'Syne', sans-serif;
        }
        .btn-primær { background: var(--primær); color: white; }
        .btn-primær:hover { background: var(--primær-mørk); }
        .btn-sekundær { background: var(--kant); color: var(--tekst); }
        .btn-sekundær:hover { background: var(--primær-mid); }
        .btn-fare { background: #f87171; color: white; }
        .btn-fare:hover { background: #dc2626; }

        .knapp-gruppe { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
        .knapp-gruppe button { flex: 1; min-width: 120px; }

        /* ── Resultater ── */
        .resultater-tabell { width: 100%; border-collapse: collapse; margin: 16px 0; overflow-x: auto; display: block; }
        .resultater-tabell th {
            background: var(--primær-lys); padding: 12px; text-align: left;
            font-weight: 700; color: var(--primær-mørk);
            border-bottom: 2px solid var(--kant);
            font-family: 'Syne', sans-serif; font-size: 12px;
            white-space: nowrap;
        }
        .resultater-tabell td { padding: 12px; border-bottom: 1px solid var(--kant); }
        .resultater-tabell tr:hover { background: var(--primær-lys); }
        .stemme-ja { color: #10b981; font-weight: 700; }
        .stemme-nei { color: #f87171; font-weight: 700; }

        .deling-boks {
            background: var(--primær-lys); padding: 16px;
            border-radius: var(--r); margin: 16px 0;
            border: 2px solid var(--primær-mid);
            display: flex; gap: 8px;
        }
        .deling-boks input { flex: 1; background: var(--hvit); border: 1px solid var(--kant); }

        /* ── Participant ── */
        /* ── Blå tema for deltaker-panel ── */
        #deltakerPanel { background: var(--bg); min-height: 100vh; }

        #deltakerPanel .møte-header {
            background: white;
            border: 1px solid var(--kant);
            border-left: 4px solid var(--primær);
        }
        #deltakerPanel .møte-header h2 { color: var(--primær); }
        #deltakerPanel .møte-header p { color: var(--tekst-sek); }

        #deltakerPanel .kort {
            border-color: var(--kant);
        }

        #deltakerPanel .tid-kort {
            border: 1px solid var(--kant);
            border-left: 4px solid var(--primær);
        }
        #deltakerPanel .tid-tekst { color: var(--primær-mørk); }
        #deltakerPanel .tid-stemmer { color: var(--tekst-sek); }

        #deltakerPanel input[type="text"] {
            border-color: var(--kant);
        }
        #deltakerPanel input[type="text"]:focus {
            border-color: var(--primær);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
        }

        #deltakerPanel label { color: var(--primær-mørk); }



        #deltakerPanel .fritekst-kort {
            background: #fff5f5;
            border-color: #fecaca;
            border-left-color: #f87171;
        }
        #deltakerPanel .fritekst-tekst { color: #991b1b; }
        #deltakerPanel .velg-knapp {
            background: #ef4444;
            border-color: #ef4444;
            color: white;
        }
        #deltakerPanel .velg-knapp:hover { background: #dc2626; border-color: #dc2626; }
        #deltakerPanel .velg-knapp.valgt { background: #ef4444; color: white; border-color: #ef4444; font-weight: 900; }

        /* Override alle gjenværende lilla */
        #deltakerPanel .tid-kort { border-left-color: var(--primær); }
        #deltakerPanel .deling-boks { background: var(--primær-lys); border-color: var(--primær-mid); }
        #deltakerPanel .suksess-melding {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
            border-radius: var(--rs);
            padding: 12px 16px;
            text-align: center;
            font-weight: 700;
            font-family: 'Syne', sans-serif;
        }

        .møte-header {
            background: var(--hvit); padding: 24px;
            border-radius: var(--r); margin-bottom: 24px;
            border: 1px solid var(--kant); border-left: 4px solid var(--primær);
        }
        .møte-header h2 { color: var(--primær); margin-bottom: 8px; font-family: 'Syne', sans-serif; }
        .møte-header p { color: var(--tekst-sek); font-size: 0.95em; }

        .tid-kort {
            background: var(--hvit); padding: 10px 14px;
            border-radius: var(--r); margin-bottom: 8px;
            border: 1px solid var(--kant); border-left: 4px solid var(--primær);
        }
        .tid-rad {
            display: flex; align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .tid-tekst { font-weight: 700; color: var(--tekst); font-size: 0.95em; font-family: 'Syne', sans-serif; }
        .tid-stemmer { font-size: 0.85em; color: var(--tekst-sek); white-space: nowrap; margin-left: 12px; }

        .stemme-knapp-gruppe { display: flex; gap: 6px; }
        .stemme-knapp {
            flex: 1; padding: 7px 10px;
            border: 2px solid var(--kant); background: var(--hvit);
            border-radius: var(--rs); cursor: pointer;
            font-weight: 700; transition: all 0.2s;
            font-size: 0.88em; font-family: 'Syne', sans-serif;
        }
        .stemme-knapp { border-color: #6ee7b7; }
        .stemme-knapp:hover { border-color: #6ee7b7; background: #d1fae5; color: #065f46; }
        .stemme-knapp.valgt-ja { background: #d1fae5; color: #065f46; border-color: #6ee7b7; }
        .stemme-knapp.valgt { background: var(--primær); color: white; border-color: var(--primær); }

        .suksess-melding {
            background: var(--primær-lys); color: var(--primær-mørk);
            padding: 16px; border-radius: var(--rs);
            margin-top: 24px; text-align: center;
            font-weight: 700; border: 2px solid var(--primær);
        }

        .fritekst-kort {
            background: #fdf6ec; padding: 10px 14px;
            border-radius: var(--r); margin-bottom: 8px;
            border: 1px solid #f5d49a; border-left: 4px solid #e8a020;
        }
        .fritekst-tekst {
            font-weight: 700; color: #7c4a00; font-size: 0.95em;
            font-family: 'Syne', sans-serif; margin-bottom: 8px;
        }
        .velg-knapp {
            width: 100%; padding: 8px 12px;
            border: 2px solid #f5d49a; background: #fdf6ec;
            border-radius: var(--rs); cursor: pointer;
            font-weight: 700; transition: all 0.2s;
            font-size: 0.88em; font-family: 'Syne', sans-serif;
            color: #7c4a00;
        }
        .velg-knapp:hover { border-color: #e8a020; background: #faebd0; }
        .velg-knapp.valgt { background: #e8a020; color: white; border-color: #e8a020; }

        .resultater-deltaker {
            margin-top: 28px;
            border-top: 2px solid var(--kant);
            padding-top: 20px;
        }
        .resultater-deltaker-tittel {
            font-family: 'Syne', sans-serif; font-weight: 700;
            font-size: 13px; text-transform: uppercase;
            letter-spacing: 0.4px; color: var(--tekst-sek);
            margin-bottom: 12px;
        }
        .resultat-rad {
            display: flex; align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: var(--hvit);
            border-radius: var(--rs);
            border: 1px solid var(--kant);
            margin-bottom: 6px;
            font-size: 0.88em;
        }
        .resultat-tid { color: var(--tekst); font-weight: 600; }
        .resultat-tall { color: var(--tekst-sek); }

        @media (max-width: 768px) {
            .knapp-gruppe { flex-direction: column; }
            .knapp-gruppe button { width: 100%; }
        }

                .mobil-tilbake {
            display: flex;
            align-items: center;
            gap: 8px;
            background: none;
            border: none;
            color: var(--primær);
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 14px;
            padding: 0 0 16px 0;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            /* ── Admin: one panel at a time ── */
            #detaljSection { display: none !important; }
            #detaljSection.vis-mobil { display: block !important; }
            #møteKort { display: block; }
            #møteKort.skjult-mobil { display: none; }

            /* ── Timeplan: større touchmål ── */
            .timeplan-slot { height: 32px; }
            .timeplan-slot.hel-time { border-bottom: 2px solid var(--primær-mid); }
            .timeplan-slot.stiplet { border-bottom: 1px dashed rgba(59,130,246,0.2); }
            .timeplan-wrapper { height: 320px; }
            .timeplan-tid { font-size: 12px; padding: 6px; width: 44px; min-width: 44px; }

            /* ── Participant: mer luft ── */
            .tid-kort { padding: 14px 16px; margin-bottom: 12px; }
            .tid-rad { margin-bottom: 12px; }
            .stemme-knapp { padding: 12px; font-size: 0.95em; }
            .deltaker-container { padding: 0 4px; }

            main { padding: 12px 8px 80px; }
        }
    </style>
</head>

            apiKey: "AIzaSyDvR6Jlt9j7ECudDhF1VtPPr2G3gcEqXCA",
            authDomain: "scheduler-2be23.firebaseapp.com",
            projectId: "scheduler-2be23",
            storageBucket: "scheduler-2be23.firebasestorage.app",
            messagingSenderId: "547633808881",
            appId: "1:547633808881:web:e761037ef250b715e07050"
        };

        const app  = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db   = getFirestore(app);

        // ── State ──
        let currentUser  = null;
        let currentMøteId = null;
        let møter        = {};
        let redigeringsModus = false;
        let unsubscribeMøter = null; // for å rydde opp onSnapshot-lytter

        // ── Sjekk URL umiddelbart ──
        const urlParams     = new URLSearchParams(window.location.search);
        const møteIdFraUrl  = urlParams.get('møte');
        const erParticipant    = !!møteIdFraUrl;

        if (erParticipant) {
            // Participant-modus: skjul loginoverlay, vis deltaker-panel
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('deltakerPanel').classList.add('aktiv');
            lastParticipantPanel(møteIdFraUrl);
        }

        // ── Auth ──
        const ADMIN_EPOST = 'eirik.sorbo@gmail.com'; // Kun denne brukeren får logge inn

        window.signIn = async () => {
            try {
                const result = await signInWithPopup(auth, new GoogleAuthProvider());
                if (result.user.email !== ADMIN_EPOST) {
                    await signOut(auth);
                    alert('This app is for the organizer only.');
                }
            } catch(e) {
                alert('Sign-in failed: ' + e.message);
            }
        };

        window.logout = async () => { await signOut(auth); };

        onAuthStateChanged(auth, async bruker => {
            if (erParticipant) return; // ikke forstyrr deltaker-modus

            if (bruker && bruker.email === ADMIN_EPOST) {
                currentUser = bruker;
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('appHeader').style.display = 'flex';
                document.getElementById('adminPanel').classList.add('aktiv');
                document.getElementById('brukerNavn').textContent = bruker.displayName || bruker.email;

                // Unsubscribe gammel lytter hvis den finnes
                if (unsubscribeMøter) unsubscribeMøter();

                const q = query(collection(db, 'schedule_moter'), where('uid', '==', bruker.uid));
                unsubscribeMøter = onSnapshot(q, snapshot => {
                    snapshot.forEach(d => {
                        møter[d.id] = d.data();
                    });
                    // Fjern møter som er slettet fra Firestore
                    const firebaseIds = snapshot.docs.map(d => d.id);
                    Object.keys(møter).forEach(id => {
                        if (!id.startsWith('ny_') && !firebaseIds.includes(id)) {
                            delete møter[id];
                        }
                    });
                    renderMøteListe();
                    // Oppdater åpent møte live hvis det er i visning (ikke redigering)
                    if (currentMøteId && !currentMøteId.startsWith('ny_') && !redigeringsModus) {
                        renderMøteDetaljer(currentMøteId);
                    } else if (!currentMøteId) {
                        // Vis nyeste møte som default
                        const ids = Object.keys(møter).filter(id => !id.startsWith('ny_'));
                        if (ids.length > 0) {
                            const nyesteId = ids.sort((a, b) => Number(b) - Number(a))[0];
                            currentMøteId = nyesteId;
                            renderMøteListe();
                            renderMøteDetaljer(nyesteId);
                            if (erMobil()) visMobilDetalj();
                        }
                    }
                });
            } else {
                currentUser = null;
                if (unsubscribeMøter) { unsubscribeMøter(); unsubscribeMøter = null; }
                document.getElementById('loginOverlay').style.display = 'flex';
                document.getElementById('appHeader').style.display = 'none';
                document.getElementById('adminPanel').classList.remove('aktiv');
                møter = {};
            }
        });

        // ── Admin: Møteliste ──
        function renderMøteListe() {
            const liste = document.getElementById('møteListe');
            const ids = Object.keys(møter).filter(id => !id.startsWith('ny_'));

            if (ids.length === 0) {
                liste.innerHTML = '<div class="tom-melding">No meetings yet</div>';
                if (!currentMøteId?.startsWith('ny_')) {
                    document.getElementById('detaljSection').classList.remove('vis');
                }
                return;
            }

            liste.innerHTML = ids.map(id => {
                const m = møter[id];
                const aktiv = currentMøteId === id ? 'aktiv' : '';
                const antall = Object.keys(m.stemmer || {}).length;
                return `<div class="møte-item ${aktiv}" onclick="velgMøte('${id}')">
                    <div class="møte-tittel">${m.tittel}</div>
                    <div class="møte-meta">${m.tider.length} ${m.heldagshendelse ? 'dager' : 'tider'} · ${antall} participant(s)</div>
                </div>`;
            }).join('');
        }

        const erMobil = () => window.innerWidth <= 600;

        window.velgMøte = id => {
            currentMøteId = id;
            redigeringsModus = false;
            renderMøteListe();
            renderMøteDetaljer(id);
            if (erMobil()) visMobilDetalj();
        };

        function visMobilDetalj() {
            document.getElementById('møteKort').classList.add('skjult-mobil');
            document.getElementById('detaljSection').classList.add('vis-mobil');
        }

        function visMobilListe() {
            document.getElementById('møteKort').classList.remove('skjult-mobil');
            document.getElementById('detaljSection').classList.remove('vis-mobil');
        }

        window.mobilTilbake = () => {
            currentMøteId = null;
            redigeringsModus = false;
            document.getElementById('detaljSection').classList.remove('vis');
            renderMøteListe();
            visMobilListe();
        };

        // ── Admin: Nytt møte ──
        window.opprettNyttMøte = () => {
            currentMøteId = 'ny_' + Date.now();
            redigeringsModus = true;
            møter[currentMøteId] = { tittel: '', beskrivelse: '', varighet: 60, tider: [''], stemmer: {} };
            renderMøteListe();
            visSkjema(currentMøteId);
            if (erMobil()) visMobilDetalj();
        };

        // ── Admin: Vis møtedetaljer (lesemodus) ──
        function renderMøteDetaljer(møteId) {
            const møte = møter[møteId];
            if (!møte) return;

            document.getElementById('detaljTitle').textContent = møte.tittel;
            document.getElementById('detaljSection').classList.add('vis');

            const link = window.location.origin + window.location.pathname + '?møte=' + møteId;

            const stemmer = møte.stemmer || {};
            const deltakere = Object.keys(stemmer);
            // Only show responses when someone other than the organizer has responded
            const ORGANIZER = 'Eirik Sørbø';
            const externalRespondents = deltakere.filter(n => n !== ORGANIZER);
            const antallParticipante = externalRespondents.length;
            // Use all participants (incl. organizer) for the table, but only show when others have responded
            const visResponses = externalRespondents.length > 0;

            // Grupper tider per dato
            const datoGrupper = {};
            møte.tider.forEach(tid => {
                const dato = møte.heldagshendelse
                    ? new Date(tid + 'T00:00:00').toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' })
                    : new Date(tid).toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
                if (!datoGrupper[dato]) datoGrupper[dato] = [];
                datoGrupper[dato].push(tid);
            });

            // Count only external respondents (excluding organizer)
            const jaPerTid = {};
            møte.tider.forEach(tid => {
                jaPerTid[tid] = externalRespondents.filter(n => stemmer[n]?.[tid] === 'ja').length;
            });
            const maxJa = Math.max(...Object.values(jaPerTid), 0);
            const alleAvailableTimes = møte.tider.filter(t => jaPerTid[t] === antallParticipante && antallParticipante > 0);

            function tidFarge(tid) {
                if (!visResponses) return 'var(--primær-lys)';
                const ja = jaPerTid[tid] || 0;
                if (ja === antallParticipante) return '#d1fae5';
                if (ja === maxJa && ja > 0) return '#fef3c7';
                return 'var(--primær-lys)';
            }

            // Analysetekst
            let analyseTekst = '';
            if (!visResponses) {
                analyseTekst = '<p style="color:var(--tekst-sek);font-size:0.9em;margin-bottom:8px;">No responses yet.</p>';
            } else if (alleAvailableTimes.length > 0) {
                const tidTexts = alleAvailableTimes.map(t => {
                    if (møte.heldagshendelse) {
                        return new Date(t + 'T00:00:00').toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
                    }
                    const s = new Date(t), e = new Date(s.getTime() + (møte.varighet||60)*60000);
                    const fmt = d => d.toLocaleString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false});
                    return s.toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short'}) + ' ' + fmt(s) + '–' + fmt(e);
                }).join(', ');
                analyseTekst = `<div style="background:#d1fae5;border:1px solid #6ee7b7;border-radius:var(--rs);padding:10px 14px;margin-bottom:12px;font-size:0.9em;"><strong>Everyone available:</strong><br>${tidTexts.split(', ').join('<br>')}</div>`;
            } else if (maxJa > 0) {
                const besteTimes = møte.tider.filter(t => jaPerTid[t] === maxJa);
                const besteTekster = besteTimes.map(t => {
                    const ikkeAvailableDenne = externalRespondents.filter(n => stemmer[n]?.[t] !== 'ja');
                    const parentes = ikkeAvailableDenne.length ? ` (${ikkeAvailableDenne.join(', ')} can't)` : '';
                    if (møte.heldagshendelse) {
                        return new Date(t + 'T00:00:00').toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' }) + parentes;
                    }
                    const s = new Date(t), e = new Date(s.getTime() + (møte.varighet||60)*60000);
                    const fmt = d => d.toLocaleString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false});
                    return s.toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short'}) + ' ' + fmt(s) + '–' + fmt(e) + parentes;
                }).join('<br>');
                analyseTekst = `<div style="background:#fef3c7;border:1px solid #fbbf24;border-radius:var(--rs);padding:10px 14px;margin-bottom:12px;font-size:0.9em;"><strong>Most can (${maxJa}/${antallParticipante}):</strong><br>${besteTekster}</div>`;
            }

            // Tabell
            let tabell = '';
            if (!visResponses) {
                tabell = '<p style="color:var(--tekst-sek);margin-top:8px;">No responses yet.</p>';
            } else {
                tabell = analyseTekst + '<div style="overflow-x:auto;">';

                if (møte.heldagshendelse) {
                    // Heldagshendelse: én tabell, én kolonne per dag
                    tabell += '<table class="resultater-tabell" style="margin-top:0;margin-bottom:12px;"><thead><tr><th style="min-width:80px;">Participant</th>';
                    møte.tider.forEach(tid => {
                        const dato = new Date(tid + 'T00:00:00').toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
                        tabell += `<th style="text-align:center;background:${tidFarge(tid)};padding:6px 8px;font-size:12px;">${dato}</th>`;
                    });
                    tabell += '</tr></thead><tbody>';
                    deltakere.forEach(navn => {
                        tabell += `<tr><td><strong>${navn}</strong></td>`;
                        møte.tider.forEach(tid => {
                            const v = stemmer[navn]?.[tid] || '–';
                            tabell += `<td style="text-align:center;background:${tidFarge(tid)};padding:6px 8px;" class="${v==='ja'?'stemme-ja':''}">​${v==='ja'?'✓':'<span style="color:#f87171;">✗</span>'}</td>`;
                        });
                        tabell += '</tr>';
                    });
                    tabell += '</tbody></table>';
                } else {
                    // Tidspunkter: gruppert per dato
                    Object.entries(datoGrupper).forEach(([dato, tiderIDate]) => {
                        tabell += `<div style="font-family:'Syne',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--tekst-sek);padding:10px 0 4px;">${dato}</div>`;
                        tabell += '<table class="resultater-tabell" style="margin-top:0;margin-bottom:12px;"><thead><tr><th style="min-width:80px;">Participant</th>';
                        tiderIDate.forEach(tid => {
                            const s = new Date(tid), e = new Date(s.getTime() + (møte.varighet||60)*60000);
                            const fmt = d => d.toLocaleString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false});
                            tabell += `<th style="text-align:center;background:${tidFarge(tid)};padding:6px 10px;">${fmt(s)}<br><span style="font-weight:400;font-size:10px;opacity:0.7;">–${fmt(e)}</span></th>`;
                        });
                        tabell += '</tr></thead><tbody>';
                        deltakere.forEach(navn => {
                            tabell += `<tr><td><strong>${navn}</strong></td>`;
                            tiderIDate.forEach(tid => {
                                const v = stemmer[navn]?.[tid] || '–';
                                tabell += `<td style="text-align:center;background:${tidFarge(tid)};padding:6px 10px;" class="${v==='ja'?'stemme-ja':''}">​${v==='ja'?'✓':'<span style="color:#f87171;">✗</span>'}</td>`;
                            });
                            tabell += '</tr>';
                        });
                        tabell += '</tbody></table>';
                    });
                }

                tabell += '</div>';

                // Free text option resultater
                if (møte.fritekstAlternativ) {
                    const valgte = deltakere.filter(n => stemmer[n]?.fritekst_valg === 'valgt');
                    tabell += `<div style="margin-top:12px;">
                        <div style="font-family:'Syne',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--tekst-sek);padding:4px 0 8px;">Free text option</div>
                        <div style="background:var(--primær-lys);border:1px solid var(--kant);border-radius:var(--rs);padding:10px 14px;">
                            <div style="font-weight:700;margin-bottom:6px;">${møte.fritekstAlternativ}</div>
                            <div style="font-size:0.88em;color:var(--tekst-sek);">
                                ${valgte.length === 0 ? 'No one selected this' : valgte.length + ' selected this: ' + valgte.join(', ')}
                            </div>
                        </div>
                    </div>`;
                }
            }

            document.getElementById('detaljInnhold').innerHTML = `
                <button class="mobil-tilbake" onclick="mobilTilbake()">← Back</button>
                <div class="form-gruppe">
                    <label>Responses</label>
                    ${tabell}
                </div>
                <div class="form-gruppe">
                    <label>Meeting link</label>
                    <div class="deling-boks">
                        <input type="text" value="${link}" readonly>
                        <button class="btn-primær" onclick="kopierLink('${link}')">Copy</button>
                    </div>
                </div>
                ${møte.heldagshendelse ? '' : `
                <div class="form-gruppe">
                    <label>Duration</label>
                    <div style="padding:8px;background:var(--primær-lys);border-radius:6px;">${varighetTekst(møte.varighet)}</div>
                </div>`}
                <div class="form-gruppe">
                    <label>${møte.heldagshendelse ? 'Days' : 'Times'}</label>
                    ${møte.tider.map(tid => {
                        if (møte.heldagshendelse) {
                            const dato = new Date(tid + 'T00:00:00').toLocaleDateString('en-GB', { weekday:'short', year:'numeric', month:'short', day:'numeric' });
                            return `<div style="padding:8px;background:var(--primær-lys);border-radius:6px;margin-bottom:8px;">${dato}</div>`;
                        }
                        const start = new Date(tid);
                        const slutt = new Date(start.getTime() + (møte.varighet||60) * 60000);
                        const fmt = d => d.toLocaleString('en-GB', { hour:'2-digit', minute:'2-digit' ,hour12:false});
                        const dag = start.toLocaleString('en-GB', { year:'numeric', month:'short', day:'numeric' });
                        return `<div style="padding:8px;background:var(--primær-lys);border-radius:6px;margin-bottom:8px;">${dag}, ${fmt(start)}–${fmt(slutt)}</div>`;
                    }).join('')}
                </div>
                <div class="knapp-gruppe">
                    <button class="btn-sekundær" onclick="redigerMøte('${møteId}')">Edit</button>
                    <button class="btn-fare" onclick="slettMøte('${møteId}')">Delete</button>
                </div>`;
        }

        // ── Admin: Vis redigeringsskjema ──
        let timeplanDate = new Date();
        timeplanDate.setHours(0,0,0,0);

        function visSkjema(møteId) {
            const møte = møter[møteId];
            const erNy = møteId.startsWith('ny_');
            const erHeldag = møte.heldagshendelse || false;

            document.getElementById('detaljTitle').textContent = erNy ? 'Nytt møte' : 'Edit møte';
            document.getElementById('detaljSection').classList.add('vis');

            if (møte.tider && møte.tider.length > 0 && møte.tider[0] && !erHeldag) {
                timeplanDate = new Date(møte.tider[0]);
                timeplanDate.setHours(0,0,0,0);
            } else {
                timeplanDate = new Date();
                timeplanDate.setHours(0,0,0,0);
            }

            const varighetOpts = [15,30,45,60,90,120,180].map(v => {
                const tekst = v < 60 ? v+' min' : v===60 ? '1 hour' : v===90 ? '1.5 hours' : (v/60)+' timer';
                return `<option value="${v}" ${(møte.varighet||60)===v?'selected':''}>${tekst}</option>`;
            }).join('');

            document.getElementById('detaljInnhold').innerHTML = `
                <button class="mobil-tilbake" onclick="mobilTilbake()">← Back</button>
                <div class="form-gruppe">
                    <label>Title</label>
                    <input type="text" id="editTitle" placeholder="E.g. Team meeting" value="${møte.tittel || ''}">
                </div>
                <div class="form-gruppe">
                    <label>Description (optional)</label>
                    <textarea id="editBeskrivelse" placeholder="A few words about the meeting...">${møte.beskrivelse || ''}</textarea>
                </div>
                <div class="type-toggle">
                    <button id="toggleTid" class="${!erHeldag?'aktiv':''}" onclick="byttHendelsestype(false)">🕐 Time slots</button>
                    <button id="toggleHeldag" class="${erHeldag?'aktiv':''}" onclick="byttHendelsestype(true)">📅 All-day event</button>
                </div>
                <div id="tidspunktSeksjon" style="${erHeldag?'display:none':''}">
                    <div class="dato-varighet-rad">
                        <div class="form-gruppe">
                            <label>Date</label>
                            <input type="date" id="editDate" value="${datoTilString(timeplanDate)}" onchange="byttDate(this.value)">
                        </div>
                        <div class="form-gruppe">
                            <label>Duration per meeting</label>
                            <select id="editDuration" onchange="oppdaterTimeplan()" style="width:100%;padding:10px 12px;border:2px solid var(--kant);border-radius:var(--rs);font-size:0.95em;font-family:'Nunito',sans-serif;">${varighetOpts}</select>
                        </div>
                    </div>
                    <div class="form-gruppe">
                        <label>Select time slots <span style="font-weight:400;color:var(--tekst-sek);">— click in the schedule</span></label>
                        <div class="timeplan-nav">
                            <button class="timeplan-nav-knapp" onclick="endreTimeplanDag(-1)">←</button>
                            <div class="timeplan-dato" id="timeplanDateLabel"></div>
                            <button class="timeplan-nav-knapp" onclick="endreTimeplanDag(1)">→</button>
                        </div>
                        <div class="timeplan-wrapper" id="timeplanWrapper">
                            <div class="timeplan-grid" id="timeplanGrid"></div>
                        </div>
                    </div>
                </div>
                <div id="heldagSeksjon" style="${!erHeldag?'display:none':''}">
                    <div class="form-gruppe">
                        <label>Select days <span style="font-weight:400;color:var(--tekst-sek);">— click on days</span></label>
                        <div class="maaned-nav">
                            <button class="timeplan-nav-knapp" onclick="endreMaaned(-1)">←</button>
                            <div class="maaned-label" id="maanedLabel"></div>
                            <button class="timeplan-nav-knapp" onclick="endreMaaned(1)">→</button>
                        </div>
                        <div class="maaned-grid" id="maanedGrid"></div>
                    </div>
                </div>
                <div class="form-gruppe">
                    <label>Free text option <span style="font-weight:400;color:var(--tekst-sek);">— optional</span></label>
                    <input type="text" id="editFritekst" placeholder="E.g. «Jeg kan ikke noen av disse dagene»" value="${møte.fritekstAlternativ || ''}">
                    <div style="font-size:12px;color:var(--tekst-sek);margin-top:4px;">Shown at the bottom for participants with a «Select this»-knapp.</div>
                </div>
                <div class="knapp-gruppe">
                    <button class="btn-primær" onclick="lagreMøte()">Save</button>
                    <button class="btn-sekundær" onclick="avbryt()">Cancel</button>
                </div>`;

            const varighetEl = document.getElementById('editDuration');
            if (varighetEl) varighetEl.value = møte.varighet || 60;

            if (erHeldag) {
                oppdaterMaanedKalender();
            } else {
                oppdaterTimeplan();
            }
        }

        function datoTilString(dato) {
            const y = dato.getFullYear();
            const m = String(dato.getMonth()+1).padStart(2,'0');
            const d = String(dato.getDate()).padStart(2,'0');
            return `${y}-${m}-${d}`;
        }

        let maanedDate = new Date();

        window.byttHendelsestype = (erHeldag) => {
            const møte = møter[currentMøteId];
            if (!møte) return;
            møte.heldagshendelse = erHeldag;
            møte.tider = [];
            document.getElementById('toggleTid').classList.toggle('aktiv', !erHeldag);
            document.getElementById('toggleHeldag').classList.toggle('aktiv', erHeldag);
            document.getElementById('tidspunktSeksjon').style.display = erHeldag ? 'none' : '';
            document.getElementById('heldagSeksjon').style.display = erHeldag ? '' : 'none';
            if (erHeldag) oppdaterMaanedKalender();
            else oppdaterTimeplan();
        };

        window.endreMaaned = (retning) => {
            maanedDate.setMonth(maanedDate.getMonth() + retning);
            oppdaterMaanedKalender();
        };

        function oppdaterMaanedKalender() {
            const grid = document.getElementById('maanedGrid');
            const label = document.getElementById('maanedLabel');
            if (!grid || !label) return;

            const møte = møter[currentMøteId];
            const valgteStr = new Set(møte?.tider || []);

            const år = maanedDate.getFullYear();
            const mnd = maanedDate.getMonth();
            const iDag = new Date(); iDag.setHours(0,0,0,0);

            label.textContent = maanedDate.toLocaleDateString('en-GB', { month:'long', year:'numeric' });

            const dagNavn = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
            let html = dagNavn.map(d => `<div class="maaned-dag-header">${d}</div>`).join('');

            const førsteDag = new Date(år, mnd, 1);
            // Norsk: mandag = 0
            let startOffset = (førsteDag.getDay() + 6) % 7;
            for (let i = 0; i < startOffset; i++) {
                html += `<div class="maaned-dag tom"></div>`;
            }

            const dagerIMnd = new Date(år, mnd + 1, 0).getDate();
            for (let dag = 1; dag <= dagerIMnd; dag++) {
                const dato = new Date(år, mnd, dag);
                const datoStr = datoTilString(dato);
                const erValgt = valgteStr.has(datoStr);
                const erIDag = dato.getTime() === iDag.getTime();
                const erFortid = dato < iDag;
                let klasse = 'maaned-dag';
                if (erValgt) klasse += ' valgt';
                else if (erFortid) klasse += ' fortid';
                else if (erIDag) klasse += ' i-dag';
                html += `<div class="${klasse}" onclick="toggleDag('${datoStr}')">${dag}</div>`;
            }

            grid.innerHTML = html;
        }

        window.toggleDag = (datoStr) => {
            const møte = møter[currentMøteId];
            if (!møte) return;
            const idx = møte.tider.indexOf(datoStr);
            if (idx >= 0) møte.tider.splice(idx, 1);
            else { møte.tider.push(datoStr); møte.tider.sort(); }
            oppdaterMaanedKalender();
        };

        window.byttDate = (verdi) => {
            timeplanDate = new Date(verdi + 'T00:00:00');
            oppdaterTimeplan();
        };

        window.endreTimeplanDag = (retning) => {
            timeplanDate.setDate(timeplanDate.getDate() + retning);
            document.getElementById('editDate').value = datoTilString(timeplanDate);
            oppdaterTimeplan();
        };

        window.oppdaterTimeplan = () => {
            const varighet = parseInt(document.getElementById('editDuration')?.value || 60);
            const slotMinutter = 15;
            const startTime = 7 * 60;  // 07:00
            const sluttTime = 21 * 60; // 21:00
            const antallSlots = (sluttTime - startTime) / slotMinutter;
            const slotHøyde = erMobil() ? 32 : 18;
            const blokkhøyde = (varighet / slotMinutter) * slotHøyde;

            const datoLabel = timeplanDate.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' });
            const labelEl = document.getElementById('timeplanDateLabel');
            if (labelEl) labelEl.textContent = datoLabel.charAt(0).toUpperCase() + datoLabel.slice(1);

            const møte = møter[currentMøteId];
            const tider = møte?.tider || [];

            // Finn valgte slots for denne dagen
            const dagStr = datoTilString(timeplanDate);
            const valgtePåDenneDagen = tider.filter(t => t.startsWith(dagStr));

            let html = '';
            for (let i = 0; i < antallSlots; i++) {
                const minutter = startTime + i * slotMinutter;
                const time = Math.floor(minutter / 60);
                const min = minutter % 60;
                const tidStr = `${String(time).padStart(2,'0')}:${String(min).padStart(2,'0')}`;
                const iso = `${dagStr}T${tidStr}`;
                const erHelTime = min === 45;
                const erHalvTime = min === 15;
                const erStiplet = min === 0 || min === 30;
                const visLabel = min === 0 || min === 30;
                const slotKlasse = erHelTime ? 'hel-time' : erStiplet ? 'stiplet' : 'halvtime';
                const visLabelStr = visLabel ? tidStr : '';

                html += `<div class="timeplan-slot ${slotKlasse}" onclick="toggleTid('${iso}')">
                    <div class="timeplan-tid">${visLabelStr}</div>
                    <div class="timeplan-innhold"></div>
                </div>`;
            }

            const grid = document.getElementById('timeplanGrid');
            if (!grid) return;

            // Bevar scroll-posisjon
            const wrapper = document.getElementById('timeplanWrapper');
            const scrollPosFør = wrapper ? wrapper.scrollTop : null;

            grid.innerHTML = html;

            // Scroll til 08:00 kun første gang (når scrollPos er 0 eller null)
            if (wrapper) {
                const åtteNull = 4 * slotHøyde;
                wrapper.scrollTop = (scrollPosFør && scrollPosFør > 0) ? scrollPosFør : åtteNull;
            }

            // Tegn blokker for valgte tider
            valgtePåDenneDagen.forEach(tid => {
                const tidDel = tid.split('T')[1];
                if (!tidDel) return;
                const [h, m] = tidDel.split(':').map(Number);
                const minutterFraStart = (h * 60 + m) - startTime;
                const slotIndex = minutterFraStart / slotMinutter;
                const topPx = slotIndex * slotHøyde;

                const blokk = document.createElement('div');
                blokk.className = 'timeplan-blokk';
                blokk.style.height = (blokkhøyde - 2) + 'px';
                blokk.style.zIndex = '10';
                blokk.textContent = tidDel.slice(0,5);
                blokk.onclick = (e) => { e.stopPropagation(); toggleTid(tid); };

                const innholdCeller = grid.querySelectorAll('.timeplan-innhold');
                if (innholdCeller[slotIndex]) {
                    const celle = innholdCeller[slotIndex];
                    celle.style.position = 'relative';
                    celle.style.overflow = 'visible';
                    celle.style.zIndex = '5';
                    blokk.style.top = '0';
                    blokk.style.position = 'absolute';
                    blokk.style.left = '4px';
                    blokk.style.right = '4px';
                    celle.appendChild(blokk);
                }
            });
        };

        window.toggleTid = (iso) => {
            const møte = møter[currentMøteId];
            if (!møte) return;
            const idx = møte.tider.indexOf(iso);
            if (idx >= 0) {
                møte.tider.splice(idx, 1);
            } else {
                møte.tider.push(iso);
                møte.tider.sort();
            }
            oppdaterTimeplan();
        };

        window.redigerMøte = id => {
            currentMøteId = id;
            redigeringsModus = true;
            visSkjema(id);
        };

        window.lagreMøte = async () => {
            const møte = møter[currentMøteId];
            møte.tittel = document.getElementById('editTitle').value.trim();
            møte.beskrivelse = document.getElementById('editBeskrivelse').value.trim();
            møte.varighet = parseInt(document.getElementById('editDuration')?.value || 60);
            møte.heldagshendelse = møte.heldagshendelse || false;
            møte.fritekstAlternativ = document.getElementById('editFritekst')?.value.trim() || '';
            møte.tider = møte.tider.filter(t => t);

            if (!møte.tittel || møte.tider.length === 0) {
                alert('Please enter a title and at least one time');
                return;
            }

            const erNy  = currentMøteId.startsWith('ny_');
            const nyId  = erNy ? Date.now().toString() : currentMøteId;
            møte.uid    = currentUser.uid;
            if (!møte.stemmer) møte.stemmer = {};

            // Auto-add organizer as available for all slots
            if (erNy) {
                const organizer = 'Eirik Sørbø';
                møte.stemmer[organizer] = {};
                møte.tider.forEach(tid => {
                    møte.stemmer[organizer][tid] = 'ja';
                });
            }

            try {
                await setDoc(doc(db, 'schedule_moter', nyId), møte);
                if (erNy) {
                    delete møter[currentMøteId];
                    møter[nyId] = møte;
                    currentMøteId = nyId;
                }
                redigeringsModus = false;
                renderMøteListe();
                renderMøteDetaljer(currentMøteId);
            } catch(e) { alert('Error saving: ' + e.message); }
        };

        window.avbryt = () => {
            if (currentMøteId?.startsWith('ny_')) {
                delete møter[currentMøteId];
                currentMøteId = null;
                document.getElementById('detaljSection').classList.remove('vis');
                if (erMobil()) visMobilListe();
            } else {
                redigeringsModus = false;
                renderMøteDetaljer(currentMøteId);
            }
            renderMøteListe();
        };

        window.slettMøte = async id => {
            if (!confirm('Delete this meeting?')) return;
            try {
                await deleteDoc(doc(db, 'schedule_moter', id));
                delete møter[id];
                currentMøteId = null;
                redigeringsModus = false;
                renderMøteListe();
                document.getElementById('detaljSection').classList.remove('vis');
                if (erMobil()) visMobilListe();
            } catch(e) { alert('Error deleting: ' + e.message); }
        };

        window.kopierLink = link => {
            navigator.clipboard.writeText(link);
            const knapp = document.querySelector('.deling-boks button');
            if (knapp) {
                knapp.textContent = 'Copied!';
                knapp.style.background = 'var(--primær-mørk)';
                setTimeout(() => {
                    knapp.textContent = 'Copy';
                    knapp.style.background = '';

            }
        };

        function varighetTekst(min) {
            if (!min) return '1 hour';
            if (min < 60) return min + ' minutter';
            if (min === 60) return '1 hour';
            if (min % 60 === 0) return (min / 60) + ' timer';
            return Math.floor(min/60) + ',' + (min%60/60*10) + ' time';
        }

        // ── Participant: Last panel ──
        async function lastParticipantPanel(møteId) {
            deltakerMaanedSatt = false;
            document.getElementById('deltakerTimesContainer').innerHTML = '';

            try {
                const snap = await getDoc(doc(db, 'schedule_moter', møteId));

                }

        // Oppdater navn fra felt (debounced - venter 400ms etter siste tastetrykk)
        let navnDebounce = null;
        window.oppdaterNavn = () => {
            clearTimeout(navnDebounce);
            navnDebounce = setTimeout(() => {
                const navn = document.getElementById('deltakerNavnInput').value.trim();
                const inp  = document.getElementById('deltakerNavnInput');
                if (navn) {
                    // Sjekk om navn er tatt (uten å låse — bare vis advarsel)
                    getDoc(doc(db, 'schedule_moter', møteIdFraUrl)).then(snap => {
                        if (!snap.exists()) return;
                        const møte = snap.data();
                        const eksisterende = Object.keys(møte.stemmer || {});
                        const lagret = localStorage.getItem('deltaker_navn_' + møteIdFraUrl);
                        if (eksisterende.includes(navn) && lagret !== navn) {
                            inp.style.borderColor = '#f87171';
                            inp.title = 'This name is already taken — please choose another';

                            inp.style.borderColor = '';

                    });
                } else {

        function renderParticipantTimes(møteId, møte) {
            const navn    = localStorage.getItem('deltaker_navn_' + møteId) || null;
            const stemmer = møte.stemmer || {};

            // Vis/skjul møte-header basert på om navn er oppgitt
            const møteHeaderEl = document.getElementById('møteHeader');
            if (møteHeaderEl) {
                if (navn) {
                    møteHeaderEl.style.display = 'block';
                    const h2 = document.getElementById('deltakerMøteTitle');
                    if (h2) h2.textContent = møte.tittel || '';
                    const besk = document.getElementById('deltakerMøteBeskrivelse');
                    if (besk) besk.textContent = møte.beskrivelse || '';
                } else {
                    møteHeaderEl.style.display = 'none';
                }
            }
            // Vis header-kortet kun når navn er registrert
            const header = document.getElementById('møteHeader');
            if (header) header.style.display = navn ? 'block' : 'none';
            if (møte.heldagshendelse) {
                renderParticipantKalender(møteId, møte, navn, stemmer);
                return;
            }

            // ── Vanlige tid-kort ──
            const tiderHtml = møte.tider.map(tid => {
                const formatted = new Date(tid).toLocaleString('en-GB', {
                    weekday:'long', year:'numeric', month:'long',
                    day:'numeric', hour:'2-digit', minute:'2-digit'
                ,hour12:false});
                const slutt = new Date(new Date(tid).getTime() + (møte.varighet||60)*60000);
                const sluttStr = slutt.toLocaleString('en-GB', {hour:'2-digit', minute:'2-digit',hour12:false});
                let ja = 0;
                Object.values(stemmer).forEach(s => {
                    if (s[tid] === 'ja') ja++;
                });
                const minStemme = navn ? (stemmer[navn]?.[tid] || null) : null;
                const tidEscaped = tid.replace(/'/g, "\\'");
                const kantFarge = minStemme === 'ja' ? '#6ee7b7' : 'var(--primær)';
                const kanTekst  = minStemme === 'ja' ? '✓ Available' : 'Available';
                const kanStemme = minStemme === 'ja' ? 'clear' : 'ja';

                return `<div class="tid-kort" style="border-left-color:${kantFarge};">
                    <div class="tid-rad">
                        <div class="tid-tekst">${formatted}–${sluttStr}</div>
                        <div class="tid-stemmer">✓ ${ja}</div>
                    </div>
                    <div class="stemme-knapp-gruppe">
                        <button class="stemme-knapp ${minStemme==='ja'?'valgt-ja':''}" onclick="stem('${møteId}','${tidEscaped}','${kanStemme}')">${kanTekst}</button>
                    </div>
                </div>`;
            }).join('');

            // Free text option
            let fritekstHtml = '';
            if (møte.fritekstAlternativ) {
                const nøkkel = 'fritekst_valg';
                const nøkkelEscaped = nøkkel.replace(/'/g, "\\'");
                const erValgt = navn ? (stemmer[navn]?.[nøkkel] === 'valgt') : false;
                const antallValgt = Object.values(stemmer).filter(s => s[nøkkel] === 'valgt').length;
                fritekstHtml = `<div class="fritekst-kort">
                    <div class="fritekst-tekst">${møte.fritekstAlternativ}</div>
                    <div style="font-size:0.82em;color:var(--tekst-sek);margin-bottom:8px;">${antallValgt > 0 ? antallValgt + ' selected this' : ''}</div>
                    <button class="velg-knapp ${erValgt?'valgt':''}" onclick="stem('${møteId}','${nøkkelEscaped}','valgt')">${erValgt ? '✓ Selected' : 'Select this'}</button>
                </div>`;
            }

            // Resultater for deltaker - samme tabell som admin
            const antallParticipante = Object.keys(stemmer).length;
            let resultatHtml = '';
            if (antallParticipante > 0 && navn) {
                const jaPerTid = {};
                møte.tider.forEach(tid => {
                    jaPerTid[tid] = Object.values(stemmer).filter(s => s[tid] === 'ja').length;
            });
            const maxJa = Math.max(...Object.values(jaPerTid), 0);
                const alleAvailableTimes = møte.tider.filter(t => jaPerTid[t] === antallParticipante);

                function tidFarge(tid) {
                    const ja = jaPerTid[tid] || 0;
                    if (ja === antallParticipante) return '#d1fae5';
                    if (ja === maxJa && ja > 0) return '#fef3c7';
                    return '#eff6ff';
                }

                // Grupper per dato
                const datoGrupper = {};
                møte.tider.forEach(tid => {
                    const dato = new Date(tid).toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
                    if (!datoGrupper[dato]) datoGrupper[dato] = [];
                    datoGrupper[dato].push(tid);
                });

                let tabell = '<div style="overflow-x:auto;">';
                Object.entries(datoGrupper).forEach(([dato, tiderIDate]) => {
                    tabell += `<div style="font-family:'Syne',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--tekst-sek);padding:10px 0 4px;">${dato}</div>`;
                    tabell += '<table class="resultater-tabell" style="margin-top:0;margin-bottom:12px;"><thead><tr><th style="min-width:80px;">Participant</th>';
                    tiderIDate.forEach(tid => {
                        const s = new Date(tid), e = new Date(s.getTime() + (møte.varighet||60)*60000);
                        const fmt = d => d.toLocaleString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false});
                        tabell += `<th style="text-align:center;background:${tidFarge(tid)};padding:6px 10px;">${fmt(s)}<br><span style="font-weight:400;font-size:10px;opacity:0.7;">–${fmt(e)}</span></th>`;
                    });
                    tabell += '</tr></thead><tbody>';
                    Object.keys(stemmer).forEach(deltakerNavn => {
                        tabell += `<tr><td><strong>${deltakerNavn}</strong></td>`;
                        tiderIDate.forEach(tid => {
                            const v = stemmer[deltakerNavn]?.[tid] || '–';
                            tabell += `<td style="text-align:center;background:${tidFarge(tid)};padding:6px 10px;" class="${v==='ja'?'stemme-ja':''}">​${v==='ja'?'✓':'<span style="color:#f87171;">✗</span>'}</td>`;
                        });
                        tabell += '</tr>';
                    });
                    tabell += '</tbody></table>';
                });
                tabell += '</div>';

                resultatHtml = `<div class="resultater-deltaker">
                    <div class="resultater-deltaker-tittel">Overview</div>
                    ${tabell}
                </div>`;
            }

            const suksess = navn ? '<div class="suksess-melding">✓ Your responses are saved</div>' : '';

            document.getElementById('deltakerTimesContainer').innerHTML =
                tiderHtml + fritekstHtml + suksess + resultatHtml;
        }

        let deltakerMaaned = new Date();
        let deltakerMaanedSatt = false;

        function renderParticipantKalender(møteId, møte, navn, stemmer) {
            const valgteStr = new Set(møte.tider || []);
            const mineStemmer = navn ? (stemmer[navn] || {}) : {};

            // Sett deltakerMaaned til første dato kun første gang
            if (!deltakerMaanedSatt && møte.tider?.length > 0) {
                const første = new Date(møte.tider[0] + 'T00:00:00');
                deltakerMaaned = new Date(første.getFullYear(), første.getMonth(), 1);
                deltakerMaanedSatt = true;
            }

            // Finn alle måneder med valgte dager - for indikator
            const månederMedDays = [...new Set(møte.tider.map(t => t.slice(0,7)))].sort();
            const antallMåneder = månederMedDays.length;

            function byggKalender() {
                const år = deltakerMaaned.getFullYear();
                const mnd = deltakerMaaned.getMonth();
                const currentKey = `${år}-${String(mnd+1).padStart(2,'0')}`;
                const label = deltakerMaaned.toLocaleDateString('en-GB', { month:'long', year:'numeric' });

                // Sett alltid tittel i header (kan ha blitt nullstilt)

                // Månedindikator-prikker
                let prikker = '';
                if (antallMåneder > 1) {
                    prikker = '<div style="display:flex;gap:6px;justify-content:center;margin-bottom:8px;">' +
                        månederMedDays.map(m => {
                            const aktiv = m === currentKey;
                            return `<div style="width:8px;height:8px;border-radius:50%;background:${aktiv ? 'var(--primær)' : 'var(--kant)'};"></div>`;
                        }).join('') + '</div>';
                }

                // Hint hvis neste måned har dager
                const nesteMndIdx = mnd === 11 ? 0 : mnd + 1;
                const nesteÅr = mnd === 11 ? år + 1 : år;
                const nesteMndKey = `${nesteÅr}-${String(nesteMndIdx+1).padStart(2,'0')}`;
                const nesteHint = månederMedDays.includes(nesteMndKey) ?
                    `<div style="text-align:center;font-size:12px;margin-top:8px;"><a href="#" onclick="endreParticipantMaaned(1);return false;" style="color:var(--primær);font-weight:600;text-decoration:none;">→ More options next month</a></div>` : '';

                const dagNavn = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
                let html = `<div class="maaned-nav" style="margin-bottom:4px;">
                    <button class="timeplan-nav-knapp" onclick="endreParticipantMaaned(-1)">←</button>
                    <div class="maaned-label">${label}</div>
                    <button class="timeplan-nav-knapp" onclick="endreParticipantMaaned(1)">→</button>
                </div>
                ${prikker}
                ${nesteHint}
                <div class="maaned-grid">`;

                html += dagNavn.map(d => `<div class="maaned-dag-header">${d}</div>`).join('');

                const førsteDag = new Date(år, mnd, 1);
                const startOffset = (førsteDag.getDay() + 6) % 7;
                for (let i = 0; i < startOffset; i++) html += `<div class="deltaker-dag tom"></div>`;

                const dagerIMnd = new Date(år, mnd + 1, 0).getDate();
                for (let dag = 1; dag <= dagerIMnd; dag++) {
                    const datoStr = `${år}-${String(mnd+1).padStart(2,'0')}-${String(dag).padStart(2,'0')}`;
                    if (!valgteStr.has(datoStr)) {
                        html += `<div class="deltaker-dag" style="opacity:0.25;cursor:default;">${dag}</div>`;
                        continue;
                    }
                    const svar = mineStemmer[datoStr] || null;
                    let klasse = 'deltaker-dag';
                    let svarTekst = '';
                    if (svar === 'ja') { klasse += ' kan'; svarTekst = '✓'; }
                    html += `<div class="${klasse}" onclick="stemKalender('${møteId}','${datoStr}')">
                        <div class="dag-nr">${dag}</div>
                        ${svarTekst ? `<div class="dag-svar">${svarTekst}</div>` : ''}
                    </div>`;
                }
                html += '</div>';
                html += nesteHint;

                // Fritekst
                let fritekstHtml = '';
                if (møte.fritekstAlternativ) {
                    const erValgt = mineStemmer['fritekst_valg'] === 'valgt';
                    const antall = Object.values(stemmer).filter(s => s['fritekst_valg'] === 'valgt').length;
                    fritekstHtml = `<div class="fritekst-kort" style="margin-top:16px;">
                        <div class="fritekst-tekst">${møte.fritekstAlternativ}</div>
                        <div style="font-size:0.82em;color:#991b1b;margin-bottom:8px;">${antall > 0 ? antall + ' selected this' : ''}</div>
                        <button class="velg-knapp ${erValgt?'valgt':''}" onclick="stem('${møteId}','fritekst_valg','valgt')">${erValgt ? '✓ Selected' : 'Select this'}</button>
                    </div>`;
                }

                const suksess = navn ? '<div class="suksess-melding" style="margin-top:16px;">✓ Your responses are saved</div>' : '';

                // Tabell
                const antallParticipante = Object.keys(stemmer).length;
                let tabellHtml = '';
                if (antallParticipante > 0 && navn) {
                    const jaPerDag = {};
                    møte.tider.forEach(d => { jaPerDag[d] = Object.values(stemmer).filter(s => s[d] === 'ja').length; });
                    const maxJa = Math.max(...Object.values(jaPerDag), 0);

                    const fmt = d => new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
                    const tidFarge = d => {
                        const ja = jaPerDag[d] || 0;
                        if (ja === antallParticipante) return '#d1fae5';
                        if (ja === maxJa && ja > 0) return '#fef3c7';
                        return '#eff6ff';
                    };

                    let tabell = '<div style="overflow-x:auto;margin-top:20px;border-top:2px solid var(--kant);padding-top:16px;"><div style="font-family:\'Syne\',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--tekst-sek);margin-bottom:8px;">Overview</div>';
                    tabell += '<table class="resultater-tabell"><thead><tr><th>Participant</th>';
                    møte.tider.forEach(d => { tabell += `<th style="text-align:center;background:${tidFarge(d)};padding:6px 8px;font-size:11px;">${fmt(d)}</th>`; });
                    tabell += '</tr></thead><tbody>';
                    Object.keys(stemmer).forEach(n => {
                        tabell += `<tr><td><strong>${n}</strong></td>`;
                        møte.tider.forEach(d => {
                            const v = stemmer[n]?.[d] || '–';
                            tabell += `<td style="text-align:center;background:${tidFarge(d)};" class="${v==='ja'?'stemme-ja':''}">​${v==='ja'?'✓':'<span style="color:#f87171;">✗</span>'}</td>`;
                        });
                        tabell += '</tr>';
                    });
                    tabell += '</tbody></table></div>';
                    tabellHtml = tabell;
                }

                document.getElementById('deltakerTimesContainer').innerHTML = tabellHtml + html + fritekstHtml + suksess;
            }

            byggKalender();

            window.endreParticipantMaaned = (retning) => {
                deltakerMaaned.setMonth(deltakerMaaned.getMonth() + retning);
                byggKalender();
            };
        }

        window.stemKalender = async (møteId, datoStr) => {
            const lagretNavn = localStorage.getItem('deltaker_navn_' + møteId);
            const inputNavn  = document.getElementById('deltakerNavnInput')?.value.trim();
            const navn = lagretNavn || inputNavn;

            if (!navn) {
                document.getElementById('deltakerNavnInput').focus();
                document.getElementById('deltakerNavnInput').style.borderColor = '#f87171';
                setTimeout(() => document.getElementById('deltakerNavnInput').style.borderColor = '', 2000);
                return;
            }
            try {
                const snap = await getDoc(doc(db, 'schedule_moter', møteId));
                if (!snap.exists()) return;
                const møte = snap.data();

                // Sjekk duplikat navn
                const eksisterende = Object.keys(møte.stemmer || {});
                const lagretNavn = localStorage.getItem('deltaker_navn_' + møteId);
                if (eksisterende.includes(navn) && lagretNavn !== navn) {
                    const inp = document.getElementById('deltakerNavnInput');
                    if (inp) {
                        inp.value = '';
                        inp.placeholder = '⚠ This name is taken — please choose another';
                        inp.style.borderColor = '#f87171';
                        setTimeout(() => { inp.style.borderColor = ''; inp.placeholder = 'Enter your name here...'; }, 4000);
                    }
                    return;
                }

                localStorage.setItem('deltaker_navn_' + møteId, navn);
                if (!møte.stemmer) møte.stemmer = {};
                if (!møte.stemmer[navn]) møte.stemmer[navn] = {};
                // Heldagshendelse: toggle ja/fjern (ingen nei)
                const nå = møte.stemmer[navn][datoStr];
                if (!nå || nå === 'nei') møte.stemmer[navn][datoStr] = 'ja';
                else delete møte.stemmer[navn][datoStr];
                await setDoc(doc(db, 'schedule_moter', møteId), møte);
                renderParticipantTimes(møteId, møte);
            } catch(e) { alert('Error: ' + e.message); }
        };

        window.stem = async (møteId, tid, stemme) => {
            const navn = document.getElementById('deltakerNavnInput').value.trim();
            if (!navn) {
                document.getElementById('deltakerNavnInput').focus();
                document.getElementById('deltakerNavnInput').style.borderColor = '#f87171';
                setTimeout(() => document.getElementById('deltakerNavnInput').style.borderColor = '', 2000);
                return;
            }

            try {
                const snap = await getDoc(doc(db, 'schedule_moter', møteId));
                if (!snap.exists()) { alert('This meeting no longer exists'); return; }
                const møte = snap.data();

                // Bug 2: Sjekk om navnet tilhører en annen bruker
                const eksisterende = Object.keys(møte.stemmer || {});
                const lagretNavn = localStorage.getItem('deltaker_navn_' + møteId);
                if (eksisterende.includes(navn) && lagretNavn !== navn) {
                    const inp = document.getElementById('deltakerNavnInput');
                    inp.value = '';
                    inp.placeholder = '⚠ This name is taken — please choose another';
                    inp.style.borderColor = '#f87171';
                    setTimeout(() => { inp.style.borderColor = ''; inp.placeholder = 'Enter your name here...'; }, 4000);
                    return;
                }

                localStorage.setItem('deltaker_navn_' + møteId, navn);
                if (!møte.stemmer)        møte.stemmer = {};
                if (!møte.stemmer[navn])  møte.stemmer[navn] = {};
                if (stemme === 'clear')   delete møte.stemmer[navn][tid];
                else                      møte.stemmer[navn][tid] = stemme;
                await setDoc(doc(db, 'schedule_moter', møteId), møte);
                renderParticipantTimes(møteId, møte);
            } catch(e) { alert('Error submitting: ' + e.message); }
        };
    </script>
</body>
</html>
