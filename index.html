    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --primær: #9490d4;
            --primær-lys: #eeedfb;
            --primær-mørk: #2e2b45;
            --primær-mid: #c8c6ec;
            --tekst: #2e2b45;
            --tekst-sek: #7b78b0;
            --kant: #d4d2ee;
            --bg: #f3f2fb;
            --hvit: #ffffff;
            --r: 12px;
            --rs: 8px;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--bg);
            color: var(--tekst);
            min-height: 100vh;
            font-size: 15px;
            line-height: 1.5;
        }

        /* ── Login Overlay ── */
        #loginOverlay {
            display: flex;
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }

        #loginOverlay button {
            background: var(--primær);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 13px 28px;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
        }

        #loginOverlay button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(148, 144, 212, 0.3);
        }

        /* ── Header ── */
        header {
            background: var(--hvit);
            border-bottom: 1px solid var(--kant);
            padding: 0 20px;
            display: none;
            align-items: center;
            justify-content: space-between;
            height: 64px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 17px;
            color: var(--primær);
            letter-spacing: -0.3px;
        }

        .header-handlinger { display: flex; gap: 12px; align-items: center; }

        .bruker-navn { font-weight: 600; color: var(--tekst); font-size: 0.9em; }
        .bruker-rolle { font-size: 0.8em; color: var(--tekst-sek); text-align: right; }

        .header-knapp {
            width: 36px; height: 36px;
            border-radius: 50%;
            border: 1px solid var(--kant);
            background: var(--hvit);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            color: var(--tekst-sek);
            font-size: 16px;
            transition: all 0.15s;
        }
        .header-knapp:hover { background: var(--primær-lys); color: var(--primær); border-color: var(--primær-mid); }

        /* ── Paneler ── */
        .panel { display: none; }
        .panel.aktiv { display: block; }

        main { max-width: 1000px; margin: 0 auto; padding: 20px 12px 64px; }

        /* ── Admin Grid ── */
        .admin-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }

        .kort { background: var(--hvit); border-radius: var(--r); border: 1px solid var(--kant); overflow: hidden; }

        .kort-header { padding: 16px 20px; border-bottom: 1px solid var(--kant); background: var(--primær-lys); }

        .kort-tittel {
            font-family: 'Syne', sans-serif;
            font-weight: 700; font-size: 14px;
            color: var(--primær-mørk);
            text-transform: uppercase; letter-spacing: 0.3px;
        }

        .møte-liste { display: flex; flex-direction: column; }

        .møte-item {
            padding: 13px 20px;
            border-bottom: 1px solid var(--kant);
            cursor: pointer;
            transition: background 0.15s;
            border-left: 4px solid transparent;
        }
        .møte-item:last-child { border-bottom: none; }
        .møte-item:hover { background: var(--primær-lys); }
        .møte-item.aktiv { background: var(--primær-lys); border-left-color: var(--primær); }

        .møte-tittel { font-weight: 700; font-size: 14px; color: var(--tekst); margin-bottom: 4px; }
        .møte-meta { font-size: 12px; color: var(--tekst-sek); }

        .legg-til-knapp {
            background: var(--primær); color: white; border: none;
            border-radius: var(--rs);
            padding: 9px 16px;
            font-family: 'Syne', sans-serif; font-weight: 700; font-size: 12px;
            text-transform: uppercase; letter-spacing: 0.4px;
            cursor: pointer; transition: background 0.15s;
            width: calc(100% - 40px); margin: 12px 20px 20px;
        }
        .legg-til-knapp:hover { background: var(--primær-mørk); }

        .tom-melding { padding: 32px 20px; text-align: center; color: var(--tekst-sek); font-size: 14px; }

        #detaljSection { display: none; }
        #detaljSection.vis { display: block; }

        .kort-innhold { padding: 20px; }

        .form-gruppe { margin-bottom: 20px; }

        label {
            display: block; font-weight: 700; margin-bottom: 8px;
            color: var(--tekst); font-size: 0.95em; font-family: 'Syne', sans-serif;
        }

        input[type="text"], input[type="datetime-local"], textarea {
            width: 100%; padding: 10px 12px;
            border: 2px solid var(--kant); border-radius: var(--rs);
            font-size: 0.95em; font-family: 'Nunito', sans-serif;
            transition: border-color 0.2s;
        }
        input:focus, textarea:focus {
            outline: none; border-color: var(--primær);
            box-shadow: 0 0 0 3px rgba(148,144,212,0.1);
        }
        textarea { resize: vertical; min-height: 80px; }

        .tider-container { background: var(--primær-lys); padding: 16px; border-radius: var(--rs); margin: 12px 0; }
        .tid-slot { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
        .tid-slot:last-child { margin-bottom: 0; }
        .tid-slot input { flex: 1; }

        /* ── Timeplan ── */
        .timeplan-nav {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 12px;
        }
        .timeplan-dato {
            font-family: 'Syne', sans-serif; font-weight: 700;
            font-size: 14px; color: var(--tekst);
            text-transform: capitalize;
        }
        .timeplan-nav-knapp {
            background: var(--hvit); border: 1px solid var(--kant);
            border-radius: var(--rs); width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--tekst-sek); font-size: 16px;
            transition: all 0.15s;
        }
        .timeplan-nav-knapp:hover { background: var(--primær-lys); color: var(--primær); border-color: var(--primær-mid); }

        .timeplan-grid {
            position: relative;
            overflow: hidden;
            background: var(--hvit);
        }
        .timeplan-slot {
            display: flex; align-items: flex-start;
            height: 18px;
            border-bottom: 1px solid var(--kant);
            cursor: pointer;
            transition: background 0.1s;
            position: relative;
        }
        .timeplan-slot:last-child { border-bottom: none; }
        .timeplan-slot:hover { background: var(--primær-lys); }
        .timeplan-slot.hel-time { border-bottom: 2px solid var(--primær-mid); }
        .timeplan-slot.stiplet { border-bottom: 1px dashed rgba(212,210,238,0.5); }
        .timeplan-tid {
            width: 48px; min-width: 48px;
            font-size: 11px; color: var(--tekst-sek);
            padding: 3px 6px; font-weight: 600;
            font-family: 'Syne', sans-serif;
            border-right: 1px solid var(--kant);
            background: var(--primær-lys);
        }
        .timeplan-slot.hel-time .timeplan-tid { color: var(--primær); }
        .timeplan-innhold { flex: 1; position: relative; }

        .timeplan-blokk {
            position: absolute;
            left: 4px; right: 4px;
            background: var(--primær);
            border-radius: 4px;
            z-index: 2;
            cursor: pointer;
            display: flex; align-items: center;
            padding: 0 8px;
            font-size: 11px; font-weight: 700;
            color: white; font-family: 'Syne', sans-serif;
            transition: opacity 0.15s;
            overflow: hidden;
        }
        .timeplan-blokk:hover { opacity: 0.85; }

        .dato-varighet-rad {
            display: flex; gap: 12px; margin-bottom: 20px;
        }
        .dato-varighet-rad .form-gruppe {
            flex: 1; margin-bottom: 0;
        }
        /* Dato-input samme stil som resten */
        input[type="date"] {
            width: 100%; padding: 10px 12px;
            border: 2px solid var(--kant); border-radius: var(--rs);
            font-size: 0.95em; font-family: 'Nunito', sans-serif;
            transition: border-color 0.2s; background: var(--hvit);
        }
        input[type="date"]:focus {
            outline: none; border-color: var(--primær);
            box-shadow: 0 0 0 3px rgba(148,144,212,0.1);
        }
        /* Timeplan med scrollbar */
        .timeplan-wrapper {
            height: 280px;
            overflow-y: auto;
            border: 1px solid var(--kant);
            border-radius: var(--rs);
            scroll-behavior: smooth;
        }
        .timeplan-wrapper::-webkit-scrollbar { width: 6px; }
        .timeplan-wrapper::-webkit-scrollbar-track { background: var(--primær-lys); }
        .timeplan-wrapper::-webkit-scrollbar-thumb { background: var(--primær-mid); border-radius: 3px; }

        button {
            padding: 10px 16px; border: none; border-radius: var(--rs);
            font-size: 0.95em; font-weight: 600; cursor: pointer;
            transition: all 0.2s; font-family: 'Syne', sans-serif;
        }
        .btn-primær { background: var(--primær); color: white; }
        .btn-primær:hover { background: var(--primær-mørk); }
        .btn-sekundær { background: var(--kant); color: var(--tekst); }
        .btn-sekundær:hover { background: var(--primær-mid); }
        .btn-fare { background: #f87171; color: white; }
        .btn-fare:hover { background: #dc2626; }

        .knapp-gruppe { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
        .knapp-gruppe button { flex: 1; min-width: 120px; }

        /* ── Resultater ── */
        .resultater-tabell { width: 100%; border-collapse: collapse; margin: 16px 0; overflow-x: auto; display: block; }
        .resultater-tabell th {
            background: var(--primær-lys); padding: 12px; text-align: left;
            font-weight: 700; color: var(--primær-mørk);
            border-bottom: 2px solid var(--kant);
            font-family: 'Syne', sans-serif; font-size: 12px;
            white-space: nowrap;
        }
        .resultater-tabell td { padding: 12px; border-bottom: 1px solid var(--kant); }
        .resultater-tabell tr:hover { background: var(--primær-lys); }
        .stemme-ja { color: #10b981; font-weight: 700; }
        .stemme-nei { color: #f87171; font-weight: 700; }

        .deling-boks {
            background: var(--primær-lys); padding: 16px;
            border-radius: var(--r); margin: 16px 0;
            border: 2px solid var(--primær-mid);
            display: flex; gap: 8px;
        }
        .deling-boks input { flex: 1; background: var(--hvit); border: 1px solid var(--kant); }

        /* ── Deltaker ── */
        .deltaker-container { max-width: 600px; margin: 0 auto; }

        .møte-header {
            background: var(--hvit); padding: 24px;
            border-radius: var(--r); margin-bottom: 24px;
            border: 1px solid var(--kant); border-left: 4px solid var(--primær);
        }
        .møte-header h2 { color: var(--primær); margin-bottom: 8px; font-family: 'Syne', sans-serif; }
        .møte-header p { color: var(--tekst-sek); font-size: 0.95em; }

        .tid-kort {
            background: var(--hvit); padding: 10px 14px;
            border-radius: var(--r); margin-bottom: 8px;
            border: 1px solid var(--kant); border-left: 4px solid var(--primær);
        }
        .tid-rad {
            display: flex; align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .tid-tekst { font-weight: 700; color: var(--tekst); font-size: 0.95em; font-family: 'Syne', sans-serif; }
        .tid-stemmer { font-size: 0.85em; color: var(--tekst-sek); white-space: nowrap; margin-left: 12px; }

        .stemme-knapp-gruppe { display: flex; gap: 6px; }
        .stemme-knapp {
            flex: 1; padding: 7px 10px;
            border: 2px solid var(--kant); background: var(--hvit);
            border-radius: var(--rs); cursor: pointer;
            font-weight: 700; transition: all 0.2s;
            font-size: 0.88em; font-family: 'Syne', sans-serif;
        }
        .stemme-knapp:hover { border-color: var(--primær); background: var(--primær-lys); }
        .stemme-knapp.valgt { background: var(--primær); color: white; border-color: var(--primær); }

        .suksess-melding {
            background: var(--primær-lys); color: var(--primær-mørk);
            padding: 16px; border-radius: var(--rs);
            margin-top: 24px; text-align: center;
            font-weight: 700; border: 2px solid var(--primær);
        }

        @media (max-width: 768px) {
            .admin-grid { grid-template-columns: 1fr; }
            .knapp-gruppe { flex-direction: column; }
            .knapp-gruppe button { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- Login Overlay (skjules for deltakere og innloggede admins) -->
    <div id="loginOverlay">
        <svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">

            <circle cx="26" cy="36" r="18" fill="#9490d4"/>
            <circle cx="46" cy="36" r="18" fill="#b4e8a8"/>
            <circle cx="26" cy="36" r="18" fill="#2e2b45" clip-path="url(#licp)"/>
            <circle cx="26" cy="36" r="18" fill="none" stroke="#6860b0" stroke-width="1"/>

        <div style="text-align:center;">

            <div style="font-family:'Nunito',sans-serif;font-size:11px;color:var(--primær-mid);margin-top:8px;">v1.07</div>
        </div>
        <button onclick="signIn()">
            <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#fff" d="M44.5 20H24v8.5h11.8C34.7 33.9 30.1 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 4.1 29.6 2 24 2 11.8 2 2 11.8 2 24s9.8 22 22 22c11 0 21-8 21-22 0-1.3-.2-2.7-.5-4z"/></svg>
            Logg inn med Google
        </button>
    </div>

    <!-- Header (kun synlig for admin) -->
    <header id="appHeader">
        <div class="logo">Schedule <span style="font-size:11px;font-weight:400;color:var(--tekst-sek);margin-left:4px;">v1.07</span></div>
        <div class="header-handlinger">
            <div>
                <div class="bruker-navn" id="brukerNavn"></div>
                <div class="bruker-rolle">Admin</div>
            </div>
            <button class="header-knapp" onclick="logout()" title="Logg ut" style="font-size:14px;">⏏</button>
        </div>
    </header>

    <!-- Admin Panel -->
    <div id="adminPanel" class="panel">
        <main>
            <div class="admin-grid">
                <div class="kort">
                    <div class="kort-header">
                        <div class="kort-tittel">Dine møter</div>
                    </div>
                    <div>
                        <div class="møte-liste" id="møteListe"></div>
                        <button class="legg-til-knapp" onclick="opprettNyttMøte()">+ Nytt møte</button>
                    </div>
                </div>

                <div id="detaljSection">
                    <div class="kort">
                        <div class="kort-header">
                            <div class="kort-tittel" id="detaljTittel"></div>
                        </div>
                        <div class="kort-innhold" id="detaljInnhold"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Deltaker Panel -->
    <div id="deltakerPanel" class="panel">
        <main>
            <div class="deltaker-container">
                <div class="møte-header">
                    <h2 id="deltakerMøteTittel"></h2>
                    <p id="deltakerMøteBeskrivelse"></p>
                </div>

                <!-- Navnefelt -->
                <div class="kort" id="navneKort" style="margin-bottom:12px;">
                    <div class="kort-innhold" style="display:flex;gap:12px;align-items:flex-end;padding:12px 16px;">
                        <div style="flex:1;">
                            <label style="margin-bottom:4px;">Ditt navn</label>
                            <input type="text" id="deltakerNavnInput" placeholder="Skriv ditt navn her..." oninput="oppdaterNavn()" style="padding:8px 12px;">
                        </div>
                    </div>
                </div>

                <div id="deltakerTiderContainer"></div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
            from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
        import { getFirestore, collection, doc, setDoc, getDoc, deleteDoc, onSnapshot, query, where }
            from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDvR6Jlt9j7ECudDhF1VtPPr2G3gcEqXCA",
            authDomain: "scheduler-2be23.firebaseapp.com",
            projectId: "scheduler-2be23",
            storageBucket: "scheduler-2be23.firebasestorage.app",
            messagingSenderId: "547633808881",
            appId: "1:547633808881:web:e761037ef250b715e07050"
        };

        const app  = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db   = getFirestore(app);

        // ── State ──
        let currentUser  = null;
        let currentMøteId = null;
        let møter        = {};
        let redigeringsModus = false; // skiller mellom visning og redigering

        // ── Sjekk URL umiddelbart ──
        const urlParams     = new URLSearchParams(window.location.search);
        const møteIdFraUrl  = urlParams.get('møte');
        const erDeltaker    = !!møteIdFraUrl;

        if (erDeltaker) {
            // Deltaker-modus: skjul loginoverlay, vis deltaker-panel
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('deltakerPanel').classList.add('aktiv');
            lastDeltakerPanel(møteIdFraUrl);
        }

        // ── Auth ──
        const ADMIN_EPOST = 'eirik.sorbo@gmail.com'; // Kun denne brukeren får logge inn

        window.signIn = async () => {
            try {
                const result = await signInWithPopup(auth, new GoogleAuthProvider());
                if (result.user.email !== ADMIN_EPOST) {
                    await signOut(auth);
                    alert('Denne appen er kun for arrangøren.');
                }
            } catch(e) {
                alert('Innlogging feilet: ' + e.message);
            }
        };

        window.logout = async () => { await signOut(auth); };

        onAuthStateChanged(auth, async bruker => {
            if (erDeltaker) return; // ikke forstyrr deltaker-modus

            if (bruker && bruker.email === ADMIN_EPOST) {
                currentUser = bruker;
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('appHeader').style.display = 'flex';
                document.getElementById('adminPanel').classList.add('aktiv');
                document.getElementById('brukerNavn').textContent = bruker.displayName || bruker.email;

                // Lytt på alle møter i sanntid (BUGFIX: unngår å overskrive ny_-møter)
                const q = query(collection(db, 'schedule_moter'), where('uid', '==', bruker.uid));
                onSnapshot(q, snapshot => {
                    snapshot.forEach(d => {
                        møter[d.id] = d.data();
                    });
                    // Fjern møter som er slettet fra Firestore
                    const firebaseIds = snapshot.docs.map(d => d.id);
                    Object.keys(møter).forEach(id => {
                        if (!id.startsWith('ny_') && !firebaseIds.includes(id)) {
                            delete møter[id];
                        }
                    });
                    renderMøteListe();
                    // Oppdater åpent møte live hvis det er i visning (ikke redigering)
                    if (currentMøteId && !currentMøteId.startsWith('ny_') && !redigeringsModus) {
                        renderMøteDetaljer(currentMøteId);
                    }
                });
            } else {
                currentUser = null;
                document.getElementById('loginOverlay').style.display = 'flex';
                document.getElementById('appHeader').style.display = 'none';
                document.getElementById('adminPanel').classList.remove('aktiv');
                møter = {};
            }
        });

        // ── Admin: Møteliste ──
        function renderMøteListe() {
            const liste = document.getElementById('møteListe');
            const ids = Object.keys(møter).filter(id => !id.startsWith('ny_'));

            if (ids.length === 0) {
                liste.innerHTML = '<div class="tom-melding">Ingen møter ennå</div>';
                if (!currentMøteId?.startsWith('ny_')) {
                    document.getElementById('detaljSection').classList.remove('vis');
                }
                return;
            }

            liste.innerHTML = ids.map(id => {
                const m = møter[id];
                const aktiv = currentMøteId === id ? 'aktiv' : '';
                const antall = Object.keys(m.stemmer || {}).length;
                return `<div class="møte-item ${aktiv}" onclick="velgMøte('${id}')">
                    <div class="møte-tittel">${m.tittel}</div>
                    <div class="møte-meta">${m.tider.length} tider · ${antall} deltaker(e)</div>
                </div>`;
            }).join('');
        }

        window.velgMøte = id => {
            currentMøteId = id;
            redigeringsModus = false;
            renderMøteListe();
            renderMøteDetaljer(id);
        };

        // ── Admin: Nytt møte ──
        window.opprettNyttMøte = () => {
            currentMøteId = 'ny_' + Date.now();
            redigeringsModus = true;
            møter[currentMøteId] = { tittel: '', beskrivelse: '', varighet: 60, tider: [''], stemmer: {} };
            renderMøteListe();
            visSkjema(currentMøteId);
        };

        // ── Admin: Vis møtedetaljer (lesemodus) ──
        function renderMøteDetaljer(møteId) {
            const møte = møter[møteId];
            if (!møte) return;

            document.getElementById('detaljTittel').textContent = møte.tittel;
            document.getElementById('detaljSection').classList.add('vis');

            const link = window.location.origin + window.location.pathname + '?møte=' + møteId;

            const stemmer = møte.stemmer || {};
            const deltakere = Object.keys(stemmer);
            const antallDeltakere = deltakere.length;

            // Grupper tider per dato
            const datoGrupper = {};
            møte.tider.forEach(tid => {
                const dato = new Date(tid).toLocaleDateString('no-NO', { weekday:'short', day:'numeric', month:'short' });
                if (!datoGrupper[dato]) datoGrupper[dato] = [];
                datoGrupper[dato].push(tid);
            });

            // Tell ja per tid
            const jaPerTid = {};
            møte.tider.forEach(tid => {
                jaPerTid[tid] = deltakere.filter(n => stemmer[n]?.[tid] === 'ja').length;
            });
            const maxJa = Math.max(...Object.values(jaPerTid), 0);
            const alleKanTider = møte.tider.filter(t => jaPerTid[t] === antallDeltakere && antallDeltakere > 0);

            function tidFarge(tid) {
                if (antallDeltakere === 0) return 'var(--primær-lys)';
                const ja = jaPerTid[tid] || 0;
                if (ja === antallDeltakere) return '#d1fae5';
                if (ja === maxJa && ja > 0) return '#fef3c7';
                return 'var(--primær-lys)';
            }

            // Analysetekst
            let analyseTekst = '';
            if (antallDeltakere === 0) {
                analyseTekst = '<p style="color:var(--tekst-sek);font-size:0.9em;margin-bottom:8px;">Ingen har stemt ennå.</p>';
            } else if (alleKanTider.length > 0) {
                const tidTexts = alleKanTider.map(t => {
                    const s = new Date(t), e = new Date(s.getTime() + (møte.varighet||60)*60000);
                    const fmt = d => d.toLocaleString('no-NO',{hour:'2-digit',minute:'2-digit'});
                    return s.toLocaleString('no-NO',{weekday:'short',day:'numeric',month:'short'}) + ' ' + fmt(s) + '–' + fmt(e);
                }).join(', ');
                analyseTekst = `<div style="background:#d1fae5;border:1px solid #6ee7b7;border-radius:var(--rs);padding:10px 14px;margin-bottom:12px;font-size:0.9em;">✅ <strong>Alle kan:</strong> ${tidTexts}</div>`;
            } else if (maxJa > 0) {
                const besteTider = møte.tider.filter(t => jaPerTid[t] === maxJa);
                const ikkeKan = [...new Set(besteTider.flatMap(t => deltakere.filter(n => stemmer[n]?.[t] !== 'ja')))];
                analyseTekst = `<div style="background:#fef3c7;border:1px solid #fbbf24;border-radius:var(--rs);padding:10px 14px;margin-bottom:12px;font-size:0.9em;">⚡ <strong>Flest kan (${maxJa}/${antallDeltakere}).</strong>${ikkeKan.length ? ' Kan ikke: ' + ikkeKan.join(', ') + '.' : ''}</div>`;
            }

            // Tabell gruppert per dato
            let tabell = '';
            if (antallDeltakere === 0) {
                tabell = '<p style="color:var(--tekst-sek);margin-top:8px;">Ingen stemmer ennå.</p>';
            } else {
                tabell = analyseTekst + '<div style="overflow-x:auto;">';
                Object.entries(datoGrupper).forEach(([dato, tiderIDato]) => {
                    tabell += `<div style="font-family:'Syne',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--tekst-sek);padding:10px 0 4px;">${dato}</div>`;
                    tabell += '<table class="resultater-tabell" style="margin-top:0;margin-bottom:12px;"><thead><tr><th style="min-width:80px;">Deltaker</th>';
                    tiderIDato.forEach(tid => {
                        const s = new Date(tid), e = new Date(s.getTime() + (møte.varighet||60)*60000);
                        const fmt = d => d.toLocaleString('no-NO',{hour:'2-digit',minute:'2-digit'});
                        tabell += `<th style="text-align:center;background:${tidFarge(tid)};padding:6px 10px;">${fmt(s)}<br><span style="font-weight:400;font-size:10px;opacity:0.7;">–${fmt(e)}</span></th>`;
                    });
                    tabell += '</tr></thead><tbody>';
                    deltakere.forEach(navn => {
                        tabell += `<tr><td><strong>${navn}</strong></td>`;
                        tiderIDato.forEach(tid => {
                            const v = stemmer[navn]?.[tid] || '–';
                            tabell += `<td style="text-align:center;background:${tidFarge(tid)};padding:6px 10px;" class="${v==='ja'?'stemme-ja':v==='nei'?'stemme-nei':''}">${v==='ja'?'✓':v==='nei'?'✗':'–'}</td>`;
                        });
                        tabell += '</tr>';
                    });
                    tabell += '</tbody></table>';
                });
                tabell += '</div>';
            }

            document.getElementById('detaljInnhold').innerHTML = `
                <div class="form-gruppe">
                    <label>Stemmeresultater</label>
                    ${tabell}
                </div>
                <div class="form-gruppe">
                    <label>Møte lenke</label>
                    <div class="deling-boks">
                        <input type="text" value="${link}" readonly>
                        <button class="btn-primær" onclick="kopierLink('${link}')">Kopier</button>
                    </div>
                </div>
                <div class="form-gruppe">
                    <label>Varighet</label>
                    <div style="padding:8px;background:var(--primær-lys);border-radius:6px;">${varighetTekst(møte.varighet)}</div>
                </div>
                <div class="form-gruppe">
                    <label>Tider</label>
                    ${møte.tider.map(tid => {
                        const start = new Date(tid);
                        const slutt = new Date(start.getTime() + (møte.varighet||60) * 60000);
                        const fmt = d => d.toLocaleString('no-NO', { hour:'2-digit', minute:'2-digit' });
                        const dag = start.toLocaleString('no-NO', { year:'numeric', month:'short', day:'numeric' });
                        return `<div style="padding:8px;background:var(--primær-lys);border-radius:6px;margin-bottom:8px;">${dag}, ${fmt(start)}–${fmt(slutt)}</div>`;
                    }).join('')}
                </div>
                <div class="knapp-gruppe">
                    <button class="btn-sekundær" onclick="redigerMøte('${møteId}')">Rediger</button>
                    <button class="btn-fare" onclick="slettMøte('${møteId}')">Slett</button>
                </div>`;
        }

        // ── Admin: Vis redigeringsskjema ──
        let timeplanDato = new Date();
        timeplanDato.setHours(0,0,0,0);

        function visSkjema(møteId) {
            const møte = møter[møteId];
            const erNy = møteId.startsWith('ny_');

            document.getElementById('detaljTittel').textContent = erNy ? 'Nytt møte' : 'Rediger møte';
            document.getElementById('detaljSection').classList.add('vis');

            // Sett timeplanDato til første valgte tid, eller i dag
            if (møte.tider && møte.tider.length > 0 && møte.tider[0]) {
                timeplanDato = new Date(møte.tider[0]);
                timeplanDato.setHours(0,0,0,0);
            } else {
                timeplanDato = new Date();
                timeplanDato.setHours(0,0,0,0);
            }

            document.getElementById('detaljInnhold').innerHTML = `
                <div class="form-gruppe">
                    <label>Tittel</label>
                    <input type="text" id="editTittel" placeholder="F.eks. Teammøte" value="${møte.tittel || ''}">
                </div>
                <div class="form-gruppe">
                    <label>Beskrivelse (valgfritt)</label>
                    <textarea id="editBeskrivelse" placeholder="Noen ord om møtet...">${møte.beskrivelse || ''}</textarea>
                </div>
                <div class="dato-varighet-rad">
                    <div class="form-gruppe">
                        <label>Dato</label>
                        <input type="date" id="editDato" value="${datoTilString(timeplanDato)}" onchange="byttDato(this.value)">
                    </div>
                    <div class="form-gruppe">
                        <label>Varighet per møte</label>
                        <select id="editVarighet" onchange="oppdaterTimeplan()" style="width:100%;padding:10px 12px;border:2px solid var(--kant);border-radius:var(--rs);font-size:0.95em;font-family:'Nunito',sans-serif;">
                            <option value="15">15 min</option>
                            <option value="30">30 min</option>
                            <option value="45">45 min</option>
                            <option value="60" ${(møte.varighet||60)===60?'selected':''}>1 time</option>
                            <option value="90" ${(møte.varighet||60)===90?'selected':''}>1,5 time</option>
                            <option value="120" ${(møte.varighet||60)===120?'selected':''}>2 timer</option>
                            <option value="180" ${(møte.varighet||60)===180?'selected':''}>3 timer</option>
                        </select>
                    </div>
                </div>
                <div class="form-gruppe">
                    <label>Velg tidspunkter <span style="font-weight:400;color:var(--tekst-sek);">— klikk i timeplanen</span></label>
                    <div class="timeplan-nav">
                        <button class="timeplan-nav-knapp" onclick="endreTimeplanDag(-1)">←</button>
                        <div class="timeplan-dato" id="timeplanDatoLabel"></div>
                        <button class="timeplan-nav-knapp" onclick="endreTimeplanDag(1)">→</button>
                    </div>
                    <div class="timeplan-wrapper" id="timeplanWrapper">
                        <div class="timeplan-grid" id="timeplanGrid"></div>
                    </div>
                </div>
                <div class="knapp-gruppe">
                    <button class="btn-primær" onclick="lagreMøte()">Lagre</button>
                    <button class="btn-sekundær" onclick="avbryt()">Avbryt</button>
                </div>`;

            const varighetEl = document.getElementById('editVarighet');
            if (varighetEl) varighetEl.value = møte.varighet || 60;
            oppdaterTimeplan();
        }

        function datoTilString(dato) {
            return dato.toISOString().split('T')[0];
        }

        window.byttDato = (verdi) => {
            timeplanDato = new Date(verdi + 'T00:00:00');
            oppdaterTimeplan();
        };

        window.endreTimeplanDag = (retning) => {
            timeplanDato.setDate(timeplanDato.getDate() + retning);
            document.getElementById('editDato').value = datoTilString(timeplanDato);
            oppdaterTimeplan();
        };

        window.oppdaterTimeplan = () => {
            const varighet = parseInt(document.getElementById('editVarighet')?.value || 60);
            const slotMinutter = 15;
            const startTime = 7 * 60;  // 07:00
            const sluttTime = 21 * 60; // 21:00
            const antallSlots = (sluttTime - startTime) / slotMinutter;
            const slotHøyde = 18;
            const blokkhøyde = (varighet / slotMinutter) * slotHøyde;

            const datoLabel = timeplanDato.toLocaleDateString('no-NO', { weekday:'long', day:'numeric', month:'long' });
            const labelEl = document.getElementById('timeplanDatoLabel');
            if (labelEl) labelEl.textContent = datoLabel.charAt(0).toUpperCase() + datoLabel.slice(1);

            const møte = møter[currentMøteId];
            const tider = møte?.tider || [];

            // Finn valgte slots for denne dagen
            const dagStr = datoTilString(timeplanDato);
            const valgtePåDenneDagen = tider.filter(t => t.startsWith(dagStr));

            let html = '';
            for (let i = 0; i < antallSlots; i++) {
                const minutter = startTime + i * slotMinutter;
                const time = Math.floor(minutter / 60);
                const min = minutter % 60;
                const tidStr = `${String(time).padStart(2,'0')}:${String(min).padStart(2,'0')}`;
                const iso = `${dagStr}T${tidStr}`;
                const erHelTime = min === 0;
                const erHalvTime = min === 30;
                const erStiplet = min === 15 || min === 45;
                const visLabel = erHelTime || erHalvTime;

                html += `<div class="timeplan-slot ${erHelTime?'hel-time':''} ${erStiplet?'stiplet':''}" onclick="toggleTid('${iso}')">
                    <div class="timeplan-tid">${visLabel ? tidStr : ''}</div>
                    <div class="timeplan-innhold"></div>
                </div>`;
            }

            const grid = document.getElementById('timeplanGrid');
            if (!grid) return;

            // Bevar scroll-posisjon
            const wrapper = document.getElementById('timeplanWrapper');
            const scrollPosFør = wrapper ? wrapper.scrollTop : null;

            grid.innerHTML = html;

            // Scroll til 08:00 kun første gang (når scrollPos er 0 eller null)
            if (wrapper) {
                const åtteNull = 4 * 18; // 07:00 + 4 slots à 18px = 08:00
                wrapper.scrollTop = (scrollPosFør && scrollPosFør > 0) ? scrollPosFør : åtteNull;
            }

            // Tegn blokker for valgte tider
            valgtePåDenneDagen.forEach(tid => {
                const tidDel = tid.split('T')[1];
                if (!tidDel) return;
                const [h, m] = tidDel.split(':').map(Number);
                const minutterFraStart = (h * 60 + m) - startTime;
                const slotIndex = minutterFraStart / slotMinutter;
                const topPx = slotIndex * slotHøyde;

                const blokk = document.createElement('div');
                blokk.className = 'timeplan-blokk';
                blokk.style.top = topPx + 'px';
                blokk.style.height = (blokkhøyde - 2) + 'px';
                blokk.textContent = tidDel.slice(0,5);
                blokk.onclick = (e) => { e.stopPropagation(); toggleTid(tid); };

                // Plasser blokken relativt til grid
                grid.style.position = 'relative';
                const innholdCeller = grid.querySelectorAll('.timeplan-innhold');
                if (innholdCeller[slotIndex]) {
                    innholdCeller[slotIndex].style.position = 'relative';
                    innholdCeller[slotIndex].appendChild(blokk);
                    blokk.style.top = '0';
                    blokk.style.position = 'absolute';
                }
            });
        };

        window.toggleTid = (iso) => {
            const møte = møter[currentMøteId];
            if (!møte) return;
            const idx = møte.tider.indexOf(iso);
            if (idx >= 0) {
                møte.tider.splice(idx, 1);
            } else {
                møte.tider.push(iso);
                møte.tider.sort();
            }
            oppdaterTimeplan();
        };

        window.redigerMøte = id => {
            currentMøteId = id;
            redigeringsModus = true;
            visSkjema(id);
        };

        window.lagreMøte = async () => {
            const møte = møter[currentMøteId];
            møte.tittel = document.getElementById('editTittel').value.trim();
            møte.beskrivelse = document.getElementById('editBeskrivelse').value.trim();
            møte.varighet = parseInt(document.getElementById('editVarighet').value);
            møte.tider = møte.tider.filter(t => t);

            if (!møte.tittel || møte.tider.length === 0) {
                alert('Fyll inn tittel og minst én tid');
                return;
            }

            const erNy  = currentMøteId.startsWith('ny_');
            const nyId  = erNy ? Date.now().toString() : currentMøteId;
            møte.uid    = currentUser.uid;
            if (!møte.stemmer) møte.stemmer = {};

            try {
                await setDoc(doc(db, 'schedule_moter', nyId), møte);
                if (erNy) {
                    delete møter[currentMøteId];
                    møter[nyId] = møte;
                    currentMøteId = nyId;
                }
                redigeringsModus = false;
                renderMøteListe();
                renderMøteDetaljer(currentMøteId);
            } catch(e) { alert('Feil ved lagring: ' + e.message); }
        };

        window.avbryt = () => {
            if (currentMøteId?.startsWith('ny_')) {
                delete møter[currentMøteId];
                currentMøteId = null;
                document.getElementById('detaljSection').classList.remove('vis');
            } else {
                // Gå tilbake til visning
                redigeringsModus = false;
                renderMøteDetaljer(currentMøteId);
            }
            renderMøteListe();
        };

        window.slettMøte = async id => {
            if (!confirm('Slett dette møtet?')) return;
            try {
                await deleteDoc(doc(db, 'schedule_moter', id));
                delete møter[id];
                currentMøteId = null;
                redigeringsModus = false;
                renderMøteListe();
                document.getElementById('detaljSection').classList.remove('vis');
            } catch(e) { alert('Feil ved sletting: ' + e.message); }
        };

        window.kopierLink = link => {
            navigator.clipboard.writeText(link);
            const knapp = document.querySelector('.deling-boks button');
            if (knapp) {
                knapp.textContent = 'Kopiert!';
                knapp.style.background = 'var(--primær-mørk)';
                setTimeout(() => {
                    knapp.textContent = 'Kopier';
                    knapp.style.background = '';
                }, 2000);
            }
        };

        function varighetTekst(min) {
            if (!min) return '1 time';
            if (min < 60) return min + ' minutter';
            if (min === 60) return '1 time';
            if (min % 60 === 0) return (min / 60) + ' timer';
            return Math.floor(min/60) + ',' + (min%60/60*10) + ' time';
        }

        // ── Deltaker: Last panel ──
        async function lastDeltakerPanel(møteId) {
            try {
                const snap = await getDoc(doc(db, 'schedule_moter', møteId));
                if (!snap.exists()) {
                    document.getElementById('deltakerTiderContainer').innerHTML =
                        '<p style="color:var(--tekst-sek);padding:20px;">Møte ikke funnet.</p>';
                    return;
                }
                const møte = snap.data();
                document.getElementById('deltakerMøteTittel').textContent = møte.tittel;
                document.getElementById('deltakerMøteBeskrivelse').textContent = møte.beskrivelse || '';

                // Fyll inn lagret navn hvis det finnes
                const lagretNavn = localStorage.getItem('deltaker_navn_' + møteId);
                if (lagretNavn) {
                    document.getElementById('deltakerNavnInput').value = lagretNavn;
                }

                renderDeltakerTider(møteId, møte);
            } catch(e) {
                document.getElementById('deltakerTiderContainer').innerHTML =
                    '<p style="color:var(--tekst-sek);padding:20px;">Kunne ikke laste møtet.</p>';
                console.error(e);
            }
        }

        // Oppdater navn fra felt
        window.oppdaterNavn = () => {
            const navn = document.getElementById('deltakerNavnInput').value.trim();
            if (navn) {
                localStorage.setItem('deltaker_navn_' + møteIdFraUrl, navn);
            }
            // Re-render for å vise/skjule valgte stemmer
            getDoc(doc(db, 'schedule_moter', møteIdFraUrl)).then(snap => {
                if (snap.exists()) renderDeltakerTider(møteIdFraUrl, snap.data());
            });
        };

        function renderDeltakerTider(møteId, møte) {
            const navn    = localStorage.getItem('deltaker_navn_' + møteId) || null;
            const stemmer = møte.stemmer || {};

            document.getElementById('deltakerTiderContainer').innerHTML =
                møte.tider.map(tid => {
                    const formatted = new Date(tid).toLocaleString('no-NO', {
                        weekday:'long', year:'numeric', month:'long',
                        day:'numeric', hour:'2-digit', minute:'2-digit'
                    });
                    let ja = 0, nei = 0;
                    Object.values(stemmer).forEach(s => {
                        if (s[tid] === 'ja') ja++;
                        if (s[tid] === 'nei') nei++;
                    });
                    const minStemme = navn ? (stemmer[navn]?.[tid] || null) : null;

                    // Escape tid for bruk i onclick-attributt
                    const tidEscaped = tid.replace(/'/g, "\\'");

                    return `<div class="tid-kort">
                        <div class="tid-rad">
                            <div class="tid-tekst">${formatted} <span style="font-size:0.8em;font-weight:400;color:var(--tekst-sek);">(${varighetTekst(møte.varighet)})</span></div>
                            <div class="tid-stemmer">✓ ${ja} · ✗ ${nei}</div>
                        </div>
                        <div class="stemme-knapp-gruppe">
                            <button class="stemme-knapp ${minStemme==='ja'?'valgt':''}" onclick="stem('${møteId}','${tidEscaped}','ja')">✓ Kan</button>
                            <button class="stemme-knapp ${minStemme==='nei'?'valgt':''}" onclick="stem('${møteId}','${tidEscaped}','nei')">✗ Kan ikke</button>
                        </div>
                    </div>`;
                }).join('')
                + (navn ? '<div class="suksess-melding">✓ Stemmene dine er lagret</div>' : '');
        }

        window.stem = async (møteId, tid, stemme) => {
            const navn = document.getElementById('deltakerNavnInput').value.trim();
            if (!navn) {
                document.getElementById('deltakerNavnInput').focus();
                document.getElementById('deltakerNavnInput').style.borderColor = '#f87171';
                setTimeout(() => document.getElementById('deltakerNavnInput').style.borderColor = '', 2000);
                return;
            }
            localStorage.setItem('deltaker_navn_' + møteId, navn);

            try {
                const snap = await getDoc(doc(db, 'schedule_moter', møteId));
                if (!snap.exists()) { alert('Møtet finnes ikke lenger'); return; }
                const møte = snap.data();
                if (!møte.stemmer)        møte.stemmer = {};
                if (!møte.stemmer[navn])  møte.stemmer[navn] = {};
                møte.stemmer[navn][tid]   = stemme;
                await setDoc(doc(db, 'schedule_moter', møteId), møte);
                renderDeltakerTider(møteId, møte);
            } catch(e) { alert('Feil ved stemming: ' + e.message); }
        };
    </script>
</body>
</html>
