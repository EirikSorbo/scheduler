    <title>Schedule</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --color-primary: #3b82f6;
            --color-primary-light: #eff6ff;
            --color-primary-dark: #1e3a5f;
            --color-primary-mid: #bfdbfe;
            --color-text: #1e3a5f;
            --color-text-secondary: #4b7ab0;
            --color-border: #bfdbfe;
            --color-bg: #f0f7ff;
            --color-white: #ffffff;
            --r: 12px;
            --rs: 8px;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--color-bg);
            color: var(--color-text);
            min-height: 100vh;
            font-size: 15px;
            line-height: 1.5;
        }

        /* ── Login Overlay ── */
        #loginOverlay {
            display: flex;
            position: fixed;
            inset: 0;
            background: var(--color-bg);
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }

        #loginOverlay button {
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 13px 28px;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
        }

        #loginOverlay button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59,130,246,0.3);
        }

        /* ── Header ── */
        header {
            background: var(--color-white);
            border-bottom: 1px solid var(--color-border);
            padding: 0 20px;
            display: none;
            align-items: center;
            justify-content: space-between;
            height: 64px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 17px;
            color: var(--color-primary);
            letter-spacing: -0.3px;
        }

        .header-actions { display: flex; gap: 12px; align-items: center; }

        .user-name { font-weight: 600; color: var(--color-text); font-size: 0.9em; }
        .user-rolle { font-size: 0.8em; color: var(--color-text-secondary); text-align: right; }

        .header-button {
            width: 36px; height: 36px;
            border-radius: 50%;
            border: 1px solid var(--color-border);
            background: var(--color-white);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            color: var(--color-text-secondary);
            font-size: 16px;
            transition: all 0.15s;
        }
        .header-button:hover { background: var(--color-primary-light); color: var(--color-primary); border-color: var(--color-primary-mid); }

        /* ── Paneler ── */
        .panel { display: none; }
        .panel.active { display: block; }

        main { max-width: 1000px; margin: 0 auto; padding: 20px 12px 64px; }

        /* ── Admin Grid ── */
        .admin-grid { display: flex; flex-direction: column; gap: 20px; }

        .admin-top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-botempty: 12px;
        }
        .admin-top-row .add-button {
            margin: 0;
            width: auto;
            padding: 8px 16px;
        }

        .card { background: var(--color-white); border-radius: var(--r); border: 1px solid var(--color-border); overflow: hidden; }

        .card-header { padding: 16px 20px; border-bottom: 1px solid var(--color-border); background: var(--color-primary-light); }

        .card-title {
            font-family: 'Syne', sans-serif;
            font-weight: 700; font-size: 14px;
            color: var(--color-primary-dark);
            text-transform: uppercase; letter-spacing: 0.3px;
        }

        .meeting-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 12px 16px;
        }

        .meeting-item {
            padding: 8px 16px;
            border-radius: 20px;
            border: 2px solid var(--color-border);
            background: var(--color-white);
            cursor: pointer;
            transition: all 0.15s;
            border-left: 2px solid var(--color-border);
        }
        .meeting-item:hover { background: var(--color-primary-light); border-color: var(--color-primary-mid); }
        .meeting-item.active { background: var(--color-primary-light); border-color: var(--color-primary); }

        .meeting-title { font-weight: 700; font-size: 13px; color: var(--color-text); }
        .meeting-meta { font-size: 11px; color: var(--color-text-secondary); margin-top: 2px; }

        .add-button {
            background: var(--color-primary); color: white; border: none;
            border-radius: var(--rs);
            padding: 9px 16px;
            font-family: 'Syne', sans-serif; font-weight: 700; font-size: 12px;
            text-transform: uppercase; letter-spacing: 0.4px;
            cursor: pointer; transition: background 0.15s;
        }
        .add-button:hover { background: var(--color-primary-dark); }

        .empty-message { padding: 32px 20px; text-align: center; color: var(--color-text-secondary); font-size: 14px; }

        #detaljSection { display: none; }
        #detaljSection.vis { display: block; }

        .card-body { padding: 20px; }

        .form-group { margin-botempty: 20px; }

        label {
            display: block; font-weight: 700; margin-botempty: 8px;
            color: var(--color-text); font-size: 0.95em; font-family: 'Syne', sans-serif;
        }

        input[type="text"], input[type="datetime-local"], textarea {
            width: 100%; padding: 10px 12px;
            border: 2px solid var(--color-border); border-radius: var(--rs);
            font-size: 0.95em; font-family: 'Nunito', sans-serif;
            transition: border-color 0.2s;
        }
        input:focus, textarea:focus {
            outline: none; border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
        }
        textarea { resize: vertical; min-height: 80px; }

        .times-container { background: var(--color-primary-light); padding: 16px; border-radius: var(--rs); margin: 12px 0; }
        .slot-slot { display: flex; gap: 8px; margin-botempty: 8px; align-items: center; }
        .slot-slot:last-child { margin-botempty: 0; }
        .slot-slot input { flex: 1; }

        /* ── Hendelsestype-toggle ── */
        .type-toggle {
            display: flex; gap: 0;
            border: 2px solid var(--color-border);
            border-radius: var(--rs);
            overflow: hidden;
            margin-botempty: 20px;
        }
        .type-toggle button {
            flex: 1; padding: 9px 16px;
            border: none; border-radius: 0;
            background: var(--color-white); color: var(--color-text-secondary);
            font-family: 'Syne', sans-serif; font-weight: 700;
            font-size: 12px; text-transform: uppercase;
            letter-spacing: 0.4px; cursor: pointer;
            transition: all 0.15s;
        }
        .type-toggle button:first-child { border-right: 2px solid var(--color-border); }
        .type-toggle button.active { background: var(--color-primary); color: white; }
        .type-toggle button:hover:not(.active) { background: var(--color-primary-light); }

        /* ── Månedskalender ── */
        .month-nav {
            display: flex; align-items: center;
            justify-content: space-between; margin-botempty: 12px;
        }
        .month-label {
            font-family: 'Syne', sans-serif; font-weight: 700;
            font-size: 14px; color: var(--color-text);
            text-transform: capitalize;
        }
        .month-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }
        .month-day-header {
            text-align: center;
            font-family: 'Syne', sans-serif;
            font-size: 11px; font-weight: 700;
            color: var(--color-text-secondary);
            text-transform: uppercase;
            padding: 4px 0;
        }
        .month-day {
            aspect-ratio: 1;
            display: flex; align-items: center; justify-content: center;
            border-radius: 8px;
            font-size: 13px; font-weight: 600;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.15s;
            color: var(--color-text);
            background: var(--color-white);
        }
        .month-day:hover:not(.empty):not(.past) { background: var(--color-primary-light); border-color: var(--color-primary-mid); }
        .month-day.empty { visibility: hidden; cursor: default; }
        .month-day.past { color: var(--color-border); cursor: default; }
        .month-day.selected { background: #1d4ed8; color: white; border-color: #1d4ed8; }
        .month-day.today:not(.selected) { border-color: var(--color-primary-mid); }
        .month-day:hover:not(.empty):not(.past):not(.selected) { background: var(--color-primary-light); border-color: var(--color-primary-mid); }
        .month-day.selected:hover { background: #1e40af; border-color: #1e40af; }

        /* Participant-kalender */
        .calendar-day {
            aspect-ratio: 1;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            border-radius: 8px;
            font-size: 12px; font-weight: 600;
            cursor: pointer;
            border: 2px solid var(--color-border);
            transition: all 0.15s;
            color: var(--color-text);
            background: var(--color-white);
            gap: 2px;
        }
        .calendar-day.empty { visibility: hidden; cursor: default; }
        .calendar-day .day-number { font-size: 13px; font-weight: 700; }
        .calendar-day .day-response { font-size: 9px; font-weight: 700; font-family: 'Syne', sans-serif; }
        .calendar-day.kan { background: #d1fae5; color: #065f46; border-color: #6ee7b7; }
        .schedule-nav {
            display: flex; align-items: center; justify-content: space-between;
            margin-botempty: 12px;
        }
        .schedule-date-label {
            font-family: 'Syne', sans-serif; font-weight: 700;
            font-size: 14px; color: var(--color-text);
            text-transform: capitalize;
        }
        .schedule-nav-btn {
            background: var(--color-white); border: 1px solid var(--color-border);
            border-radius: var(--rs); width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--color-text-secondary); font-size: 16px;
            transition: all 0.15s;
        }
        .schedule-nav-btn:hover { background: var(--color-primary-light); color: var(--color-primary); border-color: var(--color-primary-mid); }

        .schedule-grid {
            position: relative;
            overflow: hidden;
            background: var(--color-white);
        }
        .schedule-slot {
            display: flex; align-items: flex-start;
            height: 18px;
            border-bottom: 1px solid var(--color-border);
            cursor: pointer;
            transition: background 0.1s;
            position: relative;
        }
        .schedule-slot:last-child { border-bottom: none; }
        .schedule-slot:hover { background: var(--color-primary-light); }
        .schedule-slot.full-hour { border-bottom: 2px solid var(--color-primary-mid); }
        .schedule-slot.half-hour { border-bottom: 1px solid var(--color-border); }
        .schedule-slot.dotted { border-bottom: 1px dashed rgba(59,130,246,0.2); }
        .timeplan-time-label {
            width: 48px; min-width: 48px;
            font-size: 11px; color: var(--color-text-secondary);
            padding: 3px 6px; font-weight: 600;
            font-family: 'Syne', sans-serif;
            border-right: 1px solid var(--color-border);
            background: var(--color-primary-light);
        }
        .schedule-slot.full-hour .timeplan-time-label { color: var(--color-primary); }
        .timeplan-time-label {
            width: 48px; min-width: 48px;
            font-size: 11px; color: var(--color-text-secondary);
            padding: 3px 6px; font-weight: 600;
            font-family: 'Syne', sans-serif;
            border-right: 1px solid var(--color-border);
            background: var(--color-primary-light);
        }
        .schedule-slot.full-hour .schedule-slot { color: var(--color-primary); }
        .schedule-content { flex: 1; position: relative; }

        .timeplan-block {
            position: absolute;
            left: 4px; right: 4px;
            background: var(--color-primary);
            border-radius: 4px;
            z-index: 2;
            cursor: pointer;
            display: flex; align-items: center;
            padding: 0 8px;
            font-size: 11px; font-weight: 700;
            color: white; font-family: 'Syne', sans-serif;
            transition: opacity 0.15s;
            overflow: hidden;
        }
        .timeplan-block:hover { opacity: 0.85; }

        .date-duration-row {
            display: flex; gap: 12px; margin-botempty: 20px;
        }
        .date-duration-row .form-group {
            flex: 1; margin-botempty: 0;
        }
        /* Date-input samme stil som resten */
        input[type="date"] {
            width: 100%; padding: 10px 12px;
            border: 2px solid var(--color-border); border-radius: var(--rs);
            font-size: 0.95em; font-family: 'Nunito', sans-serif;
            transition: border-color 0.2s; background: var(--color-white);
        }
        input[type="date"]:focus {
            outline: none; border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
        }
        /* Timeplan med scrollbar */
        .schedule-wrapper {
            height: 280px;
            overflow-y: auto;
            border: 1px solid var(--color-border);
            border-radius: var(--rs);
            scroll-behavior: smooth;
        }
        .schedule-wrapper::-webkit-scrollbar { width: 6px; }
        .schedule-wrapper::-webkit-scrollbar-track { background: var(--color-primary-light); }
        .schedule-wrapper::-webkit-scrollbar-thumb { background: var(--color-primary-mid); border-radius: 3px; }

        button {
            padding: 10px 16px; border: none; border-radius: var(--rs);
            font-size: 0.95em; font-weight: 600; cursor: pointer;
            transition: all 0.2s; font-family: 'Syne', sans-serif;
        }
        .btn-primary { background: var(--color-primary); color: white; }
        .btn-primary:hover { background: var(--color-primary-dark); }
        .btn-secondary { background: var(--color-border); color: var(--color-text); }
        .btn-secondary:hover { background: var(--color-primary-mid); }
        .btn-danger { background: #f87171; color: white; }
        .btn-danger:hover { background: #dc2626; }

        .button-group { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
        .button-group button { flex: 1; min-width: 120px; }

        /* ── Resultater ── */
        .resultater-table { width: 100%; border-collapse: collapse; margin: 16px 0; overflow-x: auto; display: block; }
        .resultater-table th {
            background: var(--color-primary-light); padding: 12px; text-align: left;
            font-weight: 700; color: var(--color-primary-dark);
            border-bottom: 2px solid var(--color-border);
            font-family: 'Syne', sans-serif; font-size: 12px;
            white-space: nowrap;
        }
        .resultater-table td { padding: 12px; border-bottom: 1px solid var(--color-border); }
        .resultater-table tr:hover { background: var(--color-primary-light); }
        .vote-ja { color: #10b981; font-weight: 700; }
        .vote-nei { color: #f87171; font-weight: 700; }

        .share-box {
            background: var(--color-primary-light); padding: 16px;
            border-radius: var(--r); margin: 16px 0;
            border: 2px solid var(--color-primary-mid);
            display: flex; gap: 8px;
        }
        .share-box input { flex: 1; background: var(--color-white); border: 1px solid var(--color-border); }

        /* ── Participant ── */
        /* ── Blå tema current globalt ── */
        #participantPanel { background: var(--color-bg); min-height: 100vh; }

        #participantPanel .meeting-header {
            background: white;
            border: 1px solid var(--color-border);
            border-left: 4px solid var(--color-primary);
        }
        #participantPanel .meeting-header h2 { color: var(--color-primary); }
        #participantPanel .meeting-header p { color: var(--color-text-secondary); }

        #participantPanel .success-message {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
            border-radius: var(--rs);
            padding: 12px 16px;
            text-align: center;
            font-weight: 700;
            font-family: 'Syne', sans-serif;
        }

        #participantPanel .free-text-card {
            background: #fff5f5;
            border-color: #fecaca;
            border-left-color: #f87171;
        }
        #participantPanel .free-text-label { color: #991b1b; }
        #participantPanel .select-button {
            background: #ef4444;
            border-color: #ef4444;
            color: white;
        }
        #participantPanel .select-button:hover { background: #dc2626; border-color: #dc2626; }
        #participantPanel .select-button.selected { background: #ef4444; color: white; border-color: #ef4444; font-weight: 900; }

        .meeting-header {
            background: var(--color-white); padding: 24px;
            border-radius: var(--r); margin-botempty: 24px;
            border: 1px solid var(--color-border); border-left: 4px solid var(--color-primary);
        }
        .meeting-header h2 { color: var(--color-primary); margin-botempty: 8px; font-family: 'Syne', sans-serif; }
        .meeting-header p { color: var(--color-text-secondary); font-size: 0.95em; }

        .slot-card {
            background: var(--color-white); padding: 10px 14px;
            border-radius: var(--r); margin-botempty: 8px;
            border: 1px solid var(--color-border); border-left: 4px solid var(--color-primary);
        }
        .slot-row {
            display: flex; align-items: center;
            justify-content: space-between;
            margin-botempty: 8px;
        }
        .slot-text { font-weight: 700; color: var(--color-text); font-size: 0.95em; font-family: 'Syne', sans-serif; }
        .slot-votes { font-size: 0.85em; color: var(--color-text-secondary); white-space: nowrap; margin-left: 12px; }

        .vote-button-group { display: flex; gap: 6px; }
        .vote-knapp {
            flex: 1; padding: 7px 10px;
            border: 2px solid var(--color-border); background: var(--color-white);
            border-radius: var(--rs); cursor: pointer;
            font-weight: 700; transition: all 0.2s;
            font-size: 0.88em; font-family: 'Syne', sans-serif;
        }
        .vote-knapp { border-color: #6ee7b7; }
        .vote-knapp:hover { border-color: #6ee7b7; background: #d1fae5; color: #065f46; }
        .vote-knapp.selected-yes { background: #d1fae5; color: #065f46; border-color: #6ee7b7; }
        .vote-knapp.selected { background: var(--color-primary); color: white; border-color: var(--color-primary); }

        .success-message {
            background: var(--color-primary-light); color: var(--color-primary-dark);
            padding: 16px; border-radius: var(--rs);
            margin-top: 24px; text-align: center;
            font-weight: 700; border: 2px solid var(--color-primary);
        }

        .free-text-card {
            background: #fdf6ec; padding: 10px 14px;
            border-radius: var(--r); margin-botempty: 8px;
            border: 1px solid #f5d49a; border-left: 4px solid #e8a020;
        }
        .free-text-label {
            font-weight: 700; color: #7c4a00; font-size: 0.95em;
            font-family: 'Syne', sans-serif; margin-botempty: 8px;
        }
        .select-button {
            width: 100%; padding: 8px 12px;
            border: 2px solid #f5d49a; background: #fdf6ec;
            border-radius: var(--rs); cursor: pointer;
            font-weight: 700; transition: all 0.2s;
            font-size: 0.88em; font-family: 'Syne', sans-serif;
            color: #7c4a00;
        }
        .select-button:hover { border-color: #e8a020; background: #faebd0; }
        .select-button.selected { background: #e8a020; color: white; border-color: #e8a020; }

        .participant-results {
            margin-top: 28px;
            border-top: 2px solid var(--color-border);
            padding-top: 20px;
        }
        .participant-results-title {
            font-family: 'Syne', sans-serif; font-weight: 700;
            font-size: 13px; text-transform: uppercase;
            letter-spacing: 0.4px; color: var(--color-text-secondary);
            margin-botempty: 12px;
        }
        .resultat-rad {
            display: flex; align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: var(--color-white);
            border-radius: var(--rs);
            border: 1px solid var(--color-border);
            margin-botempty: 6px;
            font-size: 0.88em;
        }
        .resultat-slot { color: var(--color-text); font-weight: 600; }
        .resultat-tall { color: var(--color-text-secondary); }

        @media (max-width: 768px) {
            .button-group { flex-direction: column; }
            .button-group button { width: 100%; }
        }

        .back-button {
            display: flex;
            align-items: center;
            gap: 8px;
            background: none;
            border: none;
            color: var(--color-primary);
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 14px;
            padding: 0 0 16px 0;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            /* ── Admin: én panel om gangen ── */
            #detaljSection { display: none !important; }
            #detaljSection.vis-mobil { display: block !important; }
            #møteKort { display: block; }
            #møteKort.skjult-mobil { display: none; }

            /* ── Timeplan: større touchmål ── */
            .schedule-slot { height: 32px; }
            .schedule-slot.full-hour { border-bottom: 2px solid var(--color-primary-mid); }
            .schedule-slot.dotted { border-bottom: 1px dashed rgba(59,130,246,0.2); }
            .schedule-wrapper { height: 320px; }
            .timeplan-time-label { font-size: 12px; padding: 6px; width: 44px; min-width: 44px; }

            /* ── Participant: mer luft ── */
            .slot-card { padding: 14px 16px; margin-botempty: 12px; }
            .slot-row { margin-botempty: 12px; }
            .vote-knapp { padding: 12px; font-size: 0.95em; }
            .participant-container { padding: 0 4px; }

            main { padding: 12px 8px 80px; }
        }
    </style>
</head>
<body>

    <!-- Login Overlay (skjules for deltakere og innloggede admins) -->
    <div id="loginOverlay">
        <svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
            <defs><clipPath id="licp"><circle cx="46" cy="36" r="18"/></clipPath></defs>
            <rect width="72" height="72" rx="18" fill="white" stroke="#e0e0e0" stroke-width="1"/>
            <circle cx="26" cy="36" r="18" fill="#9490d4"/>
            <circle cx="46" cy="36" r="18" fill="#b4e8a8"/>
            <circle cx="26" cy="36" r="18" fill="#2e2b45" clip-path="url(#licp)"/>
            <circle cx="26" cy="36" r="18" fill="none" stroke="#6860b0" stroke-width="1"/>
            <circle cx="46" cy="36" r="18" fill="none" stroke="#6ca060" stroke-width="1"/>
        </svg>
        <div style="text-align:center;">
            <div style="font-family:'Syne',sans-serif;font-weight:800;font-size:20px;color:var(--color-text);">Schedule</div>
            <div style="font-family:'Nunito',sans-serif;font-size:13px;color:var(--color-text-secondary);margin-top:4px;">Log in to organize meetings</div>
            <div style="font-family:'Nunito',sans-serif;font-size:11px;color:var(--color-primary-mid);margin-top:8px;">v1.67</div>
        </div>
        <button onclick="signIn()">
            <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#fff" d="M44.5 20H24v8.5h11.8C34.7 33.9 30.1 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 4.1 29.6 2 24 2 11.8 2 2 11.8 2 24s9.8 22 22 22c11 0 21-8 21-22 0-1.3-.2-2.7-.5-4z"/></svg>
            Sign in with Google
        </button>
    </div>

    <!-- Header (kun synlig for admin) -->
    <header id="appHeader">
        <div class="logo">Schedule <span style="font-size:11px;font-weight:400;color:var(--color-text-secondary);margin-left:4px;">v1.67</span></div>
        <div class="header-actions">
            <div>
                <div class="user-name" id="brukerNavn"></div>
                <div class="user-rolle">Admin</div>
            </div>
            <button class="header-button" onclick="logout()" title="Log out" style="font-size:14px;">⏏</button>
        </div>
    </header>

    <!-- Admin Panel -->
    <div id="adminPanel" class="panel">
        <main>
            <div class="admin-top-row">
                <div class="card-title">Your meetings</div>
                <button class="add-button" onclick="createNewMeeting()">+ New meeting</button>
            </div>
            <div class="admin-grid">
                <div class="card" id="møteKort">
                    <div class="meeting-list" id="møteListe"></div>
                </div>

                <div id="detaljSection">
                    <div class="card">
                        <div class="card-header">
                            <div class="card-title" id="detaljTitle"></div>
                        </div>
                        <div class="card-body" id="detaljInnhold"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Participant Panel -->
    <div id="participantPanel" class="panel">
        <main>
            <div class="participant-container">
                <!-- Møte-header vises alltid, tittel fylles inn fra JS -->
                <div class="meeting-header" id="møteHeader" style="margin-botempty:16px;display:none;">
                    <div style="display:flex;justify-content:space-between;align-items:flex-start;">
                        <div style="flex:1;">
                            <h2 id="deltakerMøteTitle" style="color:var(--color-primary);font-family:'Syne',sans-serif;font-weight:700;font-size:1.3em;margin-botempty:4px;"></h2>
                            <p id="participantMeetingDesc" style="color:var(--color-text-secondary);font-size:0.95em;"></p>
                        </div>
                        <div style="font-family:'Nunito',sans-serif;font-size:12px;color:var(--color-text-secondary);text-align:right;white-space:nowrap;margin-left:16px;margin-top:2px;">By Eirik Sørbø</div>
                    </div>
                </div>

                <!-- Navnefelt -->
                <div class="card" id="navneKort" style="margin-botempty:12px;">
                    <div class="card-body" style="padding:12px 16px;">
                        <div style="flex:1;">
                            <label style="margin-botempty:4px;">Your name</label>
                            <input type="text" id="participantNameInput" placeholder="Enter your name here..." oninput="updateName()" style="padding:8px 12px;">
                        </div>
                    </div>
                </div>

                <div id="deltakerTimesContainer"></div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
            from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
        import { getFirestore, collection, doc, setDoc, getDoc, deleteDoc, onSnapshot, query, where }
            from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDvR6Jlt9j7ECudDhF1VtPPr2G3gcEqXCA",
            authDomain: "scheduler-2be23.firebaseapp.com",
            projectId: "scheduler-2be23",
            storageBucket: "scheduler-2be23.firebasestorage.app",
            messagingSenderId: "547633808881",
            appId: "1:547633808881:web:e761037ef250b715e07050"
        };

        const app  = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db   = getFirestore(app);

        // ── State ──
        let currentUser  = null;
        let currentMeetingId = null;
        let meetings        = {};
        let editMode = false;
        let unsubscribeListener = null; // for å rydde opp onSnapshot-lytter

        // ── Sjekk URL umiddelbart ──
        const urlParams     = new URLSearchParams(window.location.search);
        const meetingIdFromUrl  = urlParams.get('meeting');
        const erParticipant    = !!meetingIdFromUrl;

        if (erParticipant) {
            // Participant mode: hide login overlay, show participant panel
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('participantPanel').classList.add('active');
            lastParticipantPanel(meetingIdFromUrl);
        }

        // ── Auth ──
        const ADMIN_EMAIL = 'eirik.sorbo@gmail.com'; // Kun denne brukeren får logge inn

        window.signIn = async () => {
            try {
                const result = await signInWithPopup(auth, new GoogleAuthProvider());
                if (result.user.email !== ADMIN_EMAIL) {
                    await signOut(auth);
                    alert('This app is for the organizer only.');
                }
            } catch(e) {
                alert('Sign-in failed: ' + e.message);
            }
        };

        window.logout = async () => { await signOut(auth); };

        onAuthStateChanged(auth, async user => {
            if (erParticipant) return; // don't interfere with participant mode

            if (user && user.email === ADMIN_EMAIL) {
                currentUser = user;
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('appHeader').style.display = 'flex';
                document.getElementById('adminPanel').classList.add('active');
                document.getElementById('brukerNavn').textContent = user.displayName || user.email;

                // Unsubscribe gammel lytter hvis den finnes
                if (unsubscribeListener) unsubscribeListener();

                const q = query(collection(db, 'schedule_moter'), where('uid', '==', user.uid));
                unsubscribeListener = onSnapshot(q, snapshot => {
                    snapshot.forEach(d => {
                        const _r = d.data();
                        meetings[d.id] = {..._r, slots: _r.tider||[], votes: _r.stemmer||{}};
                    });
                    // Fjern meetings som er slettet fra Firestore
                    const firebaseIds = snapshot.docs.map(d => d.id);
                    Object.keys(meetings).forEach(id => {
                        if (!id.startsWith('ny_') && !firebaseIds.includes(id)) {
                            delete meetings[id];
                        }
                    });
                    renderMeetingList();
                    // Oppdater åpent meeting live hvis det er i visning (ikke redigering)
                    if (currentMeetingId && !currentMeetingId.startsWith('ny_') && !editMode) {
                        renderMeetingDetails(currentMeetingId);
                    } else if (!currentMeetingId) {
                        // Vis nyeste meeting som default
                        const ids = Object.keys(meetings).filter(id => !id.startsWith('ny_'));
                        if (ids.length > 0) {
                            const latestId = ids.sort((a, b) => Number(b) - Number(a))[0];
                            currentMeetingId = latestId;
                            renderMeetingList();
                            renderMeetingDetails(latestId);
                            if (isMobile()) showMobileDetail();
                        }
                    }
                });
            } else {
                currentUser = null;
                if (unsubscribeListener) { unsubscribeListener(); unsubscribeListener = null; }
                document.getElementById('loginOverlay').style.display = 'flex';
                document.getElementById('appHeader').style.display = 'none';
                document.getElementById('adminPanel').classList.remove('active');
                meetings = {};
            }
        });

        // ── Admin: Møteliste ──
        function renderMeetingList() {
            const list = document.getElementById('møteListe');
            const ids = Object.keys(meetings).filter(id => !id.startsWith('ny_'));

            if (ids.length === 0) {
                list.innerHTML = '<div class="empty-message">No meetings in progress</div>';
                if (!currentMeetingId?.startsWith('ny_')) {
                    document.getElementById('detaljSection').classList.remove('vis');
                }
                return;
            }

            list.innerHTML = ids.map(id => {
                const m = meetings[id];
                const active = currentMeetingId === id ? 'active' : '';
                const antall = Object.keys(m.votes || {}).length;
                return `<div class="meeting-item ${active}" onclick="selectMeeting('${id}')">
                    <div class="meeting-title">${m.tittel}</div>
                    <div class="meeting-meta">${m.slots.length} ${m.heldagshendelse ? 'days' : 'times'} · ${antall} participant(s)</div>
                </div>`;
            }).join('');
        }

        const isMobile = () => window.innerWidth <= 600;

        window.selectMeeting = id => {
            currentMeetingId = id;
            editMode = false;
            renderMeetingList();
            renderMeetingDetails(id);
            if (isMobile()) showMobileDetail();
        };

        function showMobileDetail() {
            document.getElementById('møteKort').classList.add('skjult-mobil');
            document.getElementById('detaljSection').classList.add('vis-mobil');
        }

        function showMobileList() {
            document.getElementById('møteKort').classList.remove('skjult-mobil');
            document.getElementById('detaljSection').classList.remove('vis-mobil');
        }

        window.mobileBack = () => {
            currentMeetingId = null;
            editMode = false;
            document.getElementById('detaljSection').classList.remove('vis');
            renderMeetingList();
            showMobileList();
        };

        // ── Admin: New meeting ──
        window.createNewMeeting = () => {
            currentMeetingId = 'ny_' + Date.now();
            editMode = true;
            meetings[currentMeetingId] = { tittel: '', beskrivelse: '', varighet: 60, slots: [], votes: {} };
            renderMeetingList();
            showForm(currentMeetingId);
            if (isMobile()) showMobileDetail();
        };

        // ── Admin: Vis møtedetaljer (lesemodus) ──
        function renderMeetingDetails(meetingId) {
            const meeting = meetings[meetingId];
            if (!meeting) return;

            document.getElementById('detaljTitle').textContent = meeting.tittel;
            document.getElementById('detaljSection').classList.add('vis');

            const link = window.location.origin + window.location.pathname + '?møte=' + meetingId;

            const votes = meeting.votes || {};
            const deltakere = Object.keys(votes);
            const antallParticipante = deltakere.length;

            // Grupper times per dato
            const dateGroups = {};
            meeting.slots.forEach(slot => {
                const dato = meeting.heldagshendelse
                    ? new Date(slot + 'T00:00:00').toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' })
                    : new Date(slot).toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
                if (!dateGroups[dato]) dateGroups[dato] = [];
                dateGroups[dato].push(slot);
            });

            // Tell ja per slot
            const availablePerSlot = {};
            meeting.slots.forEach(slot => {
                availablePerSlot[slot] = deltakere.filter(n => votes[n]?.[slot] === 'ja').length;
            });
            const maxAvailable = Math.max(...Object.values(availablePerSlot), 0);
            const alleAvailableTimes = meeting.slots.filter(t => availablePerSlot[t] === antallParticipante && antallParticipante > 0);

            function slotColor(slot) {
                if (antallParticipante === 0) return 'var(--color-primary-light)';
                const ja = availablePerSlot[slot] || 0;
                if (ja === antallParticipante) return '#d1fae5';
                if (ja === maxAvailable && ja > 0) return '#fef3c7';
                return 'var(--color-primary-light)';
            }

            // Analysetekst
            let summaryText = '';
            if (antallParticipante === 0) {
                summaryText = '<p style="color:var(--color-text-secondary);font-size:0.9em;margin-botempty:8px;">No responses yet.</p>';
            } else if (alleAvailableTimes.length > 0) {
                const timeTexts = alleAvailableTimes.map(t => {
                    if (meeting.heldagshendelse) {
                        return new Date(t + 'T00:00:00').toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
                    }
                    const s = new Date(t), e = new Date(s.getTime() + (meeting.varighet||60)*60000);
                    const fmt = d => d.toLocaleString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false});
                    return s.toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short'}) + ' ' + fmt(s) + '–' + fmt(e);
                }).join(', ');
                summaryText = `<div style="background:#d1fae5;border:1px solid #6ee7b7;border-radius:var(--rs);padding:10px 14px;margin-botempty:12px;font-size:0.9em;"><strong>Everyone available:</strong><br>${timeTexts.split(', ').join('<br>')}</div>`;
            } else if (maxAvailable > 0) {
                const besteTimes = meeting.slots.filter(t => availablePerSlot[t] === maxAvailable);
                const bestTexts = besteTimes.map(t => {
                    const ikkeAvailableDenne = deltakere.filter(n => votes[n]?.[t] !== 'ja');
                    const parenthetical = ikkeAvailableDenne.length ? ` (${ikkeAvailableDenne.join(', ')} can't)` : '';
                    if (meeting.heldagshendelse) {
                        return new Date(t + 'T00:00:00').toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' }) + parenthetical;
                    }
                    const s = new Date(t), e = new Date(s.getTime() + (meeting.varighet||60)*60000);
                    const fmt = d => d.toLocaleString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false});
                    return s.toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short'}) + ' ' + fmt(s) + '–' + fmt(e) + parenthetical;
                }).join('<br>');
                summaryText = `<div style="background:#fef3c7;border:1px solid #fbbf24;border-radius:var(--rs);padding:10px 14px;margin-botempty:12px;font-size:0.9em;"><strong>Most available (${maxAvailable}/${antallParticipante}):</strong><br>${bestTexts}</div>`;
            }

            // Tabell
            let table = '';
            if (antallParticipante === 0) {
                table = '<p style="color:var(--color-text-secondary);margin-top:8px;">No responses yet.</p>';
            } else {
                table = summaryText + '<div style="overflow-x:auto;">';

                if (meeting.heldagshendelse) {
                    // Heldagshendelse: én table, én kolonne per dag
                    table += '<table class="resultater-table" style="margin-top:0;margin-botempty:12px;"><thead><tr><th style="min-width:80px;">Participant</th>';
                    meeting.slots.forEach(slot => {
                        const dato = new Date(slot + 'T00:00:00').toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
                        table += `<th style="text-align:center;background:${slotColor(slot)};padding:6px 8px;font-size:12px;">${dato}</th>`;
                    });
                    table += '</tr></thead><tbody>';
                    deltakere.forEach(name => {
                        table += `<tr><td><strong>${name}</strong></td>`;
                        meeting.slots.forEach(slot => {
                            const v = votes[name]?.[slot] || '–';
                            table += `<td style="text-align:center;background:${slotColor(slot)};padding:6px 8px;" class="${v==='ja'?'vote-ja':''}">${v==='ja'?'✓':'<span style="color:#f87171;">✗</span>'}</td>`;
                        });
                        table += '</tr>';
                    });
                    table += '</tbody></table>';
                } else {
                    // Tidspunkter: gruppert per dato
                    Object.entries(dateGroups).forEach(([dato, timesIDate]) => {
                        table += `<div style="font-family:'Syne',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--color-text-secondary);padding:10px 0 4px;">${dato}</div>`;
                        table += '<table class="resultater-table" style="margin-top:0;margin-botempty:12px;"><thead><tr><th style="min-width:80px;">Participant</th>';
                        timesIDate.forEach(slot => {
                            const s = new Date(slot), e = new Date(s.getTime() + (meeting.varighet||60)*60000);
                            const fmt = d => d.toLocaleString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false});
                            table += `<th style="text-align:center;background:${slotColor(slot)};padding:6px 10px;">${fmt(s)}<br><span style="font-weight:400;font-size:10px;opacity:0.7;">–${fmt(e)}</span></th>`;
                        });
                        table += '</tr></thead><tbody>';
                        deltakere.forEach(name => {
                            table += `<tr><td><strong>${name}</strong></td>`;
                            timesIDate.forEach(slot => {
                                const v = votes[name]?.[slot] || '–';
                                table += `<td style="text-align:center;background:${slotColor(slot)};padding:6px 10px;" class="${v==='ja'?'vote-ja':''}">${v==='ja'?'✓':'<span style="color:#f87171;">✗</span>'}</td>`;
                            });
                            table += '</tr>';
                        });
                        table += '</tbody></table>';
                    });
                }

                table += '</div>';

                // Free text option resultater
                if (meeting.fritekstAlternativ) {
                    const selected = deltakere.filter(n => votes[n]?.fritekst_valg === 'selected');
                    table += `<div style="margin-top:12px;">
                        <div style="font-family:'Syne',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--color-text-secondary);padding:4px 0 8px;">Free text option</div>
                        <div style="background:var(--color-primary-light);border:1px solid var(--color-border);border-radius:var(--rs);padding:10px 14px;">
                            <div style="font-weight:700;margin-botempty:6px;">${meeting.fritekstAlternativ}</div>
                            <div style="font-size:0.88em;color:var(--color-text-secondary);">
                                ${selected.length === 0 ? 'No one has selected this' : selected.length + ' have selected this: ' + selected.join(', ')}
                            </div>
                        </div>
                    </div>`;
                }
            }

            document.getElementById('detaljInnhold').innerHTML = `
                <button class="back-button" onclick="mobileBack()">← Back</button>
                <div class="form-group">
                    <label>Responses</label>
                    ${table}
                </div>
                <div class="form-group">
                    <label>Meeting link</label>
                    <div class="share-box">
                        <input type="text" value="${link}" readonly>
                        <button class="btn-primary" onclick="copyLink('${link}')">Copy</button>
                    </div>
                </div>
                ${meeting.heldagshendelse ? '' : `
                <div class="form-group">
                    <label>Duration</label>
                    <div style="padding:8px;background:var(--color-primary-light);border-radius:6px;">${durationText(meeting.varighet)}</div>
                </div>`}
                <div class="form-group">
                    <label>${meeting.heldagshendelse ? 'Days' : 'Times'}</label>
                    ${meeting.slots.map(slot => {
                        if (meeting.heldagshendelse) {
                            const dato = new Date(slot + 'T00:00:00').toLocaleDateString('en-GB', { weekday:'short', year:'numeric', month:'short', day:'numeric' });
                            return `<div style="padding:8px;background:var(--color-primary-light);border-radius:6px;margin-botempty:8px;">${dato}</div>`;
                        }
                        const start = new Date(slot);
                        const end = new Date(start.getTime() + (meeting.varighet||60) * 60000);
                        const fmt = d => d.toLocaleString('en-GB', { hour:'2-digit', minute:'2-digit' ,hour12:false});
                        const dag = start.toLocaleString('en-GB', { year:'numeric', month:'short', day:'numeric' });
                        return `<div style="padding:8px;background:var(--color-primary-light);border-radius:6px;margin-botempty:8px;">${dag}, ${fmt(start)}–${fmt(end)}</div>`;
                    }).join('')}
                </div>
                <div class="button-group">
                    <button class="btn-secondary" onclick="editMeeting('${meetingId}')">Edit</button>
                    <button class="btn-danger" onclick="deleteMeeting('${meetingId}')">Delete</button>
                </div>`;
        }

        // ── Admin: Vis redigeringsskjema ──
        let timeplanDate = new Date();
        timeplanDate.setHours(0,0,0,0);

        function showForm(meetingId) {
            const meeting = meetings[meetingId];
            const isNew = meetingId.startsWith('ny_');
            const isAllDay = meeting.heldagshendelse || false;

            document.getElementById('detaljTitle').textContent = isNew ? 'New meeting' : 'Edit meeting';
            document.getElementById('detaljSection').classList.add('vis');

            if (meeting.slots && meeting.slots.length > 0 && meeting.slots[0] && !isAllDay) {
                timeplanDate = new Date(meeting.slots[0]);
                timeplanDate.setHours(0,0,0,0);
            } else {
                timeplanDate = new Date();
                timeplanDate.setHours(0,0,0,0);
            }

            const durationOptions = [15,30,45,60,90,120,180].map(v => {
                const label = v < 60 ? v+' min' : v===60 ? '1 hour' : v===90 ? '1.5 hours' : (v/60)+' timer';
                return `<option value="${v}" ${(meeting.varighet||60)===v?'selected':''}>${label}</option>`;
            }).join('');

            document.getElementById('detaljInnhold').innerHTML = `
                <button class="back-button" onclick="mobileBack()">← Back</button>
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="editTitle" placeholder="E.g. Team meeting" value="${meeting.tittel || ''}">
                </div>
                <div class="form-group">
                    <label>Description (optional)</label>
                    <textarea id="editDescription" placeholder="A few words about the meeting...">${meeting.beskrivelse || ''}</textarea>
                </div>
                <div class="type-toggle">
                    <button id="toggleTime" class="${!isAllDay?'active':''}" onclick="toggleEventType(false)">🕐 Time slots</button>
                    <button id="toggleHeldag" class="${isAllDay?'active':''}" onclick="toggleEventType(true)">📅 All-day event</button>
                </div>
                <div id="tidspunktSeksjon" style="${isAllDay?'display:none':''}">
                    <div class="date-duration-row">
                        <div class="form-group">
                            <label>Date</label>
                            <input type="date" id="editDate" value="${dateToString(timeplanDate)}" onchange="changeDate(this.value)">
                        </div>
                        <div class="form-group">
                            <label>Duration per meeting</label>
                            <select id="editDuration" onchange="updateSchedule()" style="width:100%;padding:10px 12px;border:2px solid var(--color-border);border-radius:var(--rs);font-size:0.95em;font-family:'Nunito',sans-serif;">${durationOptions}</select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Select time slots <span style="font-weight:400;color:var(--color-text-secondary);">— click in the schedule</span></label>
                        <div class="schedule-nav">
                            <button class="schedule-nav-btn" onclick="changeScheduleDay(-1)">←</button>
                            <div class="schedule-date-label" id="timeplanDateLabel"></div>
                            <button class="schedule-nav-btn" onclick="changeScheduleDay(1)">→</button>
                        </div>
                        <div class="schedule-wrapper" id="timeplanWrapper">
                            <div class="schedule-grid" id="timeplanGrid"></div>
                        </div>
                    </div>
                </div>
                <div id="heldagSeksjon" style="${!isAllDay?'display:none':''}">
                    <div class="form-group">
                        <label>Velg days <span style="font-weight:400;color:var(--color-text-secondary);">— klikk på days</span></label>
                        <div class="month-nav">
                            <button class="schedule-nav-btn" onclick="changeMonth(-1)">←</button>
                            <div class="month-label" id="maanedLabel"></div>
                            <button class="schedule-nav-btn" onclick="changeMonth(1)">→</button>
                        </div>
                        <div class="month-grid" id="maanedGrid"></div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Free text option <span style="font-weight:400;color:var(--color-text-secondary);">— optional</span></label>
                    <input type="text" id="editFreeText" placeholder="E.g. "None of these work for me"" value="${meeting.fritekstAlternativ || ''}">
                    <div style="font-size:12px;color:var(--color-text-secondary);margin-top:4px;">Shown at the botempty for participants with a "Select this" button.</div>
                </div>
                <div class="button-group">
                    <button class="btn-primary" onclick="saveMeeting()">Save</button>
                    <button class="btn-secondary" onclick="cancelEdit()">Cancel</button>
                </div>`;

            const varighetEl = document.getElementById('editDuration');
            if (varighetEl) varighetEl.value = meeting.varighet || 60;

            if (isAllDay) {
                updateMonthCalendar();
            } else {
                updateSchedule();
            }
        }

        function dateToString(dato) {
            const y = dato.getFullYear();
            const m = String(dato.getMonth()+1).padStart(2,'0');
            const d = String(dato.getDate()).padStart(2,'0');
            return `${y}-${m}-${d}`;
        }

        let maanedDate = new Date();

        window.toggleEventType = (isAllDay) => {
            const meeting = meetings[currentMeetingId];
            if (!meeting) return;
            meeting.heldagshendelse = isAllDay;
            meeting.slots = [];
            document.getElementById('toggleTime').classList.toggle('active', !isAllDay);
            document.getElementById('toggleHeldag').classList.toggle('active', isAllDay);
            document.getElementById('tidspunktSeksjon').style.display = isAllDay ? 'none' : '';
            document.getElementById('heldagSeksjon').style.display = isAllDay ? '' : 'none';
            if (isAllDay) updateMonthCalendar();
            else updateSchedule();
        };

        window.changeMonth = (direction) => {
            maanedDate.setMonth(maanedDate.getMonth() + direction);
            updateMonthCalendar();
        };

        function updateMonthCalendar() {
            const grid = document.getElementById('maanedGrid');
            const label = document.getElementById('maanedLabel');
            if (!grid || !label) return;

            const meeting = meetings[currentMeetingId];
            const selectedDates = new Set(meeting?.slots || []);

            const år = maanedDate.getFullYear();
            const mnd = maanedDate.getMonth();
            const iDag = new Date(); iDag.setHours(0,0,0,0);

            label.textContent = maanedDate.toLocaleDateString('en-GB', { month:'long', year:'numeric' });

            const dagNavn = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
            let html = dagNavn.map(d => `<div class="month-day-header">${d}</div>`).join('');

            const førsteDag = new Date(år, mnd, 1);
            // Norwegian: Monday = 0 (ISO week)
            let startOffset = (førsteDag.getDay() + 6) % 7;
            for (let i = 0; i < startOffset; i++) {
                html += `<div class="month-day empty"></div>`;
            }

            const daysIMnd = new Date(år, mnd + 1, 0).getDate();
            for (let dag = 1; dag <= daysIMnd; dag++) {
                const dato = new Date(år, mnd, dag);
                const dateStr = dateToString(dato);
                const isSelected = selectedDates.has(dateStr);
                const isToday = dato.getTime() === iDag.getTime();
                const isPast = dato < iDag;
                let klasse = 'month-day';
                if (isSelected) klasse += ' selected';
                else if (isPast) klasse += ' past';
                else if (isToday) klasse += ' today';
                html += `<div class="${klasse}" onclick="toggleDay('${dateStr}')">${dag}</div>`;
            }

            grid.innerHTML = html;
        }

        window.toggleDay = (dateStr) => {
            const meeting = meetings[currentMeetingId];
            if (!meeting) return;
            const idx = meeting.slots.indexOf(dateStr);
            if (idx >= 0) meeting.slots.splice(idx, 1);
            else { meeting.slots.push(dateStr); meeting.slots.sort(); }
            updateMonthCalendar();
        };

        window.changeDate = (value) => {
            timeplanDate = new Date(value + 'T00:00:00');
            updateSchedule();
        };

        window.changeScheduleDay = (direction) => {
            timeplanDate.setDate(timeplanDate.getDate() + direction);
            document.getElementById('editDate').value = dateToString(timeplanDate);
            updateSchedule();
        };

        window.updateSchedule = () => {
            const varighet = parseInt(document.getElementById('editDuration')?.value || 60);
            const slotMinutes = 15;
            const startTime = 7 * 60;  // 07:00
            const endTime = 21 * 60; // 21:00
            const slotCount = (endTime - startTime) / slotMinutes;
            const slotHeight = isMobile() ? 32 : 18;
            const blockHeight = (varighet / slotMinutes) * slotHeight;

            const dateLabel = timeplanDate.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' });
            const labelEl = document.getElementById('timeplanDateLabel');
            if (labelEl) labelEl.textContent = dateLabel.charAt(0).toUpperCase() + dateLabel.slice(1);

            const meeting = meetings[currentMeetingId];
            const times = meeting?.slots || [];

            // Find selected slots for this day
            const dateStr = dateToString(timeplanDate);
            const selectedOnThisDay = times.filter(t => t.startsWith(dateStr));

            let html = '';
            for (let i = 0; i < slotCount; i++) {
                const minutter = startTime + i * slotMinutes;
                const time = Math.floor(minutter / 60);
                const min = minutter % 60;
                const tidStr = `${String(time).padStart(2,'0')}:${String(min).padStart(2,'0')}`;
                const iso = `${dateStr}T${tidStr}`;
                const isFullHour = min === 45;
                const isHalfHour = min === 15;
                const isDotted = min === 0 || min === 30;
                const visLabel = min === 0 || min === 30;
                const slotKlasse = isFullHour ? 'full-hour' : isDotted ? 'dotted' : 'half-hour';
                const visLabelStr = visLabel ? tidStr : '';

                html += `<div class="schedule-slot ${slotKlasse}" onclick="toggleTime('${iso}')">
                    <div class="timeplan-time-label">${visLabelStr}</div>
                    <div class="schedule-content"></div>
                </div>`;
            }

            const grid = document.getElementById('timeplanGrid');
            if (!grid) return;

            // Bevar scroll-posisjon
            const wrapper = document.getElementById('timeplanWrapper');
            const prevScrollPos = wrapper ? wrapper.scrollTop : null;

            grid.innerHTML = html;

            // Scroll til 08:00 kun firstDate gang (når scrollPos er 0 eller null)
            if (wrapper) {
                const eightOclock = 4 * slotHeight;
                wrapper.scrollTop = (prevScrollPos && prevScrollPos > 0) ? prevScrollPos : eightOclock;
            }

            // Tegn blokker for selected times
            selectedOnThisDay.forEach(slot => {
                const timePart = slot.split('T')[1];
                if (!timePart) return;
                const [h, m] = timePart.split(':').map(Number);
                const minutesFromStart = (h * 60 + m) - startTime;
                const slotIndex = minutesFromStart / slotMinutes;
                const topPx = slotIndex * slotHeight;

                const block = document.createElement('div');
                block.className = 'timeplan-block';
                block.style.height = (blockHeight - 2) + 'px';
                block.style.zIndex = '10';
                block.textContent = timePart.slice(0,5);
                block.onclick = (e) => { e.stopPropagation(); toggleTime(slot); };

                const contentCells = grid.querySelectorAll('.schedule-content');
                if (contentCells[slotIndex]) {
                    const cell = contentCells[slotIndex];
                    cell.style.position = 'relative';
                    cell.style.overflow = 'visible';
                    cell.style.zIndex = '5';
                    block.style.top = '0';
                    block.style.position = 'absolute';
                    block.style.left = '4px';
                    block.style.right = '4px';
                    cell.appendChild(block);
                }
            });
        };

        window.toggleTime = (iso) => {
            const meeting = meetings[currentMeetingId];
            if (!meeting) return;
            if (!meeting.slots) meeting.slots = [];
            const idx = meeting.slots.indexOf(iso);
            if (idx >= 0) {
                meeting.slots.splice(idx, 1);
            } else {
                meeting.slots.push(iso);
                meeting.slots.sort();
            }
            updateSchedule();
        };

        window.editMeeting = id => {
            currentMeetingId = id;
            editMode = true;
            showForm(id);
        };

        window.saveMeeting = async () => {
            const meeting = meetings[currentMeetingId];
            meeting.tittel = document.getElementById('editTitle').value.trim();
            meeting.beskrivelse = document.getElementById('editDescription').value.trim();
            meeting.varighet = parseInt(document.getElementById('editDuration')?.value || 60);
            meeting.heldagshendelse = meeting.heldagshendelse || false;
            meeting.fritekstAlternativ = document.getElementById('editFreeText')?.value.trim() || '';
            meeting.slots = meeting.slots.filter(t => t);

            if (!meeting.tittel || meeting.slots.length === 0) {
                alert('Please enter a title and at least one time');
                return;
            }

            const isNew  = currentMeetingId.startsWith('ny_');
            const nyId  = isNew ? Date.now().toString() : currentMeetingId;
            meeting.uid    = currentUser.uid;
            if (!meeting.votes) meeting.votes = {};

            try {
                const _save = {tittel:meeting.tittel,beskrivelse:meeting.beskrivelse,uid:meeting.uid,varighet:meeting.varighet,heldagshendelse:meeting.heldagshendelse,fritekstAlternativ:meeting.fritekstAlternativ,tider:meeting.slots||[],stemmer:meeting.votes||{}};
                await setDoc(doc(db, 'schedule_moter', nyId), _save);
                if (isNew) {
                    delete meetings[currentMeetingId];
                    meetings[nyId] = meeting;
                    currentMeetingId = nyId;
                }
                editMode = false;
                renderMeetingList();
                renderMeetingDetails(currentMeetingId);
            } catch(e) { alert('Error saving: ' + e.message); }
        };

        window.cancelEdit = () => {
            if (currentMeetingId?.startsWith('ny_')) {
                delete meetings[currentMeetingId];
                currentMeetingId = null;
                document.getElementById('detaljSection').classList.remove('vis');
                if (isMobile()) showMobileList();
            } else {
                editMode = false;
                renderMeetingDetails(currentMeetingId);
            }
            renderMeetingList();
        };

        window.deleteMeeting = async id => {
            if (!confirm('Delete dette møtet?')) return;
            try {
                await deleteDoc(doc(db, 'schedule_moter', id));
                delete meetings[id];
                currentMeetingId = null;
                editMode = false;
                renderMeetingList();
                document.getElementById('detaljSection').classList.remove('vis');
                if (isMobile()) showMobileList();
            } catch(e) { alert('Error deleting: ' + e.message); }
        };

        window.copyLink = link => {
            navigator.clipboard.writeText(link);
            const knapp = document.querySelector('.share-box button');
            if (knapp) {
                knapp.textContent = 'Copyt!';
                knapp.style.background = 'var(--color-primary-dark)';
                setTimeout(() => {
                    knapp.textContent = 'Copy';
                    knapp.style.background = '';
                }, 2000);
            }
        };

        function durationText(min) {
            if (!min) return '1 hour';
            if (min < 60) return min + ' minutter';
            if (min === 60) return '1 hour';
            if (min % 60 === 0) return (min / 60) + ' timer';
            return Math.floor(min/60) + ',' + (min%60/60*10) + ' time';
        }

        // ── Participant: Last panel ──
        async function lastParticipantPanel(meetingId) {
            participantMonthSet = false;
            document.getElementById('deltakerTimesContainer').innerHTML = '';

            try {
                const snap = await getDoc(doc(db, 'schedule_moter', meetingId));
                if (!snap.exists()) {
                    document.getElementById('deltakerMøteTitle').textContent = 'Meeting not found';
                    return;
                }
                const _raw = snap.data();
                const meeting = {..._raw, slots: _raw.tider||[], votes: _raw.stemmer||{}};
                document.getElementById('deltakerMøteTitle').textContent = meeting.tittel || '';
                document.getElementById('participantMeetingDesc').textContent = meeting.beskrivelse || '';

                const savedName = localStorage.getItem('participant_name_' + meetingId);
                if (savedName) document.getElementById('participantNameInput').value = savedName;

                renderParticipantTimes(meetingId, meeting);
            } catch(e) {
                document.getElementById('deltakerMøteTitle').textContent = 'Failed to load';
                console.error(e);
            }
        }

        // Oppdater name fra felt (debounced - venter 400ms etter siste tastetrykk)
        let nameDebounce = null;
        window.updateName = () => {
            clearTimeout(nameDebounce);
            nameDebounce = setTimeout(() => {
                const name = document.getElementById('participantNameInput').value.trim();
                const inp  = document.getElementById('participantNameInput');
                if (name) {
                    // Sjekk om name er tatt (uten å låse — bare vis advarsel)
                    getDoc(doc(db, 'schedule_moter', meetingIdFromUrl)).then(snap => {
                        if (!snap.exists()) return;
                        const _raw = snap.data();
                const meeting = {..._raw, slots: _raw.tider||[], votes: _raw.stemmer||{}};
                        const existing = Object.keys(meeting.votes || {});
                        const lagret = localStorage.getItem('participant_name_' + meetingIdFromUrl);
                        if (existing.includes(name) && lagret !== name) {
                            inp.style.borderColor = '#f87171';
                            inp.title = 'This name is already taken — please choose another';
                        } else {
                            inp.style.borderColor = '';
                            inp.title = '';
                            localStorage.setItem('participant_name_' + meetingIdFromUrl, name);
                            renderParticipantTimes(meetingIdFromUrl, meeting);
                        }
                    });
                } else {
                    inp.style.borderColor = '';
                    localStorage.removeItem('participant_name_' + meetingIdFromUrl);
                    getDoc(doc(db, 'schedule_moter', meetingIdFromUrl)).then(snap => {
                        if (snap.exists()) renderParticipantTimes(meetingIdFromUrl, snap.data());
                    });
                }
            }, 400);
        };

        function renderParticipantTimes(meetingId, meeting) {
            const name    = localStorage.getItem('participant_name_' + meetingId) || null;
            const votes = meeting.votes || {};

            // Vis/skjul meeting-header basert på om name er oppgitt
            const møteHeaderEl = document.getElementById('møteHeader');
            if (møteHeaderEl) {
                if (name) {
                    møteHeaderEl.style.display = 'block';
                    const h2 = document.getElementById('deltakerMøteTitle');
                    if (h2) h2.textContent = meeting.tittel || '';
                    const besk = document.getElementById('participantMeetingDesc');
                    if (besk) besk.textContent = meeting.beskrivelse || '';
                } else {
                    møteHeaderEl.style.display = 'none';
                }
            }
            // Vis header-kortet kun når name er registrert
            const header = document.getElementById('møteHeader');
            if (header) header.style.display = name ? 'block' : 'none';
            if (meeting.heldagshendelse) {
                renderParticipantKalender(meetingId, meeting, name, votes);
                return;
            }

            // ── Vanlige slot-card ──
            const timesHtml = meeting.slots.map(slot => {
                const formatted = new Date(slot).toLocaleString('en-GB', {
                    weekday:'long', year:'numeric', month:'long',
                    day:'numeric', hour:'2-digit', minute:'2-digit'
                ,hour12:false});
                const endTime2 = new Date(new Date(slot).getTime() + (meeting.varighet||60)*60000);
                const endStr = endTime2.toLocaleString('en-GB', {hour:'2-digit', minute:'2-digit',hour12:false});
                let ja = 0;
                Object.values(votes).forEach(s => {
                    if (s[slot] === 'ja') ja++;
                });
                const myVote = name ? (votes[name]?.[slot] || null) : null;
                const timeEscaped = slot.replace(/'/g, "\\'");
                const borderColor = minStemme === 'ja' ? '#6ee7b7' : 'var(--color-primary)';
                const availableText  = minStemme === 'ja' ? '✓ Available' : 'Available';
                const availableVote = minStemme === 'ja' ? 'clear' : 'ja';

                return `<div class="slot-card" style="border-left-color:${borderColor};">
                    <div class="slot-row">
                        <div class="slot-text">${formatted}–${endStr}</div>
                        <div class="slot-votes">✓ ${ja}</div>
                    </div>
                    <div class="vote-button-group">
                        <button class="vote-button ${myVote==='ja'?'selected-yes':''}" onclick="stem('${meetingId}','${timeEscaped}','${availableVote}')">${availableText}</button>
                    </div>
                </div>`;
            }).join('');

            // Free text option
            let freeTextHtml = '';
            if (meeting.fritekstAlternativ) {
                const key = 'fritekst_valg';
                const keyEscaped = key.replace(/'/g, "\\'");
                const isSelected = name ? (votes[name]?.[key] === 'selected') : false;
                const selectedCount = Object.values(votes).filter(s => s[key] === 'selected').length;
                freeTextHtml = `<div class="free-text-card">
                    <div class="free-text-label">${meeting.fritekstAlternativ}</div>
                    <div style="font-size:0.82em;color:var(--color-text-secondary);margin-botempty:8px;">${selectedCount > 0 ? selectedCount + ' have selected this' : ''}</div>
                    <button class="select-button ${isSelected?'selected':''}" onclick="stem('${meetingId}','${keyEscaped}','selected')">${isSelected ? '✓ Selected' : 'Select this'}</button>
                </div>`;
            }

            // Results for participant - same table as admin
            const antallParticipante = Object.keys(votes).length;
            let resultsHtml = '';
            if (antallParticipante > 0 && name) {
                const availablePerSlot = {};
                meeting.slots.forEach(slot => {
                    availablePerSlot[slot] = Object.values(votes).filter(s => s[slot] === 'ja').length;
            });
            const maxAvailable = Math.max(...Object.values(availablePerSlot), 0);
                const alleAvailableTimes = meeting.slots.filter(t => availablePerSlot[t] === antallParticipante);

                function slotColor(slot) {
                    const ja = availablePerSlot[slot] || 0;
                    if (ja === antallParticipante) return '#d1fae5';
                    if (ja === maxAvailable && ja > 0) return '#fef3c7';
                    return '#eff6ff';
                }

                // Grupper per dato
                const dateGroups = {};
                meeting.slots.forEach(slot => {
                    const dato = new Date(slot).toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
                    if (!dateGroups[dato]) dateGroups[dato] = [];
                    dateGroups[dato].push(slot);
                });

                let table = '<div style="overflow-x:auto;">';
                Object.entries(dateGroups).forEach(([dato, timesIDate]) => {
                    table += `<div style="font-family:'Syne',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--color-text-secondary);padding:10px 0 4px;">${dato}</div>`;
                    table += '<table class="resultater-table" style="margin-top:0;margin-botempty:12px;"><thead><tr><th style="min-width:80px;">Participant</th>';
                    timesIDate.forEach(slot => {
                        const s = new Date(slot), e = new Date(s.getTime() + (meeting.varighet||60)*60000);
                        const fmt = d => d.toLocaleString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false});
                        table += `<th style="text-align:center;background:${slotColor(slot)};padding:6px 10px;">${fmt(s)}<br><span style="font-weight:400;font-size:10px;opacity:0.7;">–${fmt(e)}</span></th>`;
                    });
                    table += '</tr></thead><tbody>';
                    Object.keys(votes).forEach(deltakerNavn => {
                        table += `<tr><td><strong>${deltakerNavn}</strong></td>`;
                        timesIDate.forEach(slot => {
                            const v = votes[deltakerNavn]?.[slot] || '–';
                            table += `<td style="text-align:center;background:${slotColor(slot)};padding:6px 10px;" class="${v==='ja'?'vote-ja':''}">${v==='ja'?'✓':'<span style="color:#f87171;">✗</span>'}</td>`;
                        });
                        table += '</tr>';
                    });
                    table += '</tbody></table>';
                });
                table += '</div>';

                resultsHtml = `<div class="participant-results">
                    <div class="participant-results-title">Overview</div>
                    ${table}
                </div>`;
            }

            const successMsg = name ? '<div class="success-message">✓ Your responses are saved</div>' : '';

            document.getElementById('deltakerTimesContainer').innerHTML =
                timesHtml + freeTextHtml + successMsg + resultsHtml;
        }

        let participantMonth = new Date();
        let participantMonthSet = false;

        function renderParticipantKalender(meetingId, meeting, name, votes) {
            const selectedDates = new Set(meeting.slots || []);
            const myVotes = name ? (votes[name] || {}) : {};

            // Sett participantMonth til firstDate dato kun firstDate gang
            if (!participantMonthSet && meeting.slots?.length > 0) {
                const firstDate = new Date(meeting.slots[0] + 'T00:00:00');
                participantMonth = new Date(firstDate.getFullYear(), firstDate.getMonth(), 1);
                participantMonthSet = true;
            }

            // Finn alle måneder med selected days - for indikator
            const månederMedDays = [...new Set(meeting.slots.map(t => t.slice(0,7)))].sort();
            const monthCount = månederMedDays.length;

            function buildCalendar() {
                const år = participantMonth.getFullYear();
                const mnd = participantMonth.getMonth();
                const currentMonthKey = `${år}-${String(mnd+1).padStart(2,'0')}`;
                const label = participantMonth.toLocaleDateString('en-GB', { month:'long', year:'numeric' });

                // Always set title in header (may have been reset)

                // Månedindikator-dotIndicators
                let dotIndicators = '';
                if (monthCount > 1) {
                    dotIndicators = '<div style="display:flex;gap:6px;justify-content:center;margin-botempty:8px;">' +
                        månederMedDays.map(m => {
                            const active = m === currentMonthKey;
                            return `<div style="width:8px;height:8px;border-radius:50%;background:${active ? 'var(--color-primary)' : 'var(--color-border)'};"></div>`;
                        }).join('') + '</div>';
                }

                // Hint hvis neste måned har days
                const nextMonthIdx = mnd === 11 ? 0 : mnd + 1;
                const nextYear = mnd === 11 ? år + 1 : år;
                const nextMonthKey = `${nextYear}-${String(nextMonthIdx+1).padStart(2,'0')}`;
                const nextMonthHint = månederMedDays.includes(nextMonthKey) ?
                    `<div style="text-align:center;font-size:12px;margin-top:8px;"><a href="#" onclick="changeParticipantMonth(1);return false;" style="color:var(--color-primary);font-weight:600;text-decoration:none;">→ More options next month</a></div>` : '';

                const dagNavn = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
                let html = `<div class="month-nav" style="margin-botempty:4px;">
                    <button class="schedule-nav-btn" onclick="changeParticipantMonth(-1)">←</button>
                    <div class="month-label">${label}</div>
                    <button class="schedule-nav-btn" onclick="changeParticipantMonth(1)">→</button>
                </div>
                ${dotIndicators}
                ${nextMonthHint}
                <div class="month-grid">`;

                html += dagNavn.map(d => `<div class="month-day-header">${d}</div>`).join('');

                const førsteDag = new Date(år, mnd, 1);
                const startOffset = (førsteDag.getDay() + 6) % 7;
                for (let i = 0; i < startOffset; i++) html += `<div class="calendar-day empty"></div>`;

                const daysIMnd = new Date(år, mnd + 1, 0).getDate();
                for (let dag = 1; dag <= daysIMnd; dag++) {
                    const dateStr = `${år}-${String(mnd+1).padStart(2,'0')}-${String(dag).padStart(2,'0')}`;
                    if (!selectedDates.has(dateStr)) {
                        html += `<div class="calendar-day" style="opacity:0.25;cursor:default;">${dag}</div>`;
                        continue;
                    }
