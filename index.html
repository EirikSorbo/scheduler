<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Syne:wght@700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primær: #9490d4;
            --primær-lys: #eeedfb;
            --primær-mørk: #2e2b45;
            --primær-mid: #c8c6ec;
            --tekst: #2e2b45;
            --tekst-sek: #7b78b0;
            --kant: #d4d2ee;
            --bg: #f3f2fb;
            --hvit: #ffffff;
            --r: 12px;
            --rs: 8px;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--bg);
            color: var(--tekst);
            min-height: 100vh;
            font-size: 15px;
            line-height: 1.5;
        }

        /* ── Header ── */
        header {
            background: var(--hvit);
            border-bottom: 1px solid var(--kant);
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 17px;
            color: var(--primær);
            letter-spacing: -0.3px;
        }

        .header-handlinger {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .bruker-info {
            text-align: right;
            font-size: 0.9em;
            display: none;
        }

        .bruker-navn {
            font-weight: 600;
            color: var(--tekst);
        }

        .bruker-rolle {
            font-size: 0.85em;
            color: var(--tekst-sek);
        }

        .header-knapp {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--kant);
            background: var(--hvit);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--tekst-sek);
            font-size: 18px;
            transition: all 0.15s;
            display: none;
        }

        .header-knapp:hover {
            background: var(--primær-lys);
            color: var(--primær);
            border-color: var(--primær-mid);
        }

        /* ── Login Panel ── */
        #loginOverlay {
            display: flex;
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }

        #loginOverlay button:hover {
            opacity: 0.95;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(148, 144, 212, 0.3);
        }

        /* ── Main ── */
        main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px 12px 64px;
        }

        .panel {
            display: none;
        }

        .panel.aktiv {
            display: block;
        }

        /* ── Admin View ── */
        .admin-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        .kort {
            background: var(--hvit);
            border-radius: var(--r);
            border: 1px solid var(--kant);
            overflow: hidden;
        }

        .kort-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--kant);
            background: var(--primær-lys);
        }

        .kort-tittel {
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 14px;
            color: var(--primær-mørk);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .møte-liste {
            display: flex;
            flex-direction: column;
        }

        .møte-item {
            padding: 13px 20px;
            border-bottom: 1px solid var(--kant);
            cursor: pointer;
            transition: background 0.15s;
            border-left: 4px solid transparent;
        }

        .møte-item:last-child {
            border-bottom: none;
        }

        .møte-item:hover {
            background: var(--primær-lys);
        }

        .møte-item.aktiv {
            background: var(--primær-lys);
            border-left-color: var(--primær);
        }

        .møte-tittel {
            font-weight: 700;
            font-size: 14px;
            color: var(--tekst);
            margin-bottom: 4px;
        }

        .møte-meta {
            font-size: 12px;
            color: var(--tekst-sek);
        }

        .legg-til-knapp {
            background: var(--primær);
            color: white;
            border: none;
            border-radius: var(--rs);
            padding: 9px 16px;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            cursor: pointer;
            transition: background 0.15s;
            width: calc(100% - 40px);
            margin: 12px 20px 20px;
        }

        .legg-til-knapp:hover {
            background: var(--primær-mørk);
        }

        .tom-melding {
            padding: 32px 20px;
            text-align: center;
            color: var(--tekst-sek);
            font-size: 14px;
        }

        /* ── Detaljer ── */
        #detaljSection {
            display: none;
        }

        #detaljSection.vis {
            display: block;
        }

        .kort-innhold {
            padding: 20px;
        }

        .form-gruppe {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--tekst);
            font-size: 0.95em;
            font-family: 'Syne', sans-serif;
        }

        input[type="text"],
        input[type="datetime-local"],
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid var(--kant);
            border-radius: var(--rs);
            font-size: 0.95em;
            font-family: 'Nunito', sans-serif;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        input[type="datetime-local"]:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primær);
            box-shadow: 0 0 0 3px rgba(148, 144, 212, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .tider-container {
            background: var(--primær-lys);
            padding: 16px;
            border-radius: var(--rs);
            margin: 12px 0;
        }

        .tid-slot {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            align-items: center;
        }

        .tid-slot:last-child {
            margin-bottom: 0;
        }

        .tid-slot input {
            flex: 1;
            margin-bottom: 0;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: var(--rs);
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Syne', sans-serif;
        }

        .btn-primær {
            background: var(--primær);
            color: white;
        }

        .btn-primær:hover {
            background: var(--primær-mørk);
        }

        .btn-sekundær {
            background: var(--kant);
            color: var(--tekst);
        }

        .btn-sekundær:hover {
            background: var(--primær-mid);
        }

        .btn-fare {
            background: #f87171;
            color: white;
        }

        .btn-fare:hover {
            background: #dc2626;
        }

        .knapp-gruppe {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .knapp-gruppe button {
            flex: 1;
            min-width: 120px;
        }

        .resultater-tabell {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
        }

        .resultater-tabell th {
            background: var(--primær-lys);
            padding: 12px;
            text-align: left;
            font-weight: 700;
            color: var(--primær-mørk);
            border-bottom: 2px solid var(--kant);
            font-family: 'Syne', sans-serif;
            font-size: 12px;
        }

        .resultater-tabell td {
            padding: 12px;
            border-bottom: 1px solid var(--kant);
        }

        .resultater-tabell tr:hover {
            background: var(--primær-lys);
        }

        .stemme-ja {
            color: #10b981;
            font-weight: 700;
        }

        .stemme-nei {
            color: #f87171;
            font-weight: 700;
        }

        .deling-boks {
            background: var(--primær-lys);
            padding: 16px;
            border-radius: var(--r);
            margin: 16px 0;
            border: 2px solid var(--primær-mid);
            display: flex;
            gap: 8px;
        }

        .deling-boks input {
            flex: 1;
            margin-bottom: 0;
            background: var(--hvit);
            border: 1px solid var(--kant);
        }

        /* ── Deltaker View ── */
        .deltaker-container {
            max-width: 600px;
            margin: 0 auto;
        }

        .møte-header {
            background: var(--hvit);
            padding: 24px;
            border-radius: var(--r);
            margin-bottom: 24px;
            border: 1px solid var(--kant);
            border-left: 4px solid var(--primær);
        }

        .møte-header h2 {
            color: var(--primær);
            margin-bottom: 8px;
            font-family: 'Syne', sans-serif;
        }

        .møte-header p {
            color: var(--tekst-sek);
            font-size: 0.95em;
        }

        .tid-kort {
            background: var(--hvit);
            padding: 20px;
            border-radius: var(--r);
            margin-bottom: 16px;
            border: 1px solid var(--kant);
            border-left: 4px solid var(--primær);
        }

        .tid-header {
            margin-bottom: 16px;
        }

        .tid-tekst {
            font-weight: 700;
            color: var(--tekst);
            font-size: 1.05em;
            margin-bottom: 4px;
            font-family: 'Syne', sans-serif;
        }

        .tid-stemmer {
            font-size: 0.9em;
            color: var(--tekst-sek);
        }

        .stemme-knapp-gruppe {
            display: flex;
            gap: 8px;
        }

        .stemme-knapp {
            flex: 1;
            padding: 12px;
            border: 2px solid var(--kant);
            background: var(--hvit);
            border-radius: var(--rs);
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s;
            font-size: 0.95em;
            font-family: 'Syne', sans-serif;
        }

        .stemme-knapp:hover {
            border-color: var(--primær);
            background: var(--primær-lys);
        }

        .stemme-knapp.valgt {
            background: var(--primær);
            color: white;
            border-color: var(--primær);
        }

        .suksess-melding {
            background: var(--primær-lys);
            color: var(--primær-mørk);
            padding: 16px;
            border-radius: var(--rs);
            margin-top: 24px;
            text-align: center;
            font-weight: 700;
            border: 2px solid var(--primær);
        }

        @media (max-width: 768px) {
            .admin-grid {
                grid-template-columns: 1fr;
            }

            header {
                padding: 12px 20px;
            }

            .knapp-gruppe {
                flex-direction: column;
            }

            .knapp-gruppe button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header id="header" style="display: none;">
        <div class="logo">Schedule</div>
        <div class="header-handlinger">
            <div class="bruker-info" id="brukerInfo">
                <div class="bruker-navn" id="brukerNavn"></div>
                <div class="bruker-rolle">Admin</div>
            </div>
            <button class="header-knapp" id="logoutBtn" onclick="logout()">🚪</button>
        </div>
    </header>

    <!-- Login Panel -->
    <div id="loginOverlay">
        <svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <clipPath id="licp"><circle cx="46" cy="36" r="18"/></clipPath>
            </defs>
            <rect width="72" height="72" rx="18" fill="white" stroke="#e0e0e0" stroke-width="1"/>
            <circle cx="26" cy="36" r="18" fill="#9490d4"/>
            <circle cx="46" cy="36" r="18" fill="#b4e8a8"/>
            <circle cx="26" cy="36" r="18" fill="#2e2b45" clip-path="url(#licp)"/>
            <circle cx="26" cy="36" r="18" fill="none" stroke="#6860b0" stroke-width="1"/>
            <circle cx="46" cy="36" r="18" fill="none" stroke="#6ca060" stroke-width="1"/>
        </svg>
        <div style="text-align:center;">
            <div style="font-family:'Syne',sans-serif;font-weight:800;font-size:20px;color:var(--tekst);font-variant-numeric:lining-nums;font-feature-settings:'lnum' 1;">Schedule</div>
            <div style="font-family:'Nunito',sans-serif;font-size:13px;color:var(--tekst-sek);margin-top:4px;">Logg inn for å arrangere møter</div>
        </div>
        <button onclick="signIn()" style="background:var(--primær);color:white;border:none;border-radius:10px;padding:13px 28px;font-family:'Syne',sans-serif;font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:10px;">
            <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#fff" d="M44.5 20H24v8.5h11.8C34.7 33.9 30.1 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 4.1 29.6 2 24 2 11.8 2 2 11.8 2 24s9.8 22 22 22c11 0 21-8 21-22 0-1.3-.2-2.7-.5-4z"/></svg>
            Logg inn med Google
        </button>
    </div>

    <!-- Admin Panel -->
    <div id="adminPanel" class="panel aktiv">
        <header id="header" style="display: flex;">
            <div class="logo">Schedule</div>
            <div class="header-handlinger">
                <div class="bruker-info" id="brukerInfo">
                    <div class="bruker-navn" id="brukerNavn"></div>
                    <div class="bruker-rolle">Admin</div>
                </div>
                <button class="header-knapp" id="logoutBtn" onclick="logout()" style="display: flex;">🚪</button>
            </div>
        </header>

        <main>
            <div class="admin-grid">
                <div class="kort">
                    <div class="kort-header">
                        <div class="kort-tittel">Dine møter</div>
                    </div>
                    <div class="kort-innhold">
                        <div class="møte-liste" id="møteListe"></div>
                        <button class="legg-til-knapp" onclick="opprettNyttMøte()">+ Nytt møte</button>
                    </div>
                </div>

                <div id="detaljSection">
                    <div class="kort">
                        <div class="kort-header">
                            <div class="kort-tittel" id="detaljTittel">Opprett møte</div>
                        </div>
                        <div class="kort-innhold" id="detaljInnhold"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Deltaker Panel -->
    <div id="deltakerPanel" class="panel">
        <main>
            <div class="deltaker-container">
                <div class="møte-header">
                    <h2 id="deltakerMøteTittel"></h2>
                    <p id="deltakerMøteBeskrivelse"></p>
                </div>
                <div id="deltakerTiderContainer"></div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
            from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
        import { getFirestore, collection, doc, setDoc, getDoc, getDocs, deleteDoc, onSnapshot, query, where }
            from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDvR6Jlt9j7ECudDhF1VtPPr2G3gcEqXCA",
            authDomain: "scheduler-2be23.firebaseapp.com",
            projectId: "scheduler-2be23",
            storageBucket: "scheduler-2be23.firebasestorage.app",
            messagingSenderId: "547633808881",
            appId: "1:547633808881:web:e761037ef250b715e07050"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let currentMøteId = null;
        let møter = {};

        // Sign In
        window.signIn = async () => {
            try {
                await signInWithPopup(auth, new GoogleAuthProvider());
            } catch(e) {
                alert('Innlogging feilet: ' + e.message);
            }
        };

        // Sign Out
        window.logout = async () => {
            await signOut(auth);
        };

        // Auth State
        onAuthStateChanged(auth, async bruker => {
            const loginOverlay = document.getElementById('loginOverlay');
            const brukerInfo = document.getElementById('brukerInfo');
            const brukerNavn = document.getElementById('brukerNavn');
            const header = document.getElementById('header');
            const adminPanel = document.getElementById('adminPanel');
            const deltakerPanel = document.getElementById('deltakerPanel');

            if (bruker) {
                // Logget inn
                currentUser = bruker;
                loginOverlay.style.display = 'none';
                header.style.display = 'flex';
                adminPanel.classList.add('aktiv');
                deltakerPanel.classList.remove('aktiv');
                brukerNavn.textContent = bruker.displayName || bruker.email;

                // Hent møter fra Firestore
                const q = query(collection(db, 'schedule_møter'), where('uid', '==', bruker.uid));
                onSnapshot(q, snapshot => {
                    møter = {};
                    snapshot.forEach(doc => {
                        møter[doc.id] = doc.data();
                    });
                    renderMøteListe();
                });
            } else {
                // Ikke logget inn
                currentUser = null;
                loginOverlay.style.display = 'flex';
                header.style.display = 'none';
                adminPanel.classList.remove('aktiv');
                møter = {};
            }
        });

        // Møte Liste
        function renderMøteListe() {
            const liste = document.getElementById('møteListe');
            const møteIds = Object.keys(møter);

            if (møteIds.length === 0) {
                liste.innerHTML = '<div class="tom-melding">Ingen møter ennå. Opprett ditt første møte!</div>';
                document.getElementById('detaljSection').classList.remove('vis');
                return;
            }

            liste.innerHTML = møteIds.map(id => {
                const møte = møter[id];
                const aktiv = currentMøteId === id ? 'aktiv' : '';
                const deltakere = Object.keys(møte.stemmer || {}).length;
                return `
                    <div class="møte-item ${aktiv}" onclick="velgMøte('${id}')">
                        <div class="møte-tittel">${møte.tittel}</div>
                        <div class="møte-meta">${møte.tider.length} tider · ${deltakere} deltaker(e)</div>
                    </div>
                `;
            }).join('');
        }

        window.velgMøte = (møteId) => {
            currentMøteId = møteId;
            renderMøteListe();
            renderMøteDetaljer(møteId);
        };

        // Opprett Møte
        window.opprettNyttMøte = () => {
            currentMøteId = 'ny_' + Date.now();
            møter[currentMøteId] = {
                tittel: '',
                beskrivelse: '',
                tider: [''],
                stemmer: {}
            };
            renderMøteListe();
            renderMøteDetaljer(currentMøteId);
        };

        function renderMøteDetaljer(møteId) {
            const møte = møter[møteId];
            const detaljSection = document.getElementById('detaljSection');
            const detaljTittel = document.getElementById('detaljTittel');
            const detaljInnhold = document.getElementById('detaljInnhold');

            if (møteId.startsWith('ny_')) {
                detaljTittel.textContent = 'Opprett møte';
                detaljInnhold.innerHTML = `
                    <div class="form-gruppe">
                        <label>Møte tittel</label>
                        <input type="text" id="editTittel" value="${møte.tittel}" placeholder="F.eks. Teammøte">
                    </div>

                    <div class="form-gruppe">
                        <label>Beskrivelse (valgfritt)</label>
                        <textarea id="editBeskrivelse" placeholder="Noen ord om møtet...">${møte.beskrivelse || ''}</textarea>
                    </div>

                    <div class="form-gruppe">
                        <label>Møtetider</label>
                        <div class="tider-container" id="editTider"></div>
                        <button class="btn-sekundær" onclick="leggTilTid()" style="width: 100%; margin-top: 8px;">+ Legg til tid</button>
                    </div>

                    <div class="knapp-gruppe">
                        <button class="btn-primær" onclick="lagreMøte()">Lagre møte</button>
                        <button class="btn-sekundær" onclick="avbrytRedigering()">Avbryt</button>
                    </div>
                `;
                renderEditTider();
            } else {
                detaljTittel.textContent = møte.tittel;
                const delingsLink = window.location.origin + window.location.pathname + '?møte=' + møteId;

                let resultatHTML = '<h3 style="margin: 20px 0 16px; color: var(--tekst); font-family: Syne;">Stemmeresultater</h3>';
                if (Object.keys(møte.stemmer || {}).length === 0) {
                    resultatHTML += '<p style="color: var(--tekst-sek);">Ingen stemmer ennå</p>';
                } else {
                    resultatHTML += '<table class="resultater-tabell"><thead><tr><th>Deltaker</th>';
                    møte.tider.forEach(tid => {
                        const formatted = new Date(tid).toLocaleString('no-NO', { weekday: 'short', hour: '2-digit', minute: '2-digit' });
                        resultatHTML += `<th>${formatted}</th>`;
                    });
                    resultatHTML += '</tr></thead><tbody>';

                    Object.entries(møte.stemmer).forEach(([navn, stemmer]) => {
                        resultatHTML += `<tr><td><strong>${navn}</strong></td>`;
                        møte.tider.forEach(tid => {
                            const stemme = stemmer[tid] || '-';
                            const klasse = stemme === 'ja' ? 'stemme-ja' : stemme === 'nei' ? 'stemme-nei' : '';
                            const symbol = stemme === 'ja' ? '✓' : stemme === 'nei' ? '✗' : '-';
                            resultatHTML += `<td class="${klasse}" style="text-align: center;">${symbol}</td>`;
                        });
                        resultatHTML += '</tr>';
                    });
                    resultatHTML += '</tbody></table>';
                }

                detaljInnhold.innerHTML = `
                    <div class="form-gruppe">
                        <label>Møte lenke</label>
                        <div class="deling-boks">
                            <input type="text" value="${delingsLink}" readonly>
                            <button class="btn-primær" onclick="kopierLink('${delingsLink}')">Kopier</button>
                        </div>
                    </div>

                    <div class="form-gruppe">
                        <label>Møtetider</label>
                        ${møte.tider.map(tid => {
                            const formatted = new Date(tid).toLocaleString('no-NO', { 
                                year: 'numeric', month: 'short', day: 'numeric', 
                                hour: '2-digit', minute: '2-digit' 
                            });
                            return `<div style="padding: 8px; background: var(--primær-lys); border-radius: 6px; margin-bottom: 8px;">${formatted}</div>`;
                        }).join('')}
                    </div>

                    ${resultatHTML}

                    <div class="knapp-gruppe">
                        <button class="btn-sekundær" onclick="redigerMøte('${møteId}')">Rediger</button>
                        <button class="btn-fare" onclick="slettMøte('${møteId}')">Slett</button>
                    </div>
                `;
            }

            detaljSection.classList.add('vis');
        }

        function renderEditTider() {
            const container = document.getElementById('editTider');
            const møte = møter[currentMøteId];

            container.innerHTML = møte.tider.map((tid, i) => `
                <div class="tid-slot">
                    <input type="datetime-local" value="${tid}" onchange="oppdaterTid(${i}, this.value)">
                    <button class="btn-fare" onclick="fjernTid(${i})">Fjern</button>
                </div>
            `).join('');
        }

        window.oppdaterTid = (index, value) => {
            møter[currentMøteId].tider[index] = value;
        };

        window.leggTilTid = () => {
            møter[currentMøteId].tider.push('');
            renderEditTider();
        };

        window.fjernTid = (index) => {
            møter[currentMøteId].tider.splice(index, 1);
            renderEditTider();
        };

        window.lagreMøte = async () => {
            const møte = møter[currentMøteId];
            møte.tittel = document.getElementById('editTittel').value;
            møte.beskrivelse = document.getElementById('editBeskrivelse').value;
            møte.tider = møte.tider.filter(t => t);

            if (!møte.tittel || møte.tider.length === 0) {
                alert('Fyll inn tittel og minst en tid');
                return;
            }

            let møteId = currentMøteId;
            if (currentMøteId.startsWith('ny_')) {
                møteId = Date.now().toString();
            }

            møte.uid = currentUser.uid;

            try {
                await setDoc(doc(db, 'schedule_møter', møteId), møte);
                møter[møteId] = møte;
                if (currentMøteId.startsWith('ny_')) {
                    delete møter[currentMøteId];
                    currentMøteId = møteId;
                }
                renderMøteListe();
                renderMøteDetaljer(currentMøteId);
            } catch(e) {
                alert('Feil ved lagring: ' + e.message);
            }
        };

        window.avbrytRedigering = () => {
            if (currentMøteId.startsWith('ny_')) {
                delete møter[currentMøteId];
                currentMøteId = null;
                renderMøteListe();
                document.getElementById('detaljSection').classList.remove('vis');
            }
        };

        window.redigerMøte = (møteId) => {
            currentMøteId = møteId;
            renderMøteDetaljer(møteId);
        };

        window.slettMøte = async (møteId) => {
            if (confirm('Slett dette møtet?')) {
                try {
                    await deleteDoc(doc(db, 'schedule_møter', møteId));
                    delete møter[møteId];
                    currentMøteId = null;
                    renderMøteListe();
                    document.getElementById('detaljSection').classList.remove('vis');
                } catch(e) {
                    alert('Feil ved sletting: ' + e.message);
                }
            }
        };

        window.kopierLink = (link) => {
            navigator.clipboard.writeText(link);
            alert('Lenke kopiert!');
        };

        // Deltaker Panel
        async function vissDeltakerPanel(møteId) {
            const adminPanel = document.getElementById('adminPanel');
            const deltakerPanel = document.getElementById('deltakerPanel');
            const header = document.getElementById('header');

            adminPanel.classList.remove('aktiv');
            deltakerPanel.classList.add('aktiv');
            header.style.display = 'none';

            try {
                const snap = await getDoc(doc(db, 'schedule_møter', møteId));
                if (snap.exists()) {
                    const møte = snap.data();
                    document.getElementById('deltakerMøteTittel').textContent = møte.tittel;
                    document.getElementById('deltakerMøteBeskrivelse').textContent = møte.beskrivelse || '';

                    const container = document.getElementById('deltakerTiderContainer');
                    container.innerHTML = møte.tider.map(tid => {
                        const formatted = new Date(tid).toLocaleString('no-NO', {
                            weekday: 'long', year: 'numeric', month: 'long',
                            day: 'numeric', hour: '2-digit', minute: '2-digit'
                        });

                        let jaCount = 0, neiCount = 0;
                        Object.values(møte.stemmer || {}).forEach(stemmer => {
                            if (stemmer[tid] === 'ja') jaCount++;
                            if (stemmer[tid] === 'nei') neiCount++;
                        });

                        return `
                            <div class="tid-kort">
                                <div class="tid-header">
                                    <div class="tid-tekst">${formatted}</div>
                                    <div class="tid-stemmer">Kan: ${jaCount} · Kan ikke: ${neiCount}</div>
                                </div>
                                <div class="stemme-knapp-gruppe">
                                    <button class="stemme-knapp" onclick="submitStemme('${møteId}', '${tid}', 'ja')">✓ Kan</button>
                                    <button class="stemme-knapp" onclick="submitStemme('${møteId}', '${tid}', 'nei')">✗ Kan ikke</button>
                                </div>
                            </div>
                        `;
                    }).join('');

                    container.innerHTML += '<div class="suksess-melding">✓ Stemmene dine er lagret</div>';
                }
            } catch(e) {
                alert('Møte ikke funnet');
            }
        }

        window.submitStemme = async (møteId, tid, stemme) => {
            let navn = localStorage.getItem('deltaker_navn_' + møteId);
            if (!navn) {
                navn = prompt('Hva heter du?');
                if (!navn) return;
                localStorage.setItem('deltaker_navn_' + møteId, navn);
            }

            try {
                const snap = await getDoc(doc(db, 'schedule_møter', møteId));
                const møte = snap.data();
                if (!møte.stemmer) møte.stemmer = {};
                if (!møte.stemmer[navn]) møte.stemmer[navn] = {};
                møte.stemmer[navn][tid] = stemme;

                await setDoc(doc(db, 'schedule_møter', møteId), møte);
                vissDeltakerPanel(møteId);
            } catch(e) {
                alert('Feil ved stemming: ' + e.message);
            }
        };

        // Sjekk URL
        window.addEventListener('load', () => {
            const params = new URLSearchParams(window.location.search);
            const møteId = params.get('møte');
            if (møteId) {
                vissDeltakerPanel(møteId);
            }
        });

        window.vissDeltakerPanel = vissDeltakerPanel;
    </script>
</body>
</html>
