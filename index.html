                    const svar = myVotes[dateStr] || null;
                    let klasse = 'calendar-day';
                    let svarTekst = '';
                    if (svar === 'ja') { klasse += ' kan'; svarTekst = '✓'; }
                    html += `<div class="${klasse}" onclick="voteCalendar('${meetingId}','${dateStr}')">
                        <div class="day-number">${dag}</div>
                        ${svarTekst ? `<div class="day-response">${svarTekst}</div>` : ''}
                    </div>`;
                }
                html += '</div>';
                html += nextMonthHint;

                // Fritekst
                let freeTextHtml = '';
                if (meeting.fritekstAlternativ) {
                    const isSelected = myVotes['fritekst_valg'] === 'selected';
                    const antall = Object.values(votes).filter(s => s['fritekst_valg'] === 'selected').length;
                    freeTextHtml = `<div class="free-text-card" style="margin-top:16px;">
                        <div class="free-text-label">${meeting.fritekstAlternativ}</div>
                        <div style="font-size:0.82em;color:#991b1b;margin-botempty:8px;">${antall > 0 ? antall + ' have selected this' : ''}</div>
                        <button class="select-button ${isSelected?'selected':''}" onclick="stem('${meetingId}','fritekst_valg','selected')">${isSelected ? '✓ Selected' : 'Select this'}</button>
                    </div>`;
                }

                const successMsg = name ? '<div class="success-message" style="margin-top:16px;">✓ Your responses are saved</div>' : '';

                // Tabell
                const antallParticipante = Object.keys(votes).length;
                let tableHtml = '';
                if (antallParticipante > 0 && name) {
                    const availablePerDay = {};
                    meeting.slots.forEach(d => { availablePerDay[d] = Object.values(votes).filter(s => s[d] === 'ja').length; });
                    const maxAvailable = Math.max(...Object.values(availablePerDay), 0);

                    const fmt = d => new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
                    const slotColor = d => {
                        const ja = availablePerDay[d] || 0;
                        if (ja === antallParticipante) return '#d1fae5';
                        if (ja === maxAvailable && ja > 0) return '#fef3c7';
                        return '#eff6ff';
                    };

                    let table = '<div style="overflow-x:auto;margin-top:20px;border-top:2px solid var(--color-border);padding-top:16px;"><div style="font-family:\'Syne\',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--color-text-secondary);margin-botempty:8px;">Overview</div>';
                    table += '<table class="resultater-table"><thead><tr><th>Participant</th>';
                    meeting.slots.forEach(d => { table += `<th style="text-align:center;background:${slotColor(d)};padding:6px 8px;font-size:11px;">${fmt(d)}</th>`; });
                    table += '</tr></thead><tbody>';
                    Object.keys(votes).forEach(n => {
                        table += `<tr><td><strong>${n}</strong></td>`;
                        meeting.slots.forEach(d => {
                            const v = votes[n]?.[d] || '–';
                            table += `<td style="text-align:center;background:${slotColor(d)};" class="${v==='ja'?'vote-ja':''}">${v==='ja'?'✓':'<span style="color:#f87171;">✗</span>'}</td>`;
                        });
                        table += '</tr>';
                    });
                    table += '</tbody></table></div>';
                    tableHtml = table;
                }

                document.getElementById('deltakerTimesContainer').innerHTML = html + freeTextHtml + successMsg + tableHtml;
            }

            buildCalendar();

            window.changeParticipantMonth = (direction) => {
                participantMonth.setMonth(participantMonth.getMonth() + direction);
                buildCalendar();
            };
        }

        window.voteCalendar = async (meetingId, dateStr) => {
            const savedName = localStorage.getItem('participant_name_' + meetingId);
            const inputName  = document.getElementById('participantNameInput')?.value.trim();
            const name = savedName || inputName;

            if (!name) {
                document.getElementById('participantNameInput').focus();
                document.getElementById('participantNameInput').style.borderColor = '#f87171';
                setTimeout(() => document.getElementById('participantNameInput').style.borderColor = '', 2000);
                return;
            }
            try {
                const snap = await getDoc(doc(db, 'schedule_moter', meetingId));
                if (!snap.exists()) return;
                const _raw = snap.data();
                const meeting = {..._raw, slots: _raw.tider||[], votes: _raw.stemmer||{}};

                // Check duplicate name
                const existing = Object.keys(meeting.votes || {});
                const savedNameCheck = localStorage.getItem('participant_name_' + meetingId);
                if (existing.includes(name) && savedNameCheck !== name) {
                    const inp = document.getElementById('participantNameInput');
                    if (inp) {
                        inp.value = '';
                        inp.placeholder = '⚠ This name is taken — please choose another';
                        inp.style.borderColor = '#f87171';
                        setTimeout(() => { inp.style.borderColor = ''; inp.placeholder = 'Enter your name here...'; }, 4000);
                    }
                    return;
                }

                localStorage.setItem('participant_name_' + meetingId, name);
                if (!meeting.votes) meeting.votes = {};
                if (!meeting.votes[name]) meeting.votes[name] = {};
                // All-day event: toggle available/remove (no unavailable)
                const current = meeting.votes[name][dateStr];
                if (!current || current === 'nei') meeting.votes[name][dateStr] = 'ja';
                else delete meeting.votes[name][dateStr];
                const _s = {tittel:meeting.tittel,beskrivelse:meeting.beskrivelse,uid:meeting.uid||'',varighet:meeting.varighet||60,heldagshendelse:meeting.heldagshendelse||false,fritekstAlternativ:meeting.fritekstAlternativ||'',tider:meeting.slots||[],stemmer:meeting.votes||{}};
                await setDoc(doc(db, 'schedule_moter', meetingId), _s);
                renderParticipantTimes(meetingId, meeting);
            } catch(e) { alert('Error: ' + e.message); }
        };

        window.stem = async (meetingId, slot, vote) => {
            const name = document.getElementById('participantNameInput').value.trim();
            if (!name) {
                document.getElementById('participantNameInput').focus();
                document.getElementById('participantNameInput').style.borderColor = '#f87171';
                setTimeout(() => document.getElementById('participantNameInput').style.borderColor = '', 2000);
                return;
            }

            try {
                const snap = await getDoc(doc(db, 'schedule_moter', meetingId));
                if (!snap.exists()) { alert('This meeting no longer exists'); return; }
                const _raw = snap.data();
                const meeting = {..._raw, slots: _raw.tider||[], votes: _raw.stemmer||{}};

                // Bug 2: Sjekk om navnet tilhører en annen user
                const existing = Object.keys(meeting.votes || {});
                const savedName = localStorage.getItem('participant_name_' + meetingId);
                if (existing.includes(name) && savedName !== name) {
                    const inp = document.getElementById('participantNameInput');
                    inp.value = '';
                    inp.placeholder = '⚠ This name is taken — please choose another';
                    inp.style.borderColor = '#f87171';
                    setTimeout(() => { inp.style.borderColor = ''; inp.placeholder = 'Enter your name here...'; }, 4000);
                    return;
                }

                localStorage.setItem('participant_name_' + meetingId, name);
                if (!meeting.votes)        meeting.votes = {};
                if (!meeting.votes[name])  meeting.votes[name] = {};
                if (vote === 'clear')   delete meeting.votes[name][slot];
                else                      meeting.votes[name][slot] = vote;
                const _s = {tittel:meeting.tittel,beskrivelse:meeting.beskrivelse,uid:meeting.uid||'',varighet:meeting.varighet||60,heldagshendelse:meeting.heldagshendelse||false,fritekstAlternativ:meeting.fritekstAlternativ||'',tider:meeting.slots||[],stemmer:meeting.votes||{}};
                await setDoc(doc(db, 'schedule_moter', meetingId), _s);
                renderParticipantTimes(meetingId, meeting);
            } catch(e) { alert('Error submitting: ' + e.message); }
        };
    </script>
