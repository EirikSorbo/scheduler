            .timeplan-slot.stiplet { border-bottom: 1px dashed rgba(59,130,246,0.2); }
            .timeplan-wrapper { height: 320px; }
            .timeplan-tid { font-size: 12px; padding: 6px; width: 44px; min-width: 44px; }

            /* ── Participant: mer luft ── */
            .deltaker-container { padding: 0 4px; }

            main { padding: 12px 8px 80px; }
        }
    </style>
</head>
<body>

    <!-- Login Overlay (skjules for deltakere og innloggede admins) -->
    <div id="loginOverlay">

        <div style="text-align:center;">
            <div style="font-family:'Syne',sans-serif;font-weight:800;font-size:20px;color:var(--tekst);">Schedule</div>
            <div style="font-family:'Nunito',sans-serif;font-size:13px;color:var(--tekst-sek);margin-top:4px;">Sign in to organize meetings</div>
            <div style="font-family:'Nunito',sans-serif;font-size:11px;color:var(--primær-mid);margin-top:8px;">v2.22</div>
        </div>
        <button onclick="signIn()">
            <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#fff" d="M44.5 20H24v8.5h11.8C34.7 33.9 30.1 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 4.1 29.6 2 24 2 11.8 2 2 11.8 2 24s9.8 22 22 22c11 0 21-8 21-22 0-1.3-.2-2.7-.5-4z"/></svg>
            Sign in with Google
        </button>
    </div>

    <!-- Header (kun synlig for admin) -->
    <header id="appHeader">
        <div class="logo">Schedule <span style="font-size:11px;font-weight:400;color:var(--tekst-sek);margin-left:4px;">v2.22</span></div>

        <div class="header-handlinger">
            <div style="display:flex;gap:10px;align-items:center;">
                <div>
                    <div class="bruker-navn" id="brukerNavn"></div>
                    <div class="bruker-rolle">Admin</div>
                </div>
                <button class="header-knapp" onclick="logout()" title="Logg ut" style="font-size:14px;">⏏</button>
            </div>
        </div>
    </header>

    <!-- Admin Panel -->
    <div id="adminPanel" class="panel">
        <main>
            <div class="admin-toprad">
                <div class="kort-tittel">Your meetings</div>
                <button class="legg-til-knapp" onclick="opprettNyttMøte()">+ New meeting</button>
            </div>
            <div class="admin-grid">
                <div class="kort" id="møteKort">
                    <div class="møte-liste" id="møteListe"></div>
                </div>

                <div id="detaljSection">
                    <div class="kort">
                        <div class="kort-header">
                            <div class="kort-tittel" id="detaljTitle"></div>
                        </div>
                        <div class="kort-innhold" id="detaljInnhold"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Participant Panel -->
    <div id="deltakerPanel" class="panel">
        <main>
            <div class="deltaker-container">
                <!-- Møte-header vises alltid, tittel fylles inn fra JS -->
                <div class="møte-header" id="møteHeader" style="margin-bottom:16px;">
                    <div style="display:flex;justify-content:space-between;align-items:flex-start;">
                        <div>
                            <h2 id="deltakerMøteTitle" style="color:var(--primær);font-family:'Syne',sans-serif;font-weight:700;font-size:1.3em;margin-bottom:4px;"></h2>
                            <p id="deltakerMøteBeskrivelse" style="color:var(--tekst-sek);font-size:0.95em;"></p>
                        </div>
                        <div style="font-family:'Nunito',sans-serif;font-size:12px;color:var(--tekst-sek);white-space:nowrap;margin-left:16px;margin-top:2px;">By Eirik Sørbø</div>
                    </div>
                </div>

                <!-- Navnefelt -->
                <div class="kort" id="navneKort" style="margin-bottom:12px;">
                    <div class="kort-innhold" style="padding:12px 16px;">
                        <div style="flex:1;">
                            <label style="margin-bottom:4px;">Your name</label>
                            <input type="text" id="deltakerNavnInput" placeholder="Enter your name here..." oninput="oppdaterNavn(false)" onchange="oppdaterNavn(true)" onblur="oppdaterNavn(true)" style="padding:8px 12px;">
                        </div>
                    </div>
                </div>

                <div id="deltakerTimesContainer"></div>
            </div>
        </main>
    </div>

    <!-- Thank you modal -->
    <div id="thankYouModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:10000;align-items:center;justify-content:center;">
        <div style="background:white;border-radius:16px;padding:40px 32px;text-align:center;max-width:320px;width:90%;box-shadow:0 8px 40px rgba(0,0,0,0.22);">
            <div id="thankYouModalTitle" style="font-family:'Syne',sans-serif;font-weight:800;font-size:20px;color:var(--tekst);margin-bottom:8px;">Thank you for your answers!</div>
            <div id="thankYouModalBody" style="font-size:14px;color:var(--tekst-sek);margin-bottom:28px;">Your responses have been saved.</div>
            <button onclick="document.getElementById('thankYouModal').style.display='none'" style="background:var(--primær);color:white;border:none;border-radius:var(--rs);padding:12px 32px;font-family:'Syne',sans-serif;font-weight:700;font-size:14px;cursor:pointer;transition:background 0.15s;" onmouseover="this.style.background='var(--primær-mørk)'" onmouseout="this.style.background='var(--primær)'">Close</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
            from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
        import { getFirestore, collection, doc, setDoc, getDoc, deleteDoc, onSnapshot, query, where }
            from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDvR6Jlt9j7ECudDhF1VtPPr2G3gcEqXCA",
            authDomain: "scheduler-2be23.firebaseapp.com",
            projectId: "scheduler-2be23",
            storageBucket: "scheduler-2be23.firebasestorage.app",
            messagingSenderId: "547633808881",
            appId: "1:547633808881:web:e761037ef250b715e07050"
        };

        const app  = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db   = getFirestore(app);

        // ── State ──
        let currentUser  = null;
        let currentMøteId = null;
        let møter        = {};
        let redigeringsModus = false;
        let unsubscribeMøter = null; // for å rydde opp onSnapshot-lytter
        let thankYouShown = false;  // shown at most once per session

        // ── Sjekk URL umiddelbart ──
        const urlParams     = new URLSearchParams(window.location.search);
        const møteIdFraUrl  = urlParams.get('møte');
        const erParticipant    = !!møteIdFraUrl;

        if (erParticipant) {
            // Participant-modus: skjul loginoverlay, vis deltaker-panel
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('deltakerPanel').classList.add('aktiv');
            lastParticipantPanel(møteIdFraUrl);
        }

        // ── Auth ──
        const ADMIN_EPOST = 'eirik.sorbo@gmail.com'; // Kun denne brukeren får logge inn

        window.signIn = async () => {
            try {
                const result = await signInWithPopup(auth, new GoogleAuthProvider());
                if (result.user.email !== ADMIN_EPOST) {
                    await signOut(auth);
                    alert('This app is for the organizer only.');
                }
            } catch(e) {
                alert('Sign-in failed: ' + e.message);
            }
        };

        window.logout = async () => { await signOut(auth); };

        onAuthStateChanged(auth, async bruker => {
            if (erParticipant) return; // ikke forstyrr deltaker-modus

            if (bruker && bruker.email === ADMIN_EPOST) {
                currentUser = bruker;
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('appHeader').style.display = 'flex';
                document.getElementById('adminPanel').classList.add('aktiv');
                document.getElementById('brukerNavn').textContent = bruker.displayName || bruker.email;

                // Unsubscribe gammel lytter hvis den finnes
                if (unsubscribeMøter) unsubscribeMøter();

                const q = query(collection(db, 'schedule_moter'), where('uid', '==', bruker.uid));
                unsubscribeMøter = onSnapshot(q, snapshot => {
                    snapshot.forEach(d => {
                        møter[d.id] = d.data();
                    });
                    // Fjern møter som er slettet fra Firestore
                    const firebaseIds = snapshot.docs.map(d => d.id);
                    Object.keys(møter).forEach(id => {
                        if (!id.startsWith('ny_') && !firebaseIds.includes(id)) {
                            delete møter[id];
                        }
                    });
                    renderMøteListe();
                    // Oppdater åpent møte live hvis det er i visning (ikke redigering)
                    if (currentMøteId && !currentMøteId.startsWith('ny_') && !redigeringsModus) {
                        renderMøteDetaljer(currentMøteId);
                    } else if (!currentMøteId) {
                        // Vis nyeste møte som default
                        const ids = Object.keys(møter).filter(id => !id.startsWith('ny_'));
                        if (ids.length > 0) {
                            const nyesteId = ids.sort((a, b) => Number(b) - Number(a))[0];
                            currentMøteId = nyesteId;
                            renderMøteListe();
                            renderMøteDetaljer(nyesteId);
                            if (erMobil()) visMobilDetalj();
                        }
                    }
                });
            } else {
                currentUser = null;
                if (unsubscribeMøter) { unsubscribeMøter(); unsubscribeMøter = null; }
                document.getElementById('loginOverlay').style.display = 'flex';
                document.getElementById('appHeader').style.display = 'none';
                document.getElementById('adminPanel').classList.remove('aktiv');
                møter = {};
            }
        });

        // ── Admin: Møteliste ──
        function renderMøteListe() {
            const liste = document.getElementById('møteListe');
            const ids = Object.keys(møter).filter(id => !id.startsWith('ny_'));

            if (ids.length === 0) {
                liste.innerHTML = '<div class="tom-melding">No meetings yet</div>';
                if (!currentMøteId?.startsWith('ny_')) {
                    document.getElementById('detaljSection').classList.remove('vis');
                }
                return;
            }

            liste.innerHTML = ids.map(id => {
                const m = møter[id];
                const aktiv = currentMøteId === id ? 'aktiv' : '';
                const antall = Object.keys(m.stemmer || {}).length;
                return `<div class="møte-item ${aktiv}" onclick="velgMøte('${id}')">
                    <div class="møte-tittel">${m.tittel}</div>
                    <div class="møte-meta">${m.tider.length} ${m.heldagshendelse ? 'dager' : 'tider'} · ${antall} participant(s)</div>
                </div>`;
            }).join('');
        }

        const erMobil = () => window.innerWidth <= 600;

        window.velgMøte = id => {
            currentMøteId = id;
            redigeringsModus = false;
            renderMøteListe();
            renderMøteDetaljer(id);
            if (erMobil()) visMobilDetalj();
        };

        function visMobilDetalj() {
            document.getElementById('møteKort').classList.add('skjult-mobil');
            document.getElementById('detaljSection').classList.add('vis-mobil');
        }

        function visMobilListe() {
            document.getElementById('møteKort').classList.remove('skjult-mobil');
            document.getElementById('detaljSection').classList.remove('vis-mobil');
        }

        window.mobilTilbake = () => {
            currentMøteId = null;
            redigeringsModus = false;
            document.getElementById('detaljSection').classList.remove('vis');
            renderMøteListe();
            visMobilListe();
        };

        // ── Admin: Nytt møte ──
        window.opprettNyttMøte = () => {
            currentMøteId = 'ny_' + Date.now();
            redigeringsModus = true;
            møter[currentMøteId] = { tittel: '', beskrivelse: '', varighet: 60, tider: [''], stemmer: {} };
            renderMøteListe();
            visSkjema(currentMøteId);
            if (erMobil()) visMobilDetalj();
        };

        // ── Admin: Vis møtedetaljer (lesemodus) ──
        function renderMøteDetaljer(møteId) {
            const møte = møter[møteId];
            if (!møte) return;

            document.getElementById('detaljTitle').textContent = møte.tittel;
            document.getElementById('detaljSection').classList.add('vis');

            const link = window.location.origin + window.location.pathname + '?møte=' + møteId;

            const stemmer = møte.stemmer || {};
            const deltakere = Object.keys(stemmer);
            const antallParticipante = deltakere.length;
            const visResponses = deltakere.length > 0;

            // Count only external respondents (excluding organizer)
            const jaPerTid = {};
            møte.tider.forEach(tid => {
                jaPerTid[tid] = deltakere.filter(n => stemmer[n]?.[tid] === 'ja').length;
            });
            const maxJa = Math.max(...Object.values(jaPerTid), 0);
            const alleAvailableTimes = møte.tider.filter(t => jaPerTid[t] === antallParticipante && antallParticipante > 0);

            function tidFarge(tid) {
                if (!visResponses) return 'var(--primær-lys)';
                const ja = jaPerTid[tid] || 0;
                if (ja === antallParticipante) return '#d1fae5';
                if (ja === maxJa && ja > 0) return '#fef3c7';
                return 'var(--primær-lys)';
            }

            // Analysetekst
            let analyseTekst = '';
            if (!visResponses) {
                analyseTekst = '<p style="color:var(--tekst-sek);font-size:0.9em;margin-bottom:8px;">No responses yet.</p>';
            } else if (alleAvailableTimes.length > 0) {
                const tidTexts = alleAvailableTimes.map(t => {
                    if (møte.heldagshendelse) {
                        return new Date(t + 'T00:00:00').toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
                    }
                    const s = new Date(t), e = new Date(s.getTime() + (møte.varighet||60)*60000);
                    const fmt = d => d.toLocaleString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false});
                    return s.toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short'}) + ' ' + fmt(s) + '–' + fmt(e);
                }).join(', ');
                analyseTekst = `<div style="background:#d1fae5;border:1px solid #6ee7b7;border-radius:var(--rs);padding:10px 14px;margin-bottom:12px;font-size:0.9em;"><strong>Everyone available:</strong><br>${tidTexts.split(', ').join('<br>')}</div>`;
            } else if (maxJa > 0) {
                const besteTimes = møte.tider.filter(t => jaPerTid[t] === maxJa);
                const besteTekster = besteTimes.map(t => {
                    const ikkeAvailableDenne = deltakere.filter(n => stemmer[n]?.[t] !== 'ja');
                    const parentes = ikkeAvailableDenne.length ? ` (${ikkeAvailableDenne.join(', ')} can't)` : '';
                    if (møte.heldagshendelse) {
                        return new Date(t + 'T00:00:00').toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' }) + parentes;
                    }
                    const s = new Date(t), e = new Date(s.getTime() + (møte.varighet||60)*60000);
                    const fmt = d => d.toLocaleString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false});
                    return s.toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short'}) + ' ' + fmt(s) + '–' + fmt(e) + parentes;
                }).join('<br>');
                analyseTekst = `<div style="background:#fef3c7;border:1px solid #fbbf24;border-radius:var(--rs);padding:10px 14px;margin-bottom:12px;font-size:0.9em;"><strong>Most can (${maxJa}/${antallParticipante}):</strong><br>${besteTekster}</div>`;
            }

            // Tabell
            let tabell = '';
            if (!visResponses) {
                tabell = '<p style="color:var(--tekst-sek);margin-top:8px;">No responses yet.</p>';
            } else {
                tabell = analyseTekst + '<div style="overflow-x:auto;">';

                if (møte.heldagshendelse) {
                    // Heldagshendelse: én tabell, én kolonne per dag
                    tabell += '<table class="resultater-tabell" style="margin-top:0;margin-bottom:12px;"><thead><tr><th style="min-width:80px;">Participant</th>';
                    møte.tider.forEach(tid => {
                        const dato = new Date(tid + 'T00:00:00').toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
                        tabell += `<th style="text-align:center;background:${tidFarge(tid)};padding:6px 8px;font-size:12px;">${dato}</th>`;
                    });
                    tabell += '</tr></thead><tbody>';
                    deltakere.forEach(navn => {
                        const navnEsc = navn.replace(/'/g, "\\'");
                        tabell += `<tr><td style="white-space:nowrap;"><div style="display:flex;align-items:center;gap:8px;"><button onclick="slettDeltaker('${møteId}','${navnEsc}')" title="Delete participant" style="background:none;border:none;cursor:pointer;color:#f87171;padding:0;line-height:1;flex-shrink:0;display:flex;align-items:center;" onmouseover="this.style.color='#dc2626'" onmouseout="this.style.color='#f87171'"><svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='3 6 5 6 21 6'/><path d='M19 6l-1 14H6L5 6'/><path d='M10 11v6'/><path d='M14 11v6'/><path d='M9 6V4h6v2'/></svg></button><strong>${navn}</strong></div></td>`;
                        møte.tider.forEach(tid => {
                            const v = stemmer[navn]?.[tid] || '–';
                            tabell += `<td style="text-align:center;background:${tidFarge(tid)};padding:6px 8px;" class="${v==='ja'?'stemme-ja':''}">​${v==='ja'?'✓':'<span style="color:#f87171;">✗</span>'}</td>`;
                        });
                        tabell += '</tr>';
                    });
                    tabell += '</tbody></table>';
                } else {
                    // Tidspunkter: flat table, one column per slot (same as user UI)
                    const sortedTider = [...møte.tider].sort();
                    const fmtTime = t => new Date(t).toLocaleString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false});
                    const fmtEnd  = t => fmtTime(new Date(t).getTime() + (møte.varighet||60)*60000);
                    tabell += '<table class="resultater-tabell" style="margin-top:0;"><thead><tr><th style="min-width:80px;white-space:nowrap;">Participant</th>';
                    sortedTider.forEach(tid => {
                        const dateLabel = new Date(tid).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
                        tabell += `<th style="text-align:center;background:${tidFarge(tid)};padding:4px 8px;white-space:nowrap;font-size:11px;">
                            <div style="font-weight:400;opacity:0.75;">${dateLabel}</div>
                            <div>${fmtTime(tid)}</div>
                            <div style="font-weight:400;font-size:10px;opacity:0.7;">–${fmtEnd(tid)}</div>
                        </th>`;
                    });
                    tabell += '</tr></thead><tbody>';
                    deltakere.forEach(navn => {
                        const navnEsc = navn.replace(/'/g, "\\'");
                        tabell += `<tr><td style="white-space:nowrap;"><div style="display:flex;align-items:center;gap:8px;"><button onclick="slettDeltaker('${møteId}','${navnEsc}')" title="Delete participant" style="background:none;border:none;cursor:pointer;color:#f87171;padding:0;line-height:1;flex-shrink:0;display:flex;align-items:center;" onmouseover="this.style.color='#dc2626'" onmouseout="this.style.color='#f87171'"><svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='3 6 5 6 21 6'/><path d='M19 6l-1 14H6L5 6'/><path d='M10 11v6'/><path d='M14 11v6'/><path d='M9 6V4h6v2'/></svg></button><strong>${navn}</strong></div></td>`;
                        sortedTider.forEach(tid => {
                            const v = stemmer[navn]?.[tid] || null;
                            tabell += `<td style="text-align:center;background:${tidFarge(tid)};padding:6px 8px;" class="${v==='ja'?'stemme-ja':''}">​${v==='ja'?'✓':'<span style="color:#f87171;">✗</span>'}</td>`;
                        });
                        tabell += '</tr>';
                    });
                    tabell += '</tbody></table>';
                }

                tabell += '</div>';


            }

            document.getElementById('detaljInnhold').innerHTML = `
                <button class="mobil-tilbake" onclick="mobilTilbake()">← Back</button>
                <div class="form-gruppe">
                    <label>Responses</label>
                    ${tabell}
                </div>
                <div class="form-gruppe">
                    <label>Meeting link</label>
                    <div class="deling-boks">
                        <input type="text" value="${link}" readonly>
                        <button class="btn-primær" onclick="kopierLink('${link}')">Copy</button>
                        <a href="${link}" target="_blank" rel="noopener" class="btn-primær" style="text-decoration:none;display:inline-flex;align-items:center;padding:10px 16px;border-radius:var(--rs);font-size:0.95em;font-weight:600;font-family:'Syne',sans-serif;cursor:pointer;">Open</a>
                    </div>
                </div>
                ${møte.heldagshendelse ? '' : `
                <div class="form-gruppe">
                    <label>Duration</label>
                    <div style="padding:8px;background:var(--primær-lys);border-radius:6px;">${varighetTekst(møte.varighet)}</div>
                </div>`}
                <div class="knapp-gruppe">
                    <button class="btn-sekundær" onclick="redigerMøte('${møteId}')">Edit</button>
                    <button class="btn-fare" onclick="slettMøte('${møteId}')">Delete</button>
                </div>`;
        }

        // ── Admin: Vis redigeringsskjema ──
        let timeplanDate = new Date();
        timeplanDate.setHours(0,0,0,0);

        function visSkjema(møteId) {
            const møte = møter[møteId];
            const erNy = møteId.startsWith('ny_');
            const erHeldag = møte.heldagshendelse || false;

            document.getElementById('detaljTitle').textContent = erNy ? 'Nytt møte' : 'Edit møte';
            document.getElementById('detaljSection').classList.add('vis');

            if (møte.tider && møte.tider.length > 0 && møte.tider[0] && !erHeldag) {
                timeplanDate = new Date(møte.tider[0]);
                timeplanDate.setHours(0,0,0,0);
            } else {
                timeplanDate = new Date();
                timeplanDate.setHours(0,0,0,0);
            }

            const varighetOpts = [15,30,45,60,90,120,180].map(v => {
                const tekst = v < 60 ? v+' min' : v===60 ? '1 hour' : v===90 ? '1.5 hours' : (v/60)+' timer';
                return `<option value="${v}" ${(møte.varighet||60)===v?'selected':''}>${tekst}</option>`;
            }).join('');

            document.getElementById('detaljInnhold').innerHTML = `
                <button class="mobil-tilbake" onclick="mobilTilbake()">← Back</button>
                <div class="form-gruppe">
                    <label>Title</label>
                    <input type="text" id="editTitle" placeholder="E.g. Team meeting" value="${møte.tittel || ''}">
                </div>
                <div class="form-gruppe">
                    <label>Description (optional)</label>
                    <textarea id="editBeskrivelse" placeholder="A few words about the meeting...">${møte.beskrivelse || ''}</textarea>
                </div>
                <div class="type-toggle">
                    <button id="toggleTid" class="${!erHeldag?'aktiv':''}" onclick="byttHendelsestype(false)">🕐 Time slots</button>
                    <button id="toggleHeldag" class="${erHeldag?'aktiv':''}" onclick="byttHendelsestype(true)">📅 All-day event</button>
                </div>
                <div id="tidspunktSeksjon" style="${erHeldag?'display:none':''}">
                    <div class="dato-varighet-rad">
                        <div class="form-gruppe">
                            <label>Date</label>
                            <input type="date" id="editDate" value="${datoTilString(timeplanDate)}" onchange="byttDate(this.value)">
                        </div>
                        <div class="form-gruppe">
                            <label>Duration</label>
                            <select id="editDuration" onchange="oppdaterTimeplan()" style="width:100%;padding:8px 6px;border:2px solid var(--kant);border-radius:var(--rs);font-size:0.9em;font-family:'Nunito',sans-serif;">${varighetOpts}</select>
                        </div>
                    </div>
                    <div class="form-gruppe">
                        <label>Select time slots <span style="font-weight:400;color:var(--tekst-sek);">— click in the schedule</span></label>
                        <div class="timeplan-nav">
                            <button class="timeplan-nav-knapp" onclick="endreTimeplanDag(-1)">←</button>
                            <div class="timeplan-dato" id="timeplanDateLabel"></div>
                            <button class="timeplan-nav-knapp" onclick="endreTimeplanDag(1)">→</button>
                        </div>
                        <div class="timeplan-wrapper" id="timeplanWrapper">
                            <div class="timeplan-grid" id="timeplanGrid"></div>
                        </div>
                    </div>
                </div>
                <div id="heldagSeksjon" style="${!erHeldag?'display:none':''}">
                    <div class="form-gruppe">
                        <label>Select days <span style="font-weight:400;color:var(--tekst-sek);">— click on days</span></label>
                        <div class="maaned-nav">
                            <button class="timeplan-nav-knapp" onclick="endreMaaned(-1)">←</button>
                            <div class="maaned-label" id="maanedLabel"></div>
                            <button class="timeplan-nav-knapp" onclick="endreMaaned(1)">→</button>
                        </div>
                        <div class="maaned-grid" id="maanedGrid"></div>
                    </div>
                </div>
                <div class="knapp-gruppe">
                    <button class="btn-primær" onclick="lagreMøte()">Save</button>
                    <button class="btn-sekundær" onclick="avbryt()">Cancel</button>
                </div>`;

            const varighetEl = document.getElementById('editDuration');
            if (varighetEl) varighetEl.value = møte.varighet || 60;

            if (erHeldag) {
                oppdaterMaanedKalender();
            } else {
                oppdaterTimeplan();
            }
        }

        function datoTilString(dato) {
            const y = dato.getFullYear();
            const m = String(dato.getMonth()+1).padStart(2,'0');
            const d = String(dato.getDate()).padStart(2,'0');
            return `${y}-${m}-${d}`;
        }

        let maanedDate = new Date();

        window.byttHendelsestype = (erHeldag) => {
            const møte = møter[currentMøteId];
            if (!møte) return;
            møte.heldagshendelse = erHeldag;
            møte.tider = [];
            document.getElementById('toggleTid').classList.toggle('aktiv', !erHeldag);
            document.getElementById('toggleHeldag').classList.toggle('aktiv', erHeldag);
            document.getElementById('tidspunktSeksjon').style.display = erHeldag ? 'none' : '';
            document.getElementById('heldagSeksjon').style.display = erHeldag ? '' : 'none';
            if (erHeldag) oppdaterMaanedKalender();
            else oppdaterTimeplan();
        };

        window.endreMaaned = (retning) => {
            maanedDate.setMonth(maanedDate.getMonth() + retning);
            oppdaterMaanedKalender();
        };

        function oppdaterMaanedKalender() {
            const grid = document.getElementById('maanedGrid');
            const label = document.getElementById('maanedLabel');
            if (!grid || !label) return;

            const møte = møter[currentMøteId];
            const valgteStr = new Set(møte?.tider || []);

            const år = maanedDate.getFullYear();
            const mnd = maanedDate.getMonth();
            const iDag = new Date(); iDag.setHours(0,0,0,0);

            label.textContent = maanedDate.toLocaleDateString('en-GB', { month:'long', year:'numeric' });

            const dagNavn = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
            let html = dagNavn.map(d => `<div class="maaned-dag-header">${d}</div>`).join('');

            const førsteDag = new Date(år, mnd, 1);
            // Norsk: mandag = 0
            let startOffset = (førsteDag.getDay() + 6) % 7;
            for (let i = 0; i < startOffset; i++) {
                html += `<div class="maaned-dag tom"></div>`;
            }

            const dagerIMnd = new Date(år, mnd + 1, 0).getDate();
            for (let dag = 1; dag <= dagerIMnd; dag++) {
                const dato = new Date(år, mnd, dag);
                const datoStr = datoTilString(dato);
                const erValgt = valgteStr.has(datoStr);
                const erIDag = dato.getTime() === iDag.getTime();
                const erFortid = dato < iDag;
                let klasse = 'maaned-dag';
                if (erValgt) klasse += ' valgt';
                else if (erFortid) klasse += ' fortid';
                else if (erIDag) klasse += ' i-dag';
                html += `<div class="${klasse}" onclick="toggleDag('${datoStr}')">${dag}</div>`;
            }

            grid.innerHTML = html;
        }

        window.toggleDag = (datoStr) => {
            const møte = møter[currentMøteId];
            if (!møte) return;
            const idx = møte.tider.indexOf(datoStr);
            if (idx >= 0) møte.tider.splice(idx, 1);
            else { møte.tider.push(datoStr); møte.tider.sort(); }
            oppdaterMaanedKalender();
        };

        window.byttDate = (verdi) => {
            timeplanDate = new Date(verdi + 'T00:00:00');
            oppdaterTimeplan();
        };

        window.endreTimeplanDag = (retning) => {
            timeplanDate.setDate(timeplanDate.getDate() + retning);
            document.getElementById('editDate').value = datoTilString(timeplanDate);
            oppdaterTimeplan();
        };

        window.oppdaterTimeplan = () => {
            const varighet = parseInt(document.getElementById('editDuration')?.value || 60);
            const slotMinutter = 15;
            const startTime = 7 * 60;  // 07:00
            const sluttTime = 21 * 60; // 21:00
            const antallSlots = (sluttTime - startTime) / slotMinutter;
            const slotHøyde = erMobil() ? 32 : 18;
            const blokkhøyde = (varighet / slotMinutter) * slotHøyde;

            const datoLabel = timeplanDate.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' });
            const labelEl = document.getElementById('timeplanDateLabel');
            if (labelEl) labelEl.textContent = datoLabel.charAt(0).toUpperCase() + datoLabel.slice(1);

            const møte = møter[currentMøteId];
            const tider = møte?.tider || [];

            // Finn valgte slots for denne dagen
            const dagStr = datoTilString(timeplanDate);
            const valgtePåDenneDagen = tider.filter(t => t.startsWith(dagStr));

            let html = '';
            for (let i = 0; i < antallSlots; i++) {
                const minutter = startTime + i * slotMinutter;
                const time = Math.floor(minutter / 60);
                const min = minutter % 60;
                const tidStr = `${String(time).padStart(2,'0')}:${String(min).padStart(2,'0')}`;
                const iso = `${dagStr}T${tidStr}`;
                const erHelTime = min === 45;
                const erHalvTime = min === 15;
                const erStiplet = min === 0 || min === 30;
                const visLabel = min === 0 || min === 30;
                const slotKlasse = erHelTime ? 'hel-time' : erStiplet ? 'stiplet' : 'halvtime';
                const visLabelStr = visLabel ? tidStr : '';

                html += `<div class="timeplan-slot ${slotKlasse}" onclick="toggleTid('${iso}')">
                    <div class="timeplan-tid">${visLabelStr}</div>
                    <div class="timeplan-innhold"></div>
                </div>`;
            }

            const grid = document.getElementById('timeplanGrid');
            if (!grid) return;

            // Bevar scroll-posisjon
            const wrapper = document.getElementById('timeplanWrapper');
            const scrollPosFør = wrapper ? wrapper.scrollTop : null;

            grid.innerHTML = html;

            // Scroll til 08:00 kun første gang (når scrollPos er 0 eller null)
            if (wrapper) {
                const åtteNull = 4 * slotHøyde;
                wrapper.scrollTop = (scrollPosFør && scrollPosFør > 0) ? scrollPosFør : åtteNull;
            }

            // Tegn blokker for valgte tider
            valgtePåDenneDagen.forEach(tid => {
                const tidDel = tid.split('T')[1];
                if (!tidDel) return;
                const [h, m] = tidDel.split(':').map(Number);
                const minutterFraStart = (h * 60 + m) - startTime;
                const slotIndex = minutterFraStart / slotMinutter;
                const topPx = slotIndex * slotHøyde;

                const blokk = document.createElement('div');
                blokk.className = 'timeplan-blokk';
                blokk.style.height = (blokkhøyde - 2) + 'px';
                blokk.style.zIndex = '10';
                blokk.textContent = tidDel.slice(0,5);
                blokk.onclick = (e) => { e.stopPropagation(); toggleTid(tid); };

                const innholdCeller = grid.querySelectorAll('.timeplan-innhold');
                if (innholdCeller[slotIndex]) {
                    const celle = innholdCeller[slotIndex];
                    celle.style.position = 'relative';
                    celle.style.overflow = 'visible';
                    celle.style.zIndex = '5';
                    blokk.style.top = '0';
                    blokk.style.position = 'absolute';
                    blokk.style.left = '4px';
                    blokk.style.right = '4px';
                    celle.appendChild(blokk);
                }
            });
        };

        window.toggleTid = (iso) => {
            const møte = møter[currentMøteId];
            if (!møte) return;
            const idx = møte.tider.indexOf(iso);
            if (idx >= 0) {
                møte.tider.splice(idx, 1);
            } else {
                møte.tider.push(iso);
                møte.tider.sort();
            }
            oppdaterTimeplan();
        };

        window.redigerMøte = id => {
            currentMøteId = id;
            redigeringsModus = true;
            visSkjema(id);
        };

        window.lagreMøte = async () => {
            const møte = møter[currentMøteId];
            møte.tittel = document.getElementById('editTitle').value.trim();
            møte.beskrivelse = document.getElementById('editBeskrivelse').value.trim();
            møte.varighet = parseInt(document.getElementById('editDuration')?.value || 60);
            møte.heldagshendelse = møte.heldagshendelse || false;
            møte.tider = møte.tider.filter(t => t);

            if (!møte.tittel || møte.tider.length === 0) {
                alert('Please enter a title and at least one time');
                return;
            }

            const erNy  = currentMøteId.startsWith('ny_');
            const nyId  = erNy ? Date.now().toString() : currentMøteId;
            møte.uid    = currentUser.uid;
            if (!møte.stemmer) møte.stemmer = {};

            try {
                await setDoc(doc(db, 'schedule_moter', nyId), møte);
                if (erNy) {
                    delete møter[currentMøteId];
                    møter[nyId] = møte;
                    currentMøteId = nyId;
                }
                redigeringsModus = false;
                renderMøteListe();
                renderMøteDetaljer(currentMøteId);
            } catch(e) { alert('Error saving: ' + e.message); }
        };

        window.avbryt = () => {
            if (currentMøteId?.startsWith('ny_')) {
                delete møter[currentMøteId];
                currentMøteId = null;
                document.getElementById('detaljSection').classList.remove('vis');
                if (erMobil()) visMobilListe();
            } else {
                redigeringsModus = false;
                renderMøteDetaljer(currentMøteId);
            }
            renderMøteListe();
        };

        window.slettMøte = async id => {
            if (!confirm('Delete this meeting?')) return;
            try {
                await deleteDoc(doc(db, 'schedule_moter', id));
                delete møter[id];
                currentMøteId = null;
                redigeringsModus = false;
                renderMøteListe();
                document.getElementById('detaljSection').classList.remove('vis');
                if (erMobil()) visMobilListe();
            } catch(e) { alert('Error deleting: ' + e.message); }
        };

        window.kopierLink = link => {
            navigator.clipboard.writeText(link);
            const knapp = document.querySelector('.deling-boks button');
            if (knapp) {
                knapp.textContent = 'Copied!';
                knapp.style.background = 'var(--primær-mørk)';
                setTimeout(() => {
                    knapp.textContent = 'Copy';
                    knapp.style.background = '';
                }, 2000);
            }
        };

        function varighetTekst(min) {
            if (!min) return '1 hour';
            if (min < 60) return min + ' minutter';
            if (min === 60) return '1 hour';
            if (min % 60 === 0) return (min / 60) + ' timer';
            return Math.floor(min/60) + ',' + (min%60/60*10) + ' time';
        }

        // ── Participant: Last panel ──
        async function lastParticipantPanel(møteId) {
            document.getElementById('deltakerTimesContainer').innerHTML = '';

            try {
                const snap = await getDoc(doc(db, 'schedule_moter', møteId));
                if (!snap.exists()) {
                    document.getElementById('deltakerMøteTitle').textContent = 'Meeting not found';
                    return;
                }
                const møte = snap.data();
                document.getElementById('deltakerMøteTitle').textContent = møte.tittel || '';
                document.getElementById('deltakerMøteBeskrivelse').textContent = møte.beskrivelse || '';

                // Always start fresh — clear any previously saved name
                localStorage.removeItem('deltaker_navn_' + møteId);
                document.getElementById('deltakerNavnInput').value = '';

                renderParticipantTimes(møteId, møte);
            } catch(e) {
                document.getElementById('deltakerMøteTitle').textContent = 'Failed to load';
                console.error(e);
            }
        }

        // Oppdater navn fra felt (debounced - venter 400ms etter siste tastetrykk)
        let navnDebounce = null;
        window.oppdaterNavn = (immediate) => {
            clearTimeout(navnDebounce);
            navnDebounce = setTimeout(() => {
                const navn = document.getElementById('deltakerNavnInput').value.trim();
                const inp  = document.getElementById('deltakerNavnInput');
                if (navn) {
                    // Sjekk om navn er tatt (uten å låse — bare vis advarsel)
                    getDoc(doc(db, 'schedule_moter', møteIdFraUrl)).then(snap => {
                        if (!snap.exists()) return;
                        const møte = snap.data();
                        const eksisterende = Object.keys(møte.stemmer || {});
                        const lagret = localStorage.getItem('deltaker_navn_' + møteIdFraUrl);
                        if (eksisterende.includes(navn) && lagret !== navn) {
                            inp.style.borderColor = '#f87171';
                            inp.title = 'This name is already taken — please choose another';
                        } else {
                            inp.style.borderColor = '';
                            inp.title = '';
                            localStorage.setItem('deltaker_navn_' + møteIdFraUrl, navn);
                            renderParticipantTimes(møteIdFraUrl, møte);
                        }
                    });
                } else {
                    inp.style.borderColor = '';
                    localStorage.removeItem('deltaker_navn_' + møteIdFraUrl);
                    getDoc(doc(db, 'schedule_moter', møteIdFraUrl)).then(snap => {
                        if (snap.exists()) renderParticipantTimes(møteIdFraUrl, snap.data());
                    });
                }
            }, immediate ? 0 : 400);
        };

        function renderParticipantTimes(møteId, møte) {
            const navn    = localStorage.getItem('deltaker_navn_' + møteId) || null;
            const stemmer = møte.stemmer || {};

            // Always show møte-header
            const møteHeaderEl = document.getElementById('møteHeader');
            if (møteHeaderEl) {
                møteHeaderEl.style.display = 'block';
                const h2 = document.getElementById('deltakerMøteTitle');
                if (h2) h2.textContent = møte.tittel || '';
                const besk = document.getElementById('deltakerMøteBeskrivelse');
                if (besk) besk.textContent = møte.beskrivelse || '';
            }
            if (møte.heldagshendelse) {
                renderParticipantKalender(møteId, møte, navn, stemmer);
                return;
            }

            // ── Day-view grid (all days with slots in one horizontal view) ──
            const fmt2 = d => new Date(d).toLocaleString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false});
            const sluttFmt = tid => fmt2(new Date(tid).getTime() + (møte.varighet||60)*60000);

            // Group slots by calendar date (YYYY-MM-DD), only days with actual slots
            const dayMap = {}; // 'YYYY-MM-DD' → [tid, ...]
            møte.tider.forEach(tid => {
                const dt = new Date(tid);
                const dateKey = dt.toISOString().slice(0,10);
                if (!dayMap[dateKey]) dayMap[dateKey] = [];
                dayMap[dateKey].push(tid);
            });
            const sortedDates = Object.keys(dayMap).sort();

            // Day-view constants
            const PX_PER_MIN = 1.0;
            const varMin = møte.varighet || 60;
            const minMinutes = 6 * 60;
            const maxMinutes = 22 * 60;
            const totalMin   = maxMinutes - minMinutes;
            const gridHeight = totalMin * PX_PER_MIN;

            // Find earliest slot for auto-scroll
            let earliestSlotMin = maxMinutes;
            møte.tider.forEach(tid => {
                const m = new Date(tid).getHours() * 60 + new Date(tid).getMinutes();
                if (m < earliestSlotMin) earliestSlotMin = m;
            });
            const scrollToPx = Math.max(0, (earliestSlotMin - minMinutes - 30) * PX_PER_MIN);

            // Hour labels
            const hours = [];
            for (let h = minMinutes / 60; h <= maxMinutes / 60; h++) hours.push(h);

            const timeAxisW = 40;
            const colMinW   = 80;
            const SCROLL_H  = window.innerWidth < 769 ? 260 : 420;
            const dayNames  = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

            let tiderHtml = '';

            // Instruction
            if (navn) {
                tiderHtml += `<div style="font-size:13px;color:var(--tekst-sek);margin-bottom:10px;">Tap the time slots you are available.</div>`;
            }

            // Outer wrapper: horizontal scroll, then vertical scroll inside
            tiderHtml += `<div style="overflow-x:auto;border:1px solid var(--kant);border-radius:8px;">`;

            // Day header row (outside the vertical scroll, stays visible)
            const totalGridW = timeAxisW + sortedDates.length * colMinW;
            tiderHtml += `<div style="display:flex;min-width:${totalGridW}px;border-bottom:1px solid var(--kant);background:var(--hvit);position:sticky;top:0;z-index:2;">`;
            tiderHtml += `<div style="width:${timeAxisW}px;flex-shrink:0;"></div>`;
            sortedDates.forEach(dateKey => {
                const dt = new Date(dateKey + 'T00:00:00');
                const dayLabel = dayNames[dt.getDay()];
                const dateLabel = dt.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
                // Show month header if first of that month
                tiderHtml += `<div style="flex:1;min-width:${colMinW}px;text-align:center;font-family:'Syne',sans-serif;font-weight:700;font-size:11px;color:var(--tekst-sek);padding:6px 4px 4px;">
                    ${dayLabel}<br><span style="font-weight:400;font-size:10px;">${dateLabel}</span>
                </div>`;
            });
            tiderHtml += `</div>`;

            // Vertical scroll container
            tiderHtml += `<div id="dayScrollMain" style="height:${SCROLL_H}px;overflow-y:auto;">`;

            // Grid body
            tiderHtml += `<div style="display:flex;position:relative;min-width:${totalGridW}px;">`;

            // Time axis
            tiderHtml += `<div style="width:${timeAxisW}px;flex-shrink:0;position:relative;height:${gridHeight}px;">`;
            hours.forEach(h => {
                const top = (h * 60 - minMinutes) * PX_PER_MIN;
                tiderHtml += `<div style="position:absolute;top:${top}px;right:6px;font-size:10px;color:var(--tekst-sek);font-family:'Syne',sans-serif;transform:translateY(-50%);white-space:nowrap;">${String(h).padStart(2,'0')}:00</div>`;
            });
            tiderHtml += `</div>`;

            // One column per date
            sortedDates.forEach(dateKey => {
                const slotsThisDay = dayMap[dateKey];
                tiderHtml += `<div style="flex:1;min-width:${colMinW}px;position:relative;height:${gridHeight}px;border-left:1px solid var(--kant);">`;

                // Hour gridlines
                hours.forEach(h => {
                    const top = (h * 60 - minMinutes) * PX_PER_MIN;
                    tiderHtml += `<div style="position:absolute;top:${top}px;left:0;right:0;border-top:1px solid var(--kant);opacity:0.35;"></div>`;
                });

                // Slot blocks
                slotsThisDay.forEach(tid => {
                    const dt = new Date(tid);
                    const startMin = dt.getHours() * 60 + dt.getMinutes();
                    const top    = (startMin - minMinutes) * PX_PER_MIN;
                    const height = varMin * PX_PER_MIN - 3;
                    const tidEsc = tid.replace(/'/g,"\\'");
                    const minStemme = navn ? (stemmer[navn]?.[tid] || null) : null;
                    let bg, border, textCol;
                    if (minStemme === 'ja') { bg='#d1fae5'; border='#6ee7b7'; textCol='#065f46'; }
                    else                    { bg='var(--primær-lys)'; border='var(--primær)'; textCol='var(--primær-mørk)'; }
                    const startTime = fmt2(tid);
                    const endTime   = sluttFmt(tid);
                    const cursor = navn ? 'pointer' : 'pointer';
                    const click  = `onclick="stemCycle('${møteId}','${tidEsc}')"`;
                    const hover  = `onmouseover="this.style.opacity='0.75'" onmouseout="this.style.opacity='1'"`;
                    tiderHtml += `<div ${click} ${hover}
                        style="position:absolute;top:${top}px;left:3px;right:3px;height:${height}px;
                               border-radius:5px;background:${bg};border:2px solid ${border};color:${textCol};
                               display:flex;align-items:center;justify-content:center;
                               font-family:'Syne',sans-serif;font-size:10px;font-weight:700;
                               text-align:center;cursor:${cursor};user-select:none;
                               transition:background 0.15s,border-color 0.15s;overflow:hidden;white-space:nowrap;">
                        ${startTime}–${endTime}
                    </div>`;
                });
                tiderHtml += `</div>`;
            });

            tiderHtml += `</div>`; // flex row
            tiderHtml += `</div>`; // vertical scroll
            tiderHtml += `</div>`; // outer horizontal scroll

            if (navn) {
                tiderHtml += `<div style="display:flex;gap:12px;font-size:11px;color:var(--tekst-sek);margin:8px 0 12px;flex-wrap:wrap;">
                    <span style="display:flex;align-items:center;gap:4px;"><span style="width:12px;height:12px;border-radius:3px;background:#d1fae5;border:1.5px solid #6ee7b7;display:inline-block;"></span> Available</span>
                    <span style="display:flex;align-items:center;gap:4px;"><span style="width:12px;height:12px;border-radius:3px;background:var(--primær-lys);border:1.5px solid var(--primær);display:inline-block;"></span> Not available</span>
                    <span style="opacity:0.6;">(Tap to toggle)</span>
                </div>`;
            }
            // Resultater for deltaker - samme tabell som admin
            const antallParticipante = Object.keys(stemmer).length;
            let resultatHtml = '';
            if (antallParticipante > 0) {
                const jaPerTid = {};
                møte.tider.forEach(tid => {
                    jaPerTid[tid] = Object.values(stemmer).filter(s => s[tid] === 'ja').length;
                });
                const maxJa = Math.max(...Object.values(jaPerTid), 0);
                const alleAvailableTimes = møte.tider.filter(t => jaPerTid[t] === antallParticipante);

                function tidFarge(tid) {
                    const ja = jaPerTid[tid] || 0;
                    if (ja === antallParticipante) return '#d1fae5';
                    if (ja === maxJa && ja > 0) return '#fef3c7';
                    return '#eff6ff';
                }

                // Single flat table: columns = all slots sorted by time, rows = participants
                const sortedTider = [...møte.tider].sort();
                const fmtTime = d => new Date(d).toLocaleString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false});
                const fmtEnd  = t => fmtTime(new Date(t).getTime() + (møte.varighet||60)*60000);

                let tabell = '<div id="timeslotScrollHintRow" style="display:flex;align-items:center;justify-content:flex-end;margin-bottom:4px;gap:6px;font-size:12px;color:var(--primær);font-weight:600;font-family:\'Syne\',sans-serif;"><span id="timeslotScrollHint">Scroll for more &rsaquo;</span></div><div style="position:relative;"><div id="timeslotOverviewScroll" style="overflow-x:auto;border-radius:8px;border:1px solid var(--kant);">';

                tabell += '<table class="resultater-tabell" style="margin-top:0;">';

                // Header row with date+time per column
                tabell += '<thead><tr><th style="min-width:80px;white-space:nowrap;">Participant</th>';
                sortedTider.forEach(tid => {
                    const dateLabel = new Date(tid).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
                    tabell += `<th style="text-align:center;background:${tidFarge(tid)};padding:4px 8px;white-space:nowrap;font-size:11px;">
                        <div style="font-weight:400;opacity:0.75;">${dateLabel}</div>
                        <div>${fmtTime(tid)}</div>
                        <div style="font-weight:400;font-size:10px;opacity:0.7;">–${fmtEnd(tid)}</div>
                    </th>`;
                });
                tabell += '</tr></thead><tbody>';

                // One row per participant
                Object.keys(stemmer).forEach(deltakerNavn => {
                    tabell += `<tr><td><strong>${deltakerNavn}</strong></td>`;
                    sortedTider.forEach(tid => {
                        const v = stemmer[deltakerNavn]?.[tid] || null;
                        tabell += `<td style="text-align:center;background:${tidFarge(tid)};padding:6px 8px;" class="${v==='ja'?'stemme-ja':''}">​${v==='ja'?'✓':'<span style="color:#f87171;">✗</span>'}</td>`;
                    });
                    tabell += '</tr>';
                });
                tabell += '</tbody></table></div><div id="timeslotScrollFade" style="position:absolute;top:0;right:0;bottom:0;width:56px;background:linear-gradient(to right,transparent,rgba(255,255,255,0.96));pointer-events:none;border-radius:0 8px 8px 0;transition:opacity 0.4s;"></div></div>';

                resultatHtml = `<div class="resultater-deltaker"><div class="resultater-deltaker-tittel">Overview</div>${tabell}</div>`;
            }

            const suksess = navn
                ? `<div style="display:flex;gap:10px;margin-top:16px;">
                    <button onclick="ingenAvTider('${møteId}')" style="flex:1;padding:14px 12px;background:#fee2e2;color:#991b1b;border:2px solid #fca5a5;border-radius:var(--rs);font-family:'Syne',sans-serif;font-weight:700;font-size:14px;cursor:pointer;" onmouseover="this.style.background='#fecaca'" onmouseout="this.style.background='#fee2e2'">None of the above</button>
                    <button onclick="lagreTidValg('${møteId}')" style="flex:1;padding:14px 12px;background:var(--primær);color:white;border:none;border-radius:var(--rs);font-family:'Syne',sans-serif;font-weight:700;font-size:14px;cursor:pointer;" onmouseover="this.style.background='var(--primær-mørk)'" onmouseout="this.style.background='var(--primær)'">Save my choices</button>
                  </div>`
                : '';

            document.getElementById('deltakerTimesContainer').innerHTML =
                tiderHtml + suksess + resultatHtml;

            // Auto-scroll vertical container to the earliest slot
            const dayScrollEl = document.getElementById('dayScrollMain');
            if (dayScrollEl) dayScrollEl.scrollTop = scrollToPx;

            // Show/hide scroll hint and fade for overview table
            const tsScrollEl  = document.getElementById('timeslotOverviewScroll');
            const tsHintRow   = document.getElementById('timeslotScrollHintRow');
            const tsHintEl    = document.getElementById('timeslotScrollHint');
            const tsFadeEl    = document.getElementById('timeslotScrollFade');
            if (tsScrollEl) {
                if (tsScrollEl.scrollWidth <= tsScrollEl.clientWidth) {
                    if (tsHintRow) tsHintRow.style.display = 'none';
                    if (tsFadeEl)  tsFadeEl.style.display  = 'none';
                } else {
                    tsScrollEl.addEventListener('scroll', () => {
                        if (tsHintEl) tsHintEl.style.opacity = '0';
                        if (tsFadeEl) tsFadeEl.style.opacity = '0';
                    }, { once: true });
                }
            }
        }

        function renderParticipantKalender(møteId, møte, navn, stemmer) {
            const valgteStr = new Set(møte.tider || []);
            const mineStemmer = navn ? (stemmer[navn] || {}) : {};

            // Finn alle måneder med valgte dager
            const månederMedDays = [...new Set(møte.tider.map(t => t.slice(0,7)))].sort();

            function byggKalender() {
                const dagNavn = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
                let html = '';

                // Render all months with dates stacked vertically — no navigation needed
                månederMedDays.forEach((mndKey, idx) => {
                    const [årstall, mndNr] = mndKey.split('-').map(Number);
                    const label = new Date(årstall, mndNr - 1, 1).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });

                    if (idx > 0) html += `<div style="border-top:2px solid var(--kant);margin:24px 0 0;"></div>`;
                    html += `<div style="font-family:'Syne',sans-serif;font-weight:700;font-size:15px;margin:${idx === 0 ? '4px' : '16px'} 0 10px;">${label}</div>`;
                    html += `<div class="maaned-grid">`;
                    html += dagNavn.map(d => `<div class="maaned-dag-header">${d}</div>`).join('');

                    const førsteDag = new Date(årstall, mndNr - 1, 1);
                    const startOffset = (førsteDag.getDay() + 6) % 7;
                    for (let i = 0; i < startOffset; i++) html += `<div class="deltaker-dag tom"></div>`;

                    const dagerIMnd = new Date(årstall, mndNr, 0).getDate();
                    for (let dag = 1; dag <= dagerIMnd; dag++) {
                        const datoStr = `${årstall}-${String(mndNr).padStart(2,'0')}-${String(dag).padStart(2,'0')}`;
                        if (!valgteStr.has(datoStr)) {
                            html += `<div class="deltaker-dag" style="opacity:0.25;cursor:default;">${dag}</div>`;
                            continue;
                        }
                        const svar = mineStemmer[datoStr] || null;
                        let klasse = 'deltaker-dag';
                        let svarTekst = '';
                        if (svar === 'ja') { klasse += ' kan'; svarTekst = '✓'; }
                        html += `<div class="${klasse}" onclick="stemKalender('${møteId}','${datoStr}')">
                            <div class="dag-nr">${dag}</div>
                            ${svarTekst ? `<div class="dag-svar">${svarTekst}</div>` : ''}
                        </div>`;
                    }
                    html += `</div>`;
                });

                // Buttons — always visible once user has a name
                const suksess = navn
                    ? `<div style="display:flex;gap:10px;margin-top:16px;">
                        <button onclick="ingenAvDisse('${møteId}')" style="flex:1;padding:14px 12px;background:#fee2e2;color:#991b1b;border:2px solid #fca5a5;border-radius:var(--rs);font-family:'Syne',sans-serif;font-weight:700;font-size:14px;cursor:pointer;" onmouseover="this.style.background='#fecaca'" onmouseout="this.style.background='#fee2e2'">None of the above</button>
                        <button onclick="lagreKalenderValg('${møteId}')" style="flex:1;padding:14px 12px;background:var(--primær);color:white;border:none;border-radius:var(--rs);font-family:'Syne',sans-serif;font-weight:700;font-size:14px;cursor:pointer;" onmouseover="this.style.background='var(--primær-mørk)'" onmouseout="this.style.background='var(--primær)'">Save my choices</button>
                    </div>`
                    : '';

                // Overview table (shown below the button)
                const antallParticipante = Object.keys(stemmer).length;
                let tabellHtml = '';
                if (antallParticipante > 0) {
                    const jaPerDag = {};
                    møte.tider.forEach(d => { jaPerDag[d] = Object.values(stemmer).filter(s => s[d] === 'ja').length; });
                    const maxJa = Math.max(...Object.values(jaPerDag), 0);

                    const fmt = d => new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
                    const tidFarge = d => {
                        const ja = jaPerDag[d] || 0;
                        if (ja === antallParticipante) return '#d1fae5';
                        if (ja === maxJa && ja > 0) return '#fef3c7';
                        return '#eff6ff';
                    };

                    let tabell = `<div style="margin-top:20px;border-top:2px solid var(--kant);padding-top:16px;"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;"><div style="font-family:'Syne',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--tekst-sek);">Overview</div><div id="overviewScrollHintRow" style="display:flex;align-items:center;gap:4px;font-size:12px;color:var(--primær);font-weight:600;font-family:'Syne',sans-serif;"><span id="overviewScrollHint">Scroll for more &rsaquo;</span></div></div><div style="position:relative;"><div id="overviewScroll" style="overflow-x:auto;border-radius:8px;border:1px solid var(--kant);">`;
                    tabell += '<table class="resultater-tabell"><thead><tr><th>Participant</th>';
                    møte.tider.forEach(d => { tabell += `<th style="text-align:center;background:${tidFarge(d)};padding:6px 8px;font-size:11px;">${fmt(d)}</th>`; });
                    tabell += '</tr></thead><tbody>';
                    Object.keys(stemmer).forEach(n => {
                        tabell += `<tr><td><strong>${n}</strong></td>`;
                        møte.tider.forEach(d => {
                            const v = stemmer[n]?.[d] || '–';
                            tabell += `<td style="text-align:center;background:${tidFarge(d)};" class="${v==='ja'?'stemme-ja':''}">​${v==='ja'?'✓':'<span style="color:#f87171;">✗</span>'}</td>`;
                        });
                        tabell += '</tr>';
                    });
                    tabell += `</tbody></table></div><div id="overviewScrollFade" style="position:absolute;top:0;right:0;bottom:0;width:56px;background:linear-gradient(to right,transparent,rgba(255,255,255,0.96));pointer-events:none;border-radius:0 8px 8px 0;transition:opacity 0.4s;"></div></div></div>`;
                    tabellHtml = tabell;
                }


                document.getElementById('deltakerTimesContainer').innerHTML = html + suksess + tabellHtml;

                // Fade scroll hint and gradient when user scrolls the overview, hide if not scrollable
                const scrollEl   = document.getElementById('overviewScroll');
                const hintRow    = document.getElementById('overviewScrollHintRow');
                const hintEl     = document.getElementById('overviewScrollHint');
                const fadeEl     = document.getElementById('overviewScrollFade');
                if (scrollEl) {
                    if (scrollEl.scrollWidth <= scrollEl.clientWidth) {
                        if (hintRow) hintRow.style.display = 'none';
                        if (fadeEl)  fadeEl.style.display  = 'none';
                    } else {
                        scrollEl.addEventListener('scroll', () => {
                            if (hintEl) hintEl.style.opacity = '0';
                            if (fadeEl) fadeEl.style.opacity = '0';
                        }, { once: true });
                    }
                }

                // Popup check (auto-show on first completion via calendar click)
            }

            byggKalender();
        }

        window.ingenAvTider = async (møteId) => {
            const navn = localStorage.getItem('deltaker_navn_' + møteId)
                      || document.getElementById('deltakerNavnInput')?.value.trim();
            if (!navn) return;
            try {
                const snap = await getDoc(doc(db, 'schedule_moter', møteId));
                if (!snap.exists()) return;
                const møte = snap.data();
                if (!møte.stemmer) møte.stemmer = {};
                if (!møte.stemmer[navn]) møte.stemmer[navn] = {};
                // Clear all time-slot votes for this user
                møte.tider.forEach(t => delete møte.stemmer[navn][t]);
                await setDoc(doc(db, 'schedule_moter', møteId), møte);
                renderParticipantTimes(møteId, møte);
            } catch(e) { alert('Error: ' + e.message); return; }
            const modal   = document.getElementById('thankYouModal');
            const titleEl = document.getElementById('thankYouModalTitle');
            const bodyEl  = document.getElementById('thankYouModalBody');
            if (!modal) return;
            titleEl.textContent = 'Response saved';
            bodyEl.textContent  = 'You have indicated that none of the options work for you.';
            modal.style.display = 'flex';
        };

        window.lagreTidValg = (møteId) => {
            const modal   = document.getElementById('thankYouModal');
            const titleEl = document.getElementById('thankYouModalTitle');
            const bodyEl  = document.getElementById('thankYouModalBody');
            if (!modal) return;
            if (!thankYouShown) {
                thankYouShown = true;
                titleEl.textContent = 'Thank you for your answers!';
                bodyEl.textContent  = 'Your responses have been saved.';
            } else {
                titleEl.textContent = 'Your changes are saved';
                bodyEl.textContent  = 'Your responses have been updated.';
            }
            modal.style.display = 'flex';
        };

        window.ingenAvDisse = async (møteId) => {
            const navn = localStorage.getItem('deltaker_navn_' + møteId)
                      || document.getElementById('deltakerNavnInput')?.value.trim();
            if (!navn) return;
            try {
                const snap = await getDoc(doc(db, 'schedule_moter', møteId));
                if (!snap.exists()) return;
                const møte = snap.data();
                if (!møte.stemmer) møte.stemmer = {};
                if (møte.stemmer[navn]) {
                    møte.tider.forEach(t => delete møte.stemmer[navn][t]);
                }
                await setDoc(doc(db, 'schedule_moter', møteId), møte);
                renderParticipantKalender(møteId, møte, navn, møte.stemmer);
            } catch(e) { alert('Error: ' + e.message); return; }

            const modal   = document.getElementById('thankYouModal');
            const titleEl = document.getElementById('thankYouModalTitle');
            const bodyEl  = document.getElementById('thankYouModalBody');
            if (!modal) return;
            titleEl.textContent = 'Response saved';
            bodyEl.textContent  = 'You have indicated that none of the options work for you.';
            modal.style.display = 'flex';
        };

        window.slettDeltaker = async (møteId, navn) => {
            if (!confirm(`Delete "${navn}" and all their responses?`)) return;
            try {
                const snap = await getDoc(doc(db, 'schedule_moter', møteId));
                if (!snap.exists()) return;
                const møte = snap.data();
                if (møte.stemmer && møte.stemmer[navn] !== undefined) {
                    delete møte.stemmer[navn];
                    await setDoc(doc(db, 'schedule_moter', møteId), møte);
                }
            } catch(e) { alert('Error: ' + e.message); }
        };

        window.lagreKalenderValg = (møteId) => {
            const modal   = document.getElementById('thankYouModal');
            const titleEl = document.getElementById('thankYouModalTitle');
            const bodyEl  = document.getElementById('thankYouModalBody');
            if (!modal) return;
            if (!thankYouShown) {
                thankYouShown = true;
                titleEl.textContent = 'Thank you for your answers!';
                bodyEl.textContent  = 'Your responses have been saved.';
            } else {
                titleEl.textContent = 'Your changes are saved';
                bodyEl.textContent  = 'Your responses have been updated.';
            }
            modal.style.display = 'flex';
        };

        function visNavnPåkrevd() {
            const modal = document.getElementById('navnPåkrevdModal');
            if (!modal) return;
            modal.style.display = 'flex';
        }

        window.stemKalender = async (møteId, datoStr) => {
            const lagretNavn = localStorage.getItem('deltaker_navn_' + møteId);
            const inputNavn  = document.getElementById('deltakerNavnInput')?.value.trim();
            const navn = lagretNavn || inputNavn;

            if (!navn) {
                visNavnPåkrevd();
                return;
            }
            try {
                const snap = await getDoc(doc(db, 'schedule_moter', møteId));
                if (!snap.exists()) return;
                const møte = snap.data();

                // Sjekk duplikat navn
                const eksisterende = Object.keys(møte.stemmer || {});
                const lagretNavn = localStorage.getItem('deltaker_navn_' + møteId);
                if (eksisterende.includes(navn) && lagretNavn !== navn) {
                    const inp = document.getElementById('deltakerNavnInput');
                    if (inp) {
                        inp.value = '';
                        inp.placeholder = '⚠ This name is taken — please choose another';
                        inp.style.borderColor = '#f87171';
                        setTimeout(() => { inp.style.borderColor = ''; inp.placeholder = 'Enter your name here...'; }, 4000);
                    }
                    return;
                }

                localStorage.setItem('deltaker_navn_' + møteId, navn);
                if (!møte.stemmer) møte.stemmer = {};
                if (!møte.stemmer[navn]) møte.stemmer[navn] = {};
                // Heldagshendelse: toggle ja/fjern (ingen nei)
                const nå = møte.stemmer[navn][datoStr];
                if (!nå || nå === 'nei') møte.stemmer[navn][datoStr] = 'ja';
                else delete møte.stemmer[navn][datoStr];
                await setDoc(doc(db, 'schedule_moter', møteId), møte);
                renderParticipantKalender(møteId, møte, navn, møte.stemmer || {});
            } catch(e) { alert('Error: ' + e.message); }
        };

        // Cycle through: null → 'ja' (for week-grid tap)
        window.stemCycle = async (møteId, tid) => {
            const navn = localStorage.getItem('deltaker_navn_' + møteId)
                      || document.getElementById('deltakerNavnInput')?.value.trim();
            if (!navn) {
                visNavnPåkrevd();
                return;
            }
            try {
                const snap = await getDoc(doc(db, 'schedule_moter', møteId));
                if (!snap.exists()) return;
                const møte = snap.data();
                if (!møte.stemmer) møte.stemmer = {};
                if (!møte.stemmer[navn]) møte.stemmer[navn] = {};
                const current = møte.stemmer[navn][tid] || null;
                if (current === 'ja') delete møte.stemmer[navn][tid];
                else                  møte.stemmer[navn][tid] = 'ja';
                localStorage.setItem('deltaker_navn_' + møteId, navn);
                await setDoc(doc(db, 'schedule_moter', møteId), møte);
                renderParticipantTimes(møteId, møte);
            } catch(e) { console.error(e); }
        };

    </script>

    <!-- Name required modal -->
    <div id="navnPåkrevdModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:10000;align-items:center;justify-content:center;">
        <div style="background:white;border-radius:16px;padding:36px 28px;text-align:center;max-width:300px;width:90%;box-shadow:0 8px 40px rgba(0,0,0,0.22);">
            <div style="font-family:'Syne',sans-serif;font-weight:800;font-size:18px;color:var(--tekst);margin-bottom:8px;">Enter your name first</div>
            <div style="font-size:14px;color:var(--tekst-sek);margin-bottom:24px;">Please enter your name in the field above before selecting dates.</div>
            <button onclick="document.getElementById('navnPåkrevdModal').style.display='none';document.getElementById('deltakerNavnInput')?.focus();" style="background:var(--primær);color:white;border:none;border-radius:var(--rs);padding:12px 32px;font-family:'Syne',sans-serif;font-weight:700;font-size:14px;cursor:pointer;" onmouseover="this.style.background='var(--primær-mørk)'" onmouseout="this.style.background='var(--primær)'">OK</button>
        </div>
    </div>
</body>
</html>
